<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Seller Approved - BR Digital Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f7fa;
  font-family:Arial,sans-serif;
  color:#17212b;
}

.header{
  background:#fff;
  padding:18px 15px;
  text-align:center;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
  font-size:25px;
  font-weight:800;
}

.logo span{
  color:#f47700;
}

.container{
  max-width:650px;
  margin:40px auto;
  padding:0 15px;
}

.card{
  background:#fff;
  border-radius:25px;
  padding:30px 22px;
  text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.10);
}

.check{
  width:110px;
  height:110px;
  margin:10px auto 20px;
  border-radius:50%;
  background:#16a34a;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:65px;
}

h1{
  color:#16834a;
  font-size:29px;
  margin:15px 0;
}

.subtitle{
  color:#555;
  line-height:1.6;
  font-size:16px;
}

.seller-name{
  background:#ecfdf5;
  color:#166534;
  padding:15px;
  border-radius:14px;
  margin:20px 0;
  font-weight:bold;
  font-size:18px;
}

.status{
  background:#dcfce7;
  color:#166534;
  padding:14px;
  border-radius:14px;
  margin:20px 0;
  line-height:1.5;
}

.login-btn,
.dashboard-btn{
  display:block;
  width:100%;
  border:0;
  border-radius:14px;
  padding:17px;
  margin-top:12px;
  font-size:18px;
  font-weight:800;
  text-decoration:none;
  cursor:pointer;
}

.login-btn{
  background:#1677ed;
  color:white;
}

.dashboard-btn{
  background:#f47700;
  color:white;
}

.home{
  display:block;
  margin-top:20px;
  color:#1677ed;
  font-weight:bold;
  text-decoration:none;
}

.message{
  margin-top:18px;
  padding:14px;
  border-radius:12px;
  background:#dbeafe;
  color:#1e40af;
  line-height:1.5;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">
    🏪 BR <span>Digital Marketplace</span>
  </div>
</header>


<div class="container">

  <div class="card">

    <div class="check">
      ✓
    </div>

    <h1>
      🎉 Congratulations!
    </h1>

    <div class="subtitle">
      Your Seller Account is Approved
    </div>


    <div
      id="sellerName"
      class="seller-name">
      Seller Account
    </div>


    <div class="status">

      ✅ <b>Seller Verification Completed</b>

      <br><br>

      आपका seller account अब approved है।
      अब आप login करके अपने products add कर सकते हैं।

    </div>


    <a
      href="seller-login.html"
      class="login-btn">
      🔐 Seller Login
    </a>


    <a
      href="seller-dashboard.html"
      class="dashboard-btn">
      🏪 Go to Seller Dashboard
    </a>


    <a
      href="index.html"
      class="home">
      ← Go to Marketplace Homepage
    </a>


    <div
      id="message"
      class="message hidden">
    </div>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://uryjmibcdfjfxoljrigt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_uYbJw0ARCCkCpQ9QB6FxaQ_JrIxtOOp";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   LOAD SELLER
========================= */

async function loadSeller(){

  const {
    data:{
      user
    }
  } =
  await db.auth.getUser();


  if(!user){

    return;
  }


  const {
    data:seller,
    error
  } =
  await db
    .from("sellers")
    .select(
      "business_name,owner_name,status,is_active"
    )
    .eq("user_id",user.id)
    .maybeSingle();


  if(error){

    console.error(error);
    return;

  }


  if(!seller){

    return;

  }


  document.getElementById(
    "sellerName"
  ).innerHTML =
    "🏪 " +
    escapeHTML(
      seller.business_name ||
      seller.owner_name ||
      "Seller"
    );


  /*
    अगर account approved नहीं है
    तो seller को वापस login पर भेजें।
  */

  if(
    seller.status !== "approved" ||
    seller.is_active !== true
  ){

    document.getElementById(
      "sellerName"
    ).innerHTML =
      "⏳ " +
      escapeHTML(
        seller.business_name ||
        "Seller"
      );

    document.getElementById(
      "message"
    ).className =
      "message";

    document.getElementById(
      "message"
    ).innerHTML =
      "⚠️ आपका seller account अभी approved नहीं है।";

  }

}


/* =========================
   HTML SAFE
========================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   START
========================= */

loadSeller();

</script>

</body>
</html>
