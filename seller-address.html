<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Address Details - BR Digital Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f7fa;
  font-family:Arial,sans-serif;
  color:#17212b;
}

.header{
  background:#fff;
  padding:20px 15px;
  text-align:center;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
  font-size:27px;
  font-weight:800;
}

.logo span{
  color:#ff7900;
}

.container{
  max-width:620px;
  margin:32px auto;
  padding:0 15px;
}

.card{
  background:#fff;
  border-radius:24px;
  padding:28px 22px;
  box-shadow:0 8px 30px rgba(0,0,0,.10);
}

.step{
  display:inline-block;
  background:#1677ed;
  color:#fff;
  padding:8px 15px;
  border-radius:20px;
  font-weight:bold;
  margin-bottom:15px;
}

h1{
  margin:4px 0 10px;
  color:#f47700;
  font-size:30px;
}

.subtitle{
  color:#666;
  font-size:16px;
  line-height:1.5;
  margin-bottom:25px;
}

label{
  display:block;
  font-size:16px;
  font-weight:700;
  margin:18px 0 8px;
}

.required{
  color:red;
}

input,
select,
textarea{
  width:100%;
  padding:16px;
  border:1px solid #d5d5d5;
  border-radius:13px;
  font-size:16px;
  outline:none;
  background:#fff;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#1677ed;
}

textarea{
  min-height:110px;
  resize:vertical;
}

.same-address{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:20px;
  padding:14px;
  background:#f5f9ff;
  border-radius:13px;
}

.same-address input{
  width:20px;
  height:20px;
  flex:none;
}

.location-box{
  margin-top:20px;
  padding:18px;
  border:1px solid #dbe5f0;
  border-radius:15px;
  background:#f8fbff;
}

.location-title{
  font-weight:800;
  font-size:17px;
  margin-bottom:7px;
}

.location-text{
  color:#666;
  font-size:14px;
  line-height:1.5;
}

.location-btn{
  margin-top:12px;
  width:100%;
  padding:13px;
  border:0;
  border-radius:12px;
  background:#16834a;
  color:white;
  font-size:15px;
  font-weight:700;
}

.coordinates{
  margin-top:10px;
  font-size:13px;
  color:#555;
  word-break:break-word;
}

button{
  cursor:pointer;
}

.continue{
  width:100%;
  border:0;
  border-radius:14px;
  padding:17px;
  font-size:18px;
  font-weight:800;
  background:#1677ed;
  color:#fff;
  margin-top:25px;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#f47700;
  font-weight:bold;
  text-decoration:none;
}

.message{
  display:none;
  margin-top:18px;
  padding:15px;
  border-radius:12px;
  text-align:center;
  line-height:1.5;
}

.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.info{
  display:block;
  background:#dbeafe;
  color:#1e40af;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">
    🏪 BR <span>Digital Marketplace</span>
  </div>
</div>

<div class="container">

<div class="card">

  <div class="step">3️⃣ Step 3</div>

  <h1>Address Details 📍</h1>

  <div class="subtitle">
    Add your shop / business address
  </div>

  <!-- SHOP ADDRESS -->

  <label>
    Shop Address <span class="required">*</span>
  </label>

  <textarea
    id="shopAddress"
    placeholder="House/Shop No., Main Road, Area..."
  ></textarea>

  <!-- CITY -->

  <label>
    City <span class="required">*</span>
  </label>

  <input
    id="city"
    type="text"
    placeholder="Enter city"
  >

  <!-- STATE -->

  <label>
    State <span class="required">*</span>
  </label>

  <select id="state">

    <option value="">
      Select State
    </option>

    <option value="Andhra Pradesh">Andhra Pradesh</option>
    <option value="Arunachal Pradesh">Arunachal Pradesh</option>
    <option value="Assam">Assam</option>
    <option value="Bihar">Bihar</option>
    <option value="Chhattisgarh">Chhattisgarh</option>
    <option value="Goa">Goa</option>
    <option value="Gujarat">Gujarat</option>
    <option value="Haryana">Haryana</option>
    <option value="Himachal Pradesh">Himachal Pradesh</option>
    <option value="Jharkhand">Jharkhand</option>
    <option value="Karnataka">Karnataka</option>
    <option value="Kerala">Kerala</option>
    <option value="Madhya Pradesh">Madhya Pradesh</option>
    <option value="Maharashtra">Maharashtra</option>
    <option value="Manipur">Manipur</option>
    <option value="Meghalaya">Meghalaya</option>
    <option value="Mizoram">Mizoram</option>
    <option value="Nagaland">Nagaland</option>
    <option value="Odisha">Odisha</option>
    <option value="Punjab">Punjab</option>
    <option value="Rajasthan">Rajasthan</option>
    <option value="Sikkim">Sikkim</option>
    <option value="Tamil Nadu">Tamil Nadu</option>
    <option value="Telangana">Telangana</option>
    <option value="Tripura">Tripura</option>
    <option value="Uttar Pradesh">Uttar Pradesh</option>
    <option value="Uttarakhand">Uttarakhand</option>
    <option value="West Bengal">West Bengal</option>
    <option value="Delhi">Delhi</option>

  </select>

  <!-- PIN -->

  <label>
    PIN Code <span class="required">*</span>
  </label>

  <input
    id="pincode"
    type="text"
    inputmode="numeric"
    maxlength="6"
    placeholder="Example: 813209"
  >

  <!-- SAME ADDRESS -->

  <label class="same-address">

    <input
      id="sameAddress"
      type="checkbox"
    >

    <span>
      Same as personal address
    </span>

  </label>

  <!-- LOCATION -->

  <div class="location-box">

    <div class="location-title">
      📍 Shop Location
    </div>

    <div class="location-text">
      Location permission देने पर आपकी shop की
      approximate GPS location save की जा सकती है।
    </div>

    <button
      type="button"
      class="location-btn"
      onclick="getLocation()"
    >
      📍 Use My Current Location
    </button>

    <div
      id="coordinates"
      class="coordinates"
    >
      Location not selected
    </div>

  </div>

  <button
    class="continue"
    onclick="saveAddress()"
  >
    Continue →
  </button>

  <div
    id="message"
    class="message"
  ></div>

  <a
    href="seller-business.html"
    class="back"
  >
    ← Back to Business Details
  </a>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://uryjmibcdfjfxoljrigt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_uYbJw0ARCCkCpQ9QB6FxaQ_JrIxtOOp";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   VARIABLES
========================= */

let latitude = null;
let longitude = null;


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

  const box =
    document.getElementById("message");

  box.className =
    "message " + type;

  box.innerHTML = text;
}


/* =========================
   GET LOCATION
========================= */

function getLocation(){

  if(!navigator.geolocation){

    showMessage(
      "❌ आपके device में location support नहीं है।",
      "error"
    );

    return;
  }


  showMessage(
    "📍 Location प्राप्त की जा रही है...",
    "info"
  );


  navigator.geolocation.getCurrentPosition(

    function(position){

      latitude =
        position.coords.latitude;

      longitude =
        position.coords.longitude;


      document.getElementById(
        "coordinates"
      ).innerHTML =
        "✅ Location selected<br>" +
        "Latitude: " + latitude +
        "<br>" +
        "Longitude: " + longitude;


      showMessage(
        "✅ Shop location मिल गई।",
        "success"
      );

    },

    function(error){

      console.error(error);

      showMessage(
        "❌ Location permission नहीं मिली। आप बिना GPS के भी address save कर सकते हैं।",
        "error"
      );

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:0
    }

  );

}


/* =========================
   SAVE ADDRESS
========================= */

async function saveAddress(){

  const shopAddress =
    document
    .getElementById("shopAddress")
    .value
    .trim();

  const city =
    document
    .getElementById("city")
    .value
    .trim();

  const state =
    document
    .getElementById("state")
    .value;

  const pincode =
    document
    .getElementById("pincode")
    .value
    .trim();


  /* VALIDATION */

  if(!shopAddress){

    showMessage(
      "❌ Shop Address भरें।",
      "error"
    );

    return;
  }


  if(!city){

    showMessage(
      "❌ City भरें।",
      "error"
    );

    return;
  }


  if(!state){

    showMessage(
      "❌ State select करें।",
      "error"
    );

    return;
  }


  if(!/^[0-9]{6}$/.test(pincode)){

    showMessage(
      "❌ PIN Code 6 digits का होना चाहिए।",
      "error"
    );

    return;
  }


  showMessage(
    "⏳ Address save हो रहा है...",
    "info"
  );


  try{

    /* CHECK USER */

    const {
      data:{
        user
      },
      error:userError
    } =
      await db.auth.getUser();


    if(userError || !user){

      showMessage(
        "❌ Seller login नहीं है। पहले Seller Account में login करें।",
        "error"
      );

      return;
    }


    /* UPDATE SELLER */

    const updateData = {

      shop_address:
        shopAddress,

      city:
        city,

      state:
        state,

      pincode:
        pincode,

      latitude:
        latitude,

      longitude:
        longitude,

      updated_at:
        new Date().toISOString()

    };


    const {
      error
    } =
      await db
      .from("sellers")
      .update(updateData)
      .eq("user_id",user.id);


    if(error){

      console.error(error);

      showMessage(
        "❌ Database Error: " +
        error.message,
        "error"
      );

      return;
    }


    showMessage(
      "✅ Address Details successfully save हो गईं!<br><br>" +
      "⏭️ अब Step 4: GST Details खुलेगा...",
      "success"
    );


    setTimeout(function(){

      window.location.href =
        "seller-gst.html";

    },1200);


  }catch(error){

    console.error(error);

    showMessage(
      "❌ Error: " +
      error.message,
      "error"
    );

  }

}

</script>

</body>
</html>
