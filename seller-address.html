<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Address Details - BR Digital Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f7fa;
  font-family:Arial,sans-serif;
  color:#17212b;
}

.header{
  background:#fff;
  padding:22px 15px;
  text-align:center;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
  font-size:27px;
  font-weight:800;
}

.logo span{
  color:#ff7900;
}

.container{
  max-width:650px;
  margin:30px auto;
  padding:0 15px;
}

.card{
  background:#fff;
  border-radius:24px;
  padding:28px 22px;
  box-shadow:0 8px 30px rgba(0,0,0,.10);
}

.step{
  display:inline-block;
  background:#1677ed;
  color:#fff;
  padding:8px 15px;
  border-radius:20px;
  font-weight:bold;
  margin-bottom:15px;
}

h1{
  margin:5px 0 8px;
  color:#f47700;
  font-size:31px;
}

.subtitle{
  color:#666;
  font-size:17px;
  margin-bottom:25px;
}

label{
  display:block;
  font-size:17px;
  font-weight:700;
  margin:18px 0 7px;
}

.required{
  color:red;
}

textarea,
input,
select{
  width:100%;
  padding:16px;
  border:1px solid #d5d5d5;
  border-radius:13px;
  font-size:16px;
  outline:none;
  background:#fff;
}

textarea{
  min-height:145px;
  resize:vertical;
}

textarea:focus,
input:focus,
select:focus{
  border-color:#1677ed;
}

.location-box{
  margin-top:22px;
  padding:18px;
  border:1px solid #dce5ef;
  background:#f7fbff;
  border-radius:18px;
}

.location-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:8px;
}

.location-text{
  color:#666;
  line-height:1.5;
  margin-bottom:15px;
}

.location-btn{
  width:100%;
  border:0;
  border-radius:13px;
  padding:16px;
  background:#16884d;
  color:#fff;
  font-size:17px;
  font-weight:800;
}

.location-btn:disabled{
  opacity:.7;
}

.location-result{
  margin-top:14px;
  padding:13px;
  border-radius:12px;
  background:#ecfdf3;
  color:#166534;
  line-height:1.5;
  display:none;
}

.same-address{
  margin-top:18px;
  padding:16px;
  background:#f3f7ff;
  border-radius:15px;
  display:flex;
  align-items:center;
  gap:12px;
  font-size:17px;
  font-weight:700;
}

.same-address input{
  width:22px;
  height:22px;
  flex:none;
}

.message{
  display:none;
  margin-top:18px;
  padding:15px;
  border-radius:12px;
  text-align:center;
  line-height:1.5;
}

.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.continue{
  width:100%;
  border:0;
  border-radius:14px;
  padding:17px;
  margin-top:24px;
  background:#1677ed;
  color:#fff;
  font-size:18px;
  font-weight:800;
}

.back{
  display:block;
  text-align:center;
  margin-top:22px;
  color:#f47700;
  font-weight:bold;
  text-decoration:none;
}

.small{
  color:#777;
  font-size:13px;
  margin-top:6px;
}

@media(max-width:560px){
  .container{
    margin:15px auto;
  }

  .card{
    padding:25px 16px;
    border-radius:20px;
  }

  h1{
    font-size:29px;
  }
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">
    🏪 BR <span>Digital Marketplace</span>
  </div>
</div>

<div class="container">

<div class="card">

  <div class="step">4️⃣ Step 4</div>

  <h1>Address Details 📍</h1>

  <div class="subtitle">
    Add your shop / business address
  </div>


  <!-- SHOP ADDRESS -->

  <label>
    Shop Address <span class="required">*</span>
  </label>

  <textarea
    id="shopAddress"
    placeholder="House/Shop No., Main Road, Area..."
  ></textarea>


  <!-- CITY -->

  <label>
    City <span class="required">*</span>
  </label>

  <input
    id="city"
    type="text"
    placeholder="Enter city"
  >


  <!-- STATE -->

  <label>
    State <span class="required">*</span>
  </label>

  <select id="state">
    <option value="">Select State</option>
  </select>


  <!-- PIN -->

  <label>
    PIN Code <span class="required">*</span>
  </label>

  <input
    id="pincode"
    type="tel"
    maxlength="6"
    inputmode="numeric"
    placeholder="Enter 6 digit PIN Code"
  >

  <div class="small">
    PIN Code डालने पर City और State automatically आएगा।
  </div>


  <!-- SAME ADDRESS -->

  <label class="same-address">
    <input id="sameAddress" type="checkbox">
    <span>Same as personal address</span>
  </label>


  <!-- LIVE LOCATION -->

  <div class="location-box">

    <div class="location-title">
      📍 Shop Location
    </div>

    <div class="location-text">
      Location permission देने पर आपकी shop की
      current GPS location और address automatically
      प्राप्त करने की कोशिश की जाएगी।
    </div>

    <button
      id="locationBtn"
      class="location-btn"
      onclick="getCurrentLocation()"
    >
      📍 Use My Current Location
    </button>

    <div
      id="locationResult"
      class="location-result"
    ></div>

  </div>


  <div id="message" class="message"></div>


  <button
    class="continue"
    onclick="saveAddress()"
  >
    Continue →
  </button>

  <a href="seller-business.html" class="back">
    ← Back
  </a>

</div>

</div>


<script>

const SUPABASE_URL =
"https://uryjmibcdfjfxoljrigt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_uYbJw0ARCCkCpQ9QB6FxaQ_JrIxtOOp";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   STATE LIST
========================= */

const states = [
"Andhra Pradesh",
"Arunachal Pradesh",
"Assam",
"Bihar",
"Chhattisgarh",
"Goa",
"Gujarat",
"Haryana",
"Himachal Pradesh",
"Jharkhand",
"Karnataka",
"Kerala",
"Madhya Pradesh",
"Maharashtra",
"Manipur",
"Meghalaya",
"Mizoram",
"Nagaland",
"Odisha",
"Punjab",
"Rajasthan",
"Sikkim",
"Tamil Nadu",
"Telangana",
"Tripura",
"Uttar Pradesh",
"Uttarakhand",
"West Bengal",
"Andaman and Nicobar Islands",
"Chandigarh",
"Dadra and Nagar Haveli and Daman and Diu",
"Delhi",
"Jammu and Kashmir",
"Ladakh",
"Lakshadweep",
"Puducherry"
];

const stateBox =
document.getElementById("state");

states.forEach(function(name){

  const option =
  document.createElement("option");

  option.value=name;
  option.textContent=name;

  stateBox.appendChild(option);

});


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

  const box =
  document.getElementById("message");

  box.className =
  "message " + type;

  box.innerHTML=text;

  box.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });
}


/* =========================
   PIN CODE LOOKUP
========================= */

document
.getElementById("pincode")
.addEventListener("input",function(){

  let pin=this.value
  .replace(/\D/g,"")
  .slice(0,6);

  this.value=pin;

  if(pin.length===6){

    lookupPin(pin);

  }

});


async function lookupPin(pin){

  try{

    const response =
    await fetch(
      "https://api.postalpincode.in/pincode/" + pin
    );

    const result =
    await response.json();

    if(
      !Array.isArray(result) ||
      !result[0] ||
      result[0].Status !== "Success" ||
      !result[0].PostOffice?.length
    ){

      showMessage(
        "❌ यह PIN Code नहीं मिला। कृपया सही PIN Code डालें।",
        "error"
      );

      return;
    }


    const post =
    result[0].PostOffice[0];


    /* CITY */

    const city =
    post.District ||
    post.Block ||
    post.Region ||
    "";

    if(city){

      document
      .getElementById("city")
      .value=city;

    }


    /* STATE */

    const stateName =
    post.State || "";

    if(stateName){

      let found=false;

      for(
        let i=0;
        i<stateBox.options.length;
        i++
      ){

        if(
          stateBox.options[i]
          .value
          .toLowerCase() ===
          stateName.toLowerCase()
        ){

          stateBox.selectedIndex=i;
          found=true;
          break;

        }

      }

      if(!found){

        const option =
        document.createElement("option");

        option.value=stateName;
        option.textContent=stateName;

        stateBox.appendChild(option);

        stateBox.value=stateName;

      }

    }


    /* AREA */

    const area =
    post.Name ||
    post.Block ||
    "";

    if(area){

      const addressBox =
      document.getElementById("shopAddress");

      if(!addressBox.value.trim()){

        addressBox.value =
          area + ", " +
          city + ", " +
          stateName;

      }

    }

    showMessage(
      "✅ PIN Code से City और State automatically मिल गया।",
      "success"
    );

  }catch(error){

    console.error(error);

    showMessage(
      "⚠️ PIN Code information अभी प्राप्त नहीं हो सकी।",
      "error"
    );

  }

}


/* =========================
   GPS LOCATION
========================= */

let latitude=null;
let longitude=null;


function getCurrentLocation(){

  const button =
  document.getElementById("locationBtn");

  const result =
  document.getElementById("locationResult");


  if(!navigator.geolocation){

    showMessage(
      "❌ आपके browser में GPS location उपलब्ध नहीं है।",
      "error"
    );

    return;
  }


  button.disabled=true;

  button.textContent =
  "📍 Location मिल रही है...";


  navigator.geolocation.getCurrentPosition(

    async function(position){

      latitude =
      position.coords.latitude;

      longitude =
      position.coords.longitude;


      try{

        /*
          Reverse Geocoding:
          GPS → Address
        */

        const url =
        "https://api.bigdatacloud.net/data/" +
        "reverse-geocode-client" +
        "?latitude=" + latitude +
        "&longitude=" + longitude +
        "&localityLanguage=en";


        const response =
        await fetch(url);

        const data =
        await response.json();


        const locality =
        data.locality ||
        data.city ||
        data.localityInfo?.administrative?.[2]?.name ||
        "";

        const district =
        data.principalSubdivision ||
        "";

        const country =
        data.countryName ||
        "";


        /*
          PIN
        */

        const postcode =
        data.postcode ||
        data.postalCode ||
        "";


        /*
          FULL ADDRESS
        */

        let addressParts=[];


        if(data.locality)
          addressParts.push(data.locality);

        if(data.district)
          addressParts.push(data.district);

        if(data.city &&
           data.city !== data.locality)
          addressParts.push(data.city);

        if(data.principalSubdivision)
          addressParts.push(data.principalSubdivision);

        if(postcode)
          addressParts.push(postcode);


        const fullAddress =
        addressParts
        .filter(Boolean)
        .join(", ");


        /*
          ADDRESS BOX
        */

        if(fullAddress){

          document
          .getElementById("shopAddress")
          .value=fullAddress;

        }


        /*
          CITY
        */

        if(locality){

          document
          .getElementById("city")
          .value=locality;

        }


        /*
          STATE
        */

        if(district){

          for(
            let i=0;
            i<stateBox.options.length;
            i++
          ){

            if(
              stateBox.options[i]
              .value
              .toLowerCase()
              .includes(
                district.toLowerCase()
              )
            ){

              stateBox.selectedIndex=i;
              break;

            }

          }

        }


        if(postcode){

          document
          .getElementById("pincode")
          .value=postcode;

        }


        result.style.display="block";

        result.innerHTML =
          "✅ Location selected<br>" +
          "📍 " +
          (fullAddress ||
          "Current location found") +
          "<br><br>" +
          "Latitude: " +
          latitude +
          "<br>" +
          "Longitude: " +
          longitude;


        button.textContent =
        "📍 Location Selected ✓";

        showMessage(
          "✅ Current location और address मिल गया।",
          "success"
        );


      }catch(error){

        console.error(error);

        result.style.display="block";

        result.innerHTML =
          "✅ GPS location selected<br>" +
          "Latitude: " +
          latitude +
          "<br>" +
          "Longitude: " +
          longitude +
          "<br><br>" +
          "Address automatic नहीं मिल पाया। Address manually भर सकते हैं।";


        button.textContent =
        "📍 Location Selected ✓";

      }


      button.disabled=false;

    },


    function(error){

      console.error(error);

      button.disabled=false;

      button.textContent =
      "📍 Use My Current Location";


      if(error.code===1){

        showMessage(
          "❌ Location permission allow करें, फिर दोबारा कोशिश करें।",
          "error"
        );

      }else{

        showMessage(
          "❌ Current location नहीं मिल सकी। GPS/Location ON करके दोबारा कोशिश करें।",
          "error"
        );

      }

    },

    {
      enableHighAccuracy:true,
      timeout:15000,
      maximumAge:0
    }

  );

}


/* =========================
   SAVE ADDRESS
========================= */

async function saveAddress(){

  const address =
  document
  .getElementById("shopAddress")
  .value.trim();

  const city =
  document
  .getElementById("city")
  .value.trim();

  const state =
  document
  .getElementById("state")
  .value;

  const pincode =
  document
  .getElementById("pincode")
  .value.trim();


  /* VALIDATION */

  if(!address){

    showMessage(
      "❌ Shop Address भरें।",
      "error"
    );

    return;
  }


  if(!city){

    showMessage(
      "❌ City भरें।",
      "error"
    );

    return;
  }


  if(!state){

    showMessage(
      "❌ State select करें।",
      "error"
    );

    return;
  }


  if(!/^[0-9]{6}$/.test(pincode)){

    showMessage(
      "❌ सही 6 digit PIN Code डालें।",
      "error"
    );

    return;
  }


  /* CURRENT USER */

  const {
    data:{
      user
    }
  } =
  await db.auth.getUser();


  if(!user){

    showMessage(
      "❌ Seller login session नहीं मिली। पहले Seller Login करें।",
      "error"
    );

    return;
  }


  showMessage(
    "⏳ Address save हो रहा है...",
    "success"
  );


  /*
    Seller record को user_id से update करेंगे
  */

  const updateData={

    shop_address:address,

    city:city,

    state:state,

    pincode:pincode,

    updated_at:new Date().toISOString()

  };


  /*
    GPS मिला है तो latitude/longitude भी save होंगे
  */

  if(
    latitude !== null &&
    longitude !== null
  ){

    updateData.latitude=latitude;
    updateData.longitude=longitude;

  }


  const {
    error
  } =
  await db
  .from("sellers")
  .update(updateData)
  .eq("user_id",user.id);


  if(error){

    console.error(error);

    showMessage(
      "❌ Address save नहीं हुआ: " +
      error.message,
      "error"
    );

    return;
  }


  showMessage(
    "✅ Shop Address successfully save हो गया!<br><br>" +
    "⏭️ अब अगला Step: GST Details",
    "success"
  );


  setTimeout(function(){

    window.location.href =
    "seller-gst.html";

  },1200);

}


/* =========================
   LOAD EXISTING ADDRESS
========================= */

async function loadExistingAddress(){

  const {
    data:{
      user
    }
  } =
  await db.auth.getUser();


  if(!user) return;


  const {
    data,
    error
  } =
  await db
  .from("sellers")
  .select(
    "shop_address,city,state,pincode,latitude,longitude"
  )
  .eq("user_id",user.id)
  .maybeSingle();


  if(error){

    console.error(error);
    return;

  }


  if(!data) return;


  if(data.shop_address){

    document
    .getElementById("shopAddress")
    .value=data.shop_address;

  }


  if(data.city){

    document
    .getElementById("city")
    .value=data.city;

  }


  if(data.state){

    document
    .getElementById("state")
    .value=data.state;

  }


  if(data.pincode){

    document
    .getElementById("pincode")
    .value=data.pincode;

  }


  if(
    data.latitude !== null &&
    data.longitude !== null
  ){

    latitude=data.latitude;
    longitude=data.longitude;

    const result =
    document.getElementById(
      "locationResult"
    );

    result.style.display="block";

    result.innerHTML =
      "✅ Saved shop location<br>" +
      "Latitude: " +
      latitude +
      "<br>" +
      "Longitude: " +
      longitude;

  }

}


/* START */

loadExistingAddress();

</script>

</body>
</html>
