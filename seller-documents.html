<!DOCTYPE html>
<html lang="hi">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Documents - BR Digital Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f6fa;
  color:#17202a;
}

.header{
  background:#fff;
  padding:18px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 2px 10px #0001;
}

.brand{
  font-size:25px;
  font-weight:900;
}

.brand span{
  color:#ef7d00;
}

.back{
  text-decoration:none;
  color:#1677ff;
  font-weight:800;
  font-size:17px;
}

.main{
  max-width:1100px;
  margin:25px auto;
  padding:0 18px;
}

.hero{
  background:#fff;
  border-radius:22px;
  padding:28px;
  box-shadow:0 4px 18px #0000000d;
  margin-bottom:20px;
}

.hero h1{
  margin:0 0 10px;
  color:#ef7d00;
  font-size:38px;
}

.hero p{
  margin:0;
  color:#667085;
  font-size:18px;
  line-height:1.5;
}

.message{
  display:none;
  background:#fff7ed;
  border:1px solid #fed7aa;
  color:#9a3412;
  padding:14px;
  border-radius:12px;
  margin-bottom:18px;
}

.documents{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}

.doc-card{
  background:#fff;
  border-radius:18px;
  padding:18px;
  box-shadow:0 4px 18px #0000000d;
  border:1px solid #e5e7eb;
}

.doc-title{
  font-size:20px;
  font-weight:800;
  margin-bottom:14px;
}

.preview{
  min-height:180px;
  background:#f8fafc;
  border-radius:12px;
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:center;
  justify-content:center;
  padding:12px;
}

.preview img{
  width:150px;
  height:120px;
  object-fit:cover;
  border-radius:10px;
  border:1px solid #ddd;
  cursor:pointer;
}

.preview iframe{
  width:100%;
  height:220px;
  border:1px solid #ddd;
  border-radius:10px;
  background:#fff;
}

.empty{
  color:#667085;
  text-align:center;
  padding:30px 10px;
}

.open-btn{
  display:inline-block;
  margin-top:12px;
  background:#1677ff;
  color:#fff;
  text-decoration:none;
  padding:10px 15px;
  border-radius:9px;
  font-weight:700;
}

.loading{
  background:#fff;
  padding:30px;
  border-radius:18px;
  text-align:center;
  color:#667085;
}

@media(max-width:700px){

  .header{
    padding:14px 16px;
  }

  .brand{
    font-size:20px;
  }

  .back{
    font-size:14px;
  }

  .main{
    padding:0 12px;
    margin-top:15px;
  }

  .hero{
    padding:22px 18px;
    border-radius:20px;
  }

  .hero h1{
    font-size:32px;
  }

  .hero p{
    font-size:17px;
  }

  .documents{
    grid-template-columns:1fr;
  }

  .doc-card{
    padding:15px;
  }

  .preview img{
    width:130px;
    height:105px;
  }

}

@media(max-width:380px){

  .brand{
    font-size:18px;
  }

  .hero h1{
    font-size:28px;
  }

}

</style>

</head>

<body>


<header class="header">

  <div class="brand">
    🏪 BR <span>Digital Marketplace</span>
  </div>

  <a
    href="seller-dashboard.html"
    class="back">

    ← Dashboard

  </a>

</header>


<main class="main">


  <section class="hero">

    <h1>
      📄 My Documents
    </h1>

    <p>
      आपके submitted seller documents यहाँ
      securely दिखाई देंगे।
    </p>

  </section>


  <div
    id="message"
    class="message">
  </div>


  <div
    id="loading"
    class="loading">

    Documents load हो रहे हैं...

  </div>


  <section
    id="documents"
    class="documents">
  </section>


</main>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://uryjmibcdfjfxoljrigt.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_uYbJw0ARCCkCpQ9QB6FxaQ_JrIxtOOp";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================
   GLOBAL
========================================= */

let currentUser = null;
let seller = null;


/* =========================================
   ESCAPE
========================================= */

function esc(v){

  return String(v ?? '')
    .replace(/[&<>"']/g,m=>({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'

    }[m]));

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text){

  const el =
    document.getElementById('message');

  el.textContent = text;
  el.style.display = 'block';

}


/* =========================================
   LOGIN CHECK
========================================= */

async function checkLogin(){

  const {
    data,
    error
  } =
  await supabaseClient
    .auth
    .getUser();


  if(error || !data?.user){

    location.href =
      'seller-login.html';

    return false;

  }


  currentUser =
    data.user;

  return true;

}


/* =========================================
   LOAD SELLER
========================================= */

async function loadSeller(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from('sellers')
    .select('*')
    .eq('user_id',currentUser.id)
    .maybeSingle();


  if(error){

    showMessage(
      '❌ Seller profile load नहीं हुआ: ' +
      error.message
    );

    return false;

  }


  if(!data){

    showMessage(
      '❌ Seller profile नहीं मिला।'
    );

    return false;

  }


  seller = data;

  return true;

}


/* =========================================
   PARSE MULTIPLE PATHS
========================================= */

function parsePaths(value){

  if(!value)
    return [];


  if(Array.isArray(value))
    return value;


  try{

    const parsed =
      JSON.parse(value);

    return Array.isArray(parsed)
      ? parsed
      : [];

  }catch(e){

    return [];

  }

}


/* =========================================
   SIGNED URL
========================================= */

async function signedUrl(path){

  if(!path)
    return null;


  const {
    data,
    error
  } =
  await supabaseClient
    .storage
    .from('seller-kyc')
    .createSignedUrl(
      path,
      600
    );


  if(error){

    console.log(
      'Document URL error:',
      error.message
    );

    return null;

  }


  return data?.signedUrl || null;

}


/* =========================================
   FILE TYPE
========================================= */

function isImage(path){

  const p =
    String(path || '')
      .toLowerCase();

  return (
    p.endsWith('.jpg') ||
    p.endsWith('.jpeg') ||
    p.endsWith('.png') ||
    p.endsWith('.webp')
  );

}

function isPdf(path){

  return String(path || '')
    .toLowerCase()
    .endsWith('.pdf');

}


/* =========================================
   DOCUMENT CARD
========================================= */

async function makeDocumentCard(
  title,
  paths
){

  if(!paths.length){

    return `

      <div class="doc-card">

        <div class="doc-title">
          ${esc(title)}
        </div>

        <div class="preview">

          <div class="empty">
            यह document अभी submit नहीं किया गया है।
          </div>

        </div>

      </div>

    `;

  }


  let html = '';


  for(const path of paths){

    const url =
      await signedUrl(path);


    if(!url){

      html += `

        <div class="empty">
          Document open नहीं हो पाया।
        </div>

      `;

      continue;

    }


    if(isImage(path)){

      html += `

        <div>

          <img
            src="${esc(url)}"
            alt="${esc(title)}"
            onclick="window.open('${esc(url)}','_blank')"
          >

          <br>

          <a
            class="open-btn"
            href="${esc(url)}"
            target="_blank"
            rel="noopener">

            👁️ View

          </a>

        </div>

      `;

    }

    else if(isPdf(path)){

      html += `

        <div style="width:100%">

          <iframe
            src="${esc(url)}"
            title="${esc(title)}">
          </iframe>

          <a
            class="open-btn"
            href="${esc(url)}"
            target="_blank"
            rel="noopener">

            📄 Open PDF

          </a>

        </div>

      `;

    }

    else{

      html += `

        <a
          class="open-btn"
          href="${esc(url)}"
          target="_blank"
          rel="noopener">

          📄 Open Document

        </a>

      `;

    }

  }


  return `

    <div class="doc-card">

      <div class="doc-title">
        ${esc(title)}
      </div>

      <div class="preview">

        ${html}

      </div>

    </div>

  `;

}


/* =========================================
   LOAD DOCUMENTS
========================================= */

async function loadDocuments(){

  const documents =
    document.getElementById(
      'documents'
    );

  const loading =
    document.getElementById(
      'loading'
    );


  documents.innerHTML = '';


  const cards = [];


  /* Aadhaar Front */

  cards.push(
    makeDocumentCard(
      '🪪 Aadhaar Front',
      seller.aadhaar_document_url
        ? [seller.aadhaar_document_url]
        : []
    )
  );


  /* Aadhaar Back */

  cards.push(
    makeDocumentCard(
      '🪪 Aadhaar Back',
      seller.aadhaar_back_document_url
        ? [seller.aadhaar_back_document_url]
        : []
    )
  );


  /* PAN */

  cards.push(
    makeDocumentCard(
      '💳 PAN Card',
      seller.pan_document_url
        ? [seller.pan_document_url]
        : []
    )
  );


  /* Business Proof */

  let businessProofs =
    parsePaths(
      seller.business_proof_urls
    );


  if(
    !businessProofs.length &&
    seller.business_proof_url
  ){

    businessProofs =
      [seller.business_proof_url];

  }


  cards.push(
    makeDocumentCard(
      '📄 Business Proof',
      businessProofs
    )
  );


  /* Shop Photos */

  let shopPhotos =
    parsePaths(
      seller.shop_photo_urls
    );


  if(
    !shopPhotos.length &&
    seller.shop_photo_url
  ){

    shopPhotos =
      [seller.shop_photo_url];

  }


  cards.push(
    makeDocumentCard(
      '🏪 Shop Photos',
      shopPhotos
    )
  );


  const result =
    await Promise.all(cards);


  documents.innerHTML =
    result.join('');


  if(loading){

    loading.style.display =
      'none';

  }

}


/* =========================================
   START
========================================= */

async function start(){

  const loggedIn =
    await checkLogin();


  if(!loggedIn)
    return;


  const sellerFound =
    await loadSeller();


  if(!sellerFound){

    const loading =
      document.getElementById(
        'loading'
      );

    if(loading)
      loading.style.display='none';

    return;

  }


  await loadDocuments();

}


start();

</script>


</body>
  </html>
