<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Seller Account - BR Digital Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f7fa;
  font-family:Arial,sans-serif;
  color:#17212b;
}

.header{
  background:white;
  padding:22px 15px;
  text-align:center;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
  font-size:28px;
  font-weight:800;
}

.logo span{
  color:#ff7900;
}

.container{
  max-width:600px;
  margin:35px auto;
  padding:0 15px;
}

.card{
  background:white;
  border-radius:24px;
  padding:28px 22px;
  box-shadow:0 8px 30px rgba(0,0,0,.10);
}

.step{
  display:inline-block;
  background:#1677ed;
  color:white;
  padding:7px 14px;
  border-radius:20px;
  font-weight:bold;
  margin-bottom:15px;
}

h1{
  margin:5px 0 8px;
  color:#f47700;
  font-size:31px;
}

.subtitle{
  color:#666;
  font-size:16px;
  margin-bottom:25px;
}

label{
  display:block;
  font-size:16px;
  font-weight:700;
  margin:17px 0 7px;
}

.required{
  color:red;
}

input{
  width:100%;
  padding:16px;
  border:1px solid #d5d5d5;
  border-radius:13px;
  font-size:16px;
  outline:none;
}

input:focus{
  border-color:#1677ed;
}

.terms{
  display:flex;
  align-items:flex-start;
  gap:10px;
  margin-top:20px;
  font-size:14px;
  line-height:1.5;
  color:#555;
}

.terms input{
  width:20px;
  height:20px;
  flex:none;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:17px;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.create{
  margin-top:22px;
  background:#1677ed;
  color:white;
}

.login{
  margin-top:12px;
  background:#18212b;
  color:white;
}

.message{
  display:none;
  margin-top:18px;
  padding:15px;
  border-radius:12px;
  text-align:center;
  line-height:1.5;
}

.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.back{
  display:block;
  text-align:center;
  margin-top:22px;
  color:#f47700;
  font-weight:bold;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">
    🏪 BR <span>Digital Marketplace</span>
  </div>
</div>

<div class="container">

<div class="card">

  <div class="step">1️⃣ Step 1</div>

  <h1>Create Seller Account 👨‍💼</h1>

  <div class="subtitle">
    Get started as a seller on BR Digital Marketplace
  </div>

  <label>
    Full Name <span class="required">*</span>
  </label>

  <input
    id="fullName"
    type="text"
    placeholder="Enter your full name"
  >

  <label>
    Mobile Number <span class="required">*</span>
  </label>

  <input
    id="phone"
    type="tel"
    maxlength="10"
    inputmode="numeric"
    placeholder="10 digit mobile number"
  >

  <label>
    Email Address <span class="required">*</span>
  </label>

  <input
    id="email"
    type="email"
    placeholder="Enter your email"
  >

  <label>
    Password <span class="required">*</span>
  </label>

  <input
    id="password"
    type="password"
    placeholder="Minimum 6 characters"
  >

  <label>
    Confirm Password <span class="required">*</span>
  </label>

  <input
    id="confirmPassword"
    type="password"
    placeholder="Re-enter your password"
  >

  <label class="terms">
    <input id="terms" type="checkbox">
    <span>
      I agree to the
      <b>Terms & Conditions</b>
      and
      <b>Privacy Policy</b>.
    </span>
  </label>

  <button class="create" onclick="createSellerAccount()">
    ➕ Create Seller Account
  </button>

  <button class="login" onclick="goLogin()">
    🔐 Already have an account? Login Here
  </button>

  <div id="message" class="message"></div>

  <a href="index.html" class="back">
    ← Marketplace par wapas
  </a>

</div>

</div>

<script>

const SUPABASE_URL =
"https://uryjmibcdfjfxoljrigt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_uYbJw0ARCCkCpQ9QB6FxaQ_JrIxtOOp";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


function showMessage(text,type){

  const box =
    document.getElementById("message");

  box.className =
    "message " + type;

  box.innerHTML = text;
}


async function createSellerAccount(){

  const fullName =
    document.getElementById("fullName")
    .value.trim();

  const phone =
    document.getElementById("phone")
    .value.trim();

  const email =
    document.getElementById("email")
    .value.trim();

  const password =
    document.getElementById("password")
    .value;

  const confirmPassword =
    document.getElementById("confirmPassword")
    .value;

  const terms =
    document.getElementById("terms").checked;


  if(!fullName ||
     !phone ||
     !email ||
     !password ||
     !confirmPassword){

    showMessage(
      "❌ सभी required details भरें।",
      "error"
    );

    return;
  }


  if(!/^[0-9]{10}$/.test(phone)){

    showMessage(
      "❌ Mobile number 10 digits का होना चाहिए।",
      "error"
    );

    return;
  }


  if(password.length < 6){

    showMessage(
      "❌ Password कम से कम 6 characters का होना चाहिए।",
      "error"
    );

    return;
  }


  if(password !== confirmPassword){

    showMessage(
      "❌ Password और Confirm Password अलग हैं।",
      "error"
    );

    return;
  }


  if(!terms){

    showMessage(
      "❌ Terms & Conditions स्वीकार करें।",
      "error"
    );

    return;
  }


  showMessage(
    "⏳ Seller account बनाया जा रहा है...",
    "success"
  );


  const { data, error } =
    await db.auth.signUp({

      email:email,

      password:password,

      options:{
        data:{
          role:"seller",
          full_name:fullName,
          owner_name:fullName,
          phone:phone
        }
      }

    });


  if(error){

    console.error(error);

    showMessage(
      "❌ Signup Error: " + error.message,
      "error"
    );

    return;
  }


  if(!data || !data.user){

    showMessage(
      "❌ Account create नहीं हुआ। कृपया फिर कोशिश करें।",
      "error"
    );

    return;
  }


  showMessage(
    "✅ Seller Account successfully create हो गया!<br><br>" +
    "⏭️ अब अगला step: Shop / Business Details",
    "success"
  );


  /*
    अभी हम Step 1 test कर रहे हैं।
    Step 2 को अगली screen में जोड़ेंगे।
  */

}


setTimeout(function(){
  window.location.href = "seller-business.html";
}, 1200);

</script>

</body>
</html>
