<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Seller Login - BR Digital Marketplace</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #18202a;
    }

    .header {
      background: white;
      padding: 18px;
      text-align: center;
      box-shadow: 0 2px 10px #ddd;
    }

    .logo {
      display: inline-block;
      background: #ff7900;
      color: white;
      padding: 10px 13px;
      border-radius: 10px;
      font-weight: bold;
      margin-right: 8px;
    }

    .container {
      max-width: 450px;
      margin: 35px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 3px 15px #ddd;
    }

    h1 {
      margin-top: 0;
      text-align: center;
      color: #ff7900;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: 0;
      border-radius: 9px;
      background: #ff7900;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .secondary {
      background: #18202a;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #ff7900;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    <span class="logo">BR</span>
    <strong>BR Digital Marketplace</strong>
  </div>

  <div class="container">

    <div class="card">

      <h1>Seller Account 👨‍💼</h1>

      <p class="subtitle">
        Seller login ya naya account banayein
      </p>

      <label>Business / Shop Name</label>
      <input type="text" id="businessName" placeholder="Example: Rahul Mobile Shop">

      <label>Owner Name</label>
      <input type="text" id="ownerName" placeholder="Your full name">

      <label>Phone</label>
      <input type="tel" id="phone" placeholder="10 digit mobile number">

      <label>Email</label>
      <input
        type="email"
        id="email"
        placeholder="seller@example.com"
        required
      >

      <label>Password</label>
      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button onclick="sellerLogin()">
        🔐 Seller Login
      </button>

      <button class="secondary" onclick="sellerSignup()">
        ➕ Create Seller Account
      </button>

      <div id="message" class="message"></div>

      <a href="index.html" class="back">
        ← Marketplace par wapas
      </a>

    </div>

  </div>

<script>

  // ================================
  // SUPABASE CONFIG
  // ================================

  const SUPABASE_URL = "https://uryjmibcdfjfxoljrigt.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_uYbJw0ARCCkQ9QB6FxaQ_JrIxtOOp";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  // ================================
  // MESSAGE
  // ================================

  function showMessage(text, success = false) {

  const box = document.getElementById("message");

  box.innerText = text;
  box.style.display = "block";

  if (success) {
    box.style.background = "#d9f7df";
    box.style.color = "#176b2c";
  } else {
    box.style.background = "#ffe1e1";
    box.style.color = "#a00000";
  }
}


// ================================
// SELLER SIGNUP
// ================================

async function sellerSignup() {
  const businessName = document.getElementById("businessName").value.trim();
  const ownerName = document.getElementById("ownerName").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!businessName || !ownerName || !phone || !email || !password) {
    showMessage("Business name, owner name, phone, email aur password sab bharna zaroori hai.");
    return;
  }
  if (!/^[0-9]{10}$/.test(phone)) {
    showMessage("10 digit mobile number daaliye.");
    return;
  }
  if (password.length < 6) {
    showMessage("Password kam se kam 6 characters ka hona chahiye.");
    return;
  }

  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email,
      password,
      options: {
        data: {
          role: "seller",
          business_name: businessName,
          owner_name: ownerName,
          full_name: ownerName,
          phone
        }
      }
    });
    if (error) throw error;

    if (data.session) {
      showMessage("✅ Seller account create ho gaya. Admin approval ke baad dashboard use kar sakenge.", true);
    } else {
      showMessage("✅ Account request create ho gayi. Email verify karein. Admin approval ke baad seller dashboard khulega.", true);
    }
  } catch (error) {
    showMessage("❌ Signup Error: " + error.message);
  }
}

// ================================
// SELLER LOGIN
// ================================

async function sellerLogin() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if (!email || !password) {
    showMessage("Email aur password dono bharna zaroori hai.");
    return;
  }

  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
    if (error) throw error;

    const user = data.user;
    const { data: seller, error: sellerError } =
      await supabaseClient.from("sellers").select("id,business_name,owner_name,status,is_active")
        .eq("id", user.id).maybeSingle();

    if (sellerError) throw sellerError;
    if (!seller) {
      await supabaseClient.auth.signOut();
      throw new Error("Seller profile nahi mila. Account registration dobara check karein.");
    }
    if (String(seller.status || "").toLowerCase() !== "approved" || seller.is_active !== true) {
      await supabaseClient.auth.signOut();
      showMessage("⏳ Seller account abhi Admin approval ka wait kar raha hai.");
      return;
    }

    showMessage("✅ Login successful! Seller Dashboard khul raha hai...", true);
    setTimeout(() => { window.location.href = "seller-dashboard.html"; }, 700);
  } catch (error) {
    showMessage("❌ Login Error: " + error.message);
  }
}
</script>

</body>
</html>
