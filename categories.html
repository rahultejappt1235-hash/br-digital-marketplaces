<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Categories - BR Digital Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f8fa;
  color:#18212f;
  padding-bottom:82px;
}

button{
  font-family:inherit;
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

/* ================= HEADER ================= */

.header{
  background:#fff;
  padding:10px 15px;
  border-bottom:1px solid #e5e5e5;
  position:sticky;
  top:0;
  z-index:1000;
}

.header-row{
  display:flex;
  align-items:center;
  gap:10px;
}

.menu-btn{
  width:43px;
  height:43px;
  border:0;
  border-radius:13px;
  background:#f3f5f6;
  font-size:25px;
}

.logo{
  width:47px;
  height:47px;
  border:3px solid #087f45;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:900;
  background:#fff;
}

.brand{
  flex:1;
  min-width:0;
}

.brand-name{
  font-size:19px;
  font-weight:900;
  white-space:nowrap;
}

.orange{
  color:#f36b21;
}

.green{
  color:#087f45;
}

.tagline{
  font-size:9px;
  color:#707780;
  margin-top:4px;
  white-space:nowrap;
}

.cart-btn{
  width:44px;
  height:44px;
  border:0;
  border-radius:50%;
  background:#f3f5f6;
  font-size:23px;
  position:relative;
}

.cart-count{
  position:absolute;
  right:-2px;
  top:-3px;
  background:#e62d2d;
  color:#fff;
  min-width:20px;
  height:20px;
  border-radius:20px;
  font-size:11px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

/* ================= PAGE ================= */

.page{
  padding:18px 15px;
}

.page-title{
  font-size:25px;
  font-weight:900;
}

.page-subtitle{
  color:#737b84;
  font-size:13px;
  margin-top:5px;
}

/* ================= SEARCH ================= */

.search-box{
  margin-top:15px;
  height:52px;
  background:#fff;
  border:2px solid #f36b21;
  border-radius:15px;
  display:flex;
  align-items:center;
  overflow:hidden;
}

.search-icon{
  width:43px;
  text-align:center;
  font-size:23px;
}

.search-input{
  flex:1;
  min-width:0;
  height:100%;
  border:0;
  outline:0;
  font-size:14px;
  padding:0 5px;
}

.mic-btn{
  width:45px;
  height:100%;
  border:0;
  background:#fff;
  font-size:20px;
}

.search-btn{
  height:100%;
  border:0;
  background:#f36b21;
  color:#fff;
  padding:0 16px;
  font-weight:900;
}

/* ================= CATEGORY GRID ================= */

.category-grid{
  display:grid;
  grid-template-columns:
    repeat(4,1fr);
  gap:11px;
  margin-top:18px;
}

.category-card{
  min-height:105px;
  background:#fff;
  border:1px solid #e4e6e8;
  border-radius:16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.category-icon{
  font-size:38px;
}

.category-name{
  margin-top:7px;
  font-size:12px;
  font-weight:900;
}

/* ================= PRODUCTS ================= */

.products-section{
  margin-top:25px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:11px;
}

.section-title{
  font-size:21px;
  font-weight:900;
}

.clear-btn{
  border:0;
  background:none;
  color:#087f45;
  font-size:13px;
  font-weight:900;
}

.products-grid{
  display:grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap:12px;
}

.product-card{
  background:#fff;
  border:1px solid #e1e4e7;
  border-radius:16px;
  padding:8px;
  position:relative;
  box-shadow:0 2px 8px rgba(0,0,0,.05);
  overflow:hidden;
}

.product-image{
  width:100%;
  height:155px;
  border-radius:12px;
  background:#f8f8f8;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.product-name{
  font-size:13px;
  font-weight:900;
  line-height:1.25;
  margin-top:9px;
  min-height:33px;
}

.product-brand{
  color:#777;
  font-size:10px;
  margin-top:4px;
}

.product-price{
  color:#e3311b;
  font-size:18px;
  font-weight:900;
  margin-top:7px;
}

.product-stock{
  color:#087f45;
  font-size:10px;
  font-weight:800;
  margin-top:3px;
}

.add-btn{
  width:100%;
  height:36px;
  margin-top:8px;
  border:1.5px solid #087f45;
  border-radius:10px;
  background:#fff;
  color:#087f45;
  font-weight:900;
  font-size:12px;
}

/* ================= EMPTY ================= */

.loading,
.empty{
  grid-column:1/-1;
  text-align:center;
  padding:35px 15px;
  color:#777;
  background:#fff;
  border-radius:15px;
}

/* ================= SIDE MENU ================= */

.menu-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  z-index:5000;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:.25s;
}

.menu-overlay.show{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

.side-menu{
  width:min(330px,86vw);
  height:100%;
  background:#fff;
  padding:18px 15px;
  transform:translateX(-100%);
  transition:.28s;
  box-shadow:6px 0 25px rgba(0,0,0,.2);
}

.menu-overlay.show .side-menu{
  transform:translateX(0);
}

.side-menu-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-bottom:15px;
  border-bottom:1px solid #eee;
}

.side-menu-header strong{
  display:block;
  color:#087f45;
  font-size:17px;
}

.side-menu-header small{
  display:block;
  color:#777;
  font-size:10px;
  margin-top:4px;
}

.close-menu{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#f3f4f5;
}

.menu-item{
  width:100%;
  min-height:49px;
  margin-top:7px;
  padding:0 14px;
  border:0;
  border-radius:12px;
  background:#f7f8f9;
  text-align:left;
  font-weight:800;
  font-size:14px;
}

.menu-divider{
  height:1px;
  background:#e5e5e5;
  margin:14px 3px;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:76px;
  background:#fff;
  border-top:1px solid #ddd;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:3000;
  box-shadow:0 -2px 12px rgba(0,0,0,.06);
}

.bottom-item{
  border:0;
  background:#fff;
  color:#636b74;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:11px;
  font-weight:800;
}

.bottom-icon{
  font-size:23px;
}

.bottom-item.active{
  color:#087f45;
}

/* ================= MOBILE ================= */

@media(max-width:600px){

  .brand-name{
    font-size:16px;
  }

  .tagline{
    font-size:8px;
  }

  .category-grid{
    grid-template-columns:
      repeat(3,1fr);
  }

  .category-card{
    min-height:98px;
  }

  .category-icon{
    font-size:33px;
  }

  .product-image{
    height:145px;
  }

}

@media(max-width:370px){

  .category-grid{
    gap:7px;
  }

  .category-card{
    min-height:90px;
  }

  .category-icon{
    font-size:29px;
  }

  .product-name{
    font-size:12px;
  }

}

</style>
</head>

<body>


<!-- ================= HEADER ================= -->

<header class="header">

  <div class="header-row">

    <button
      class="menu-btn"
      type="button"
      onclick="openDrawer()">
      ☰
    </button>

    <div class="logo">
      BR
    </div>

    <div class="brand">

      <div class="brand-name">
        <span class="orange">BR</span>
        <span class="green">
          Digital Marketplace
        </span>
      </div>

      <div class="tagline">
        Shop Local • Support Bihar • Grow Together ❤️
      </div>

    </div>

    <button
      class="cart-btn"
      type="button"
      onclick="openCart()">

      🛒

      <span
        id="cartCount"
        class="cart-count">
        0
      </span>

    </button>

  </div>

</header>


<!-- ================= SIDE MENU ================= -->

<div
  id="menuOverlay"
  class="menu-overlay"
  onclick="closeDrawer(event)">

  <aside
    class="side-menu"
    onclick="event.stopPropagation()">

    <div class="side-menu-header">

      <div>

        <strong>
          BR Digital Marketplace
        </strong>

        <small>
          Shop Local • Support Bihar ❤️
        </small>

      </div>

      <button
        class="close-menu"
        type="button"
        onclick="closeDrawer()">
        ✕
      </button>

    </div>


    <button
      class="menu-item"
      type="button"
      onclick="window.location.href='index.html'">
      🏠 Home
    </button>


    <button
      class="menu-item"
      type="button"
      onclick="closeDrawer()">
      ▦ Categories
    </button>


    <button
      class="menu-item"
      type="button"
      onclick="window.location.href='market.html'">
      🏪 Market
    </button>


    <button
      class="menu-item"
      type="button"
      onclick="openOrders()">
      📦 My Orders
    </button>


    <button
      class="menu-item"
      type="button"
      onclick="openAccount()">
      👤 My Account
    </button>


    <div class="menu-divider"></div>


    <button
      class="menu-item"
      type="button"
      onclick="window.location.href='seller-login.html'">
      🏬 Seller Login
    </button>


    <button
      class="menu-item"
      type="button"
      onclick="window.location.href='admin-login.html'">
      🔐 Admin Login
    </button>

  </aside>

</div>


<!-- ================= PAGE ================= -->

<main class="page">

  <div class="page-title">
    📂 Categories
  </div>

  <div class="page-subtitle">
    Browse products by category
  </div>


  <!-- SEARCH -->

  <div class="search-box">

    <div class="search-icon">
      🔍
    </div>

    <input
      id="searchInput"
      class="search-input"
      type="search"
      placeholder="Search products..."
      oninput="searchProducts()">

    <button
      class="mic-btn"
      type="button"
      onclick="voiceSearch()">
      🎤
    </button>

    <button
      class="search-btn"
      type="button"
      onclick="searchProducts()">
      Search
    </button>

  </div>


  <!-- CATEGORY GRID -->

  <div
    id="categoryGrid"
    class="category-grid">
  </div>


  <!-- PRODUCTS -->

  <section class="products-section">

    <div class="section-head">

      <div>

        <div
          id="selectedTitle"
          class="section-title">
          All Products
        </div>

      </div>

      <button
        class="clear-btn"
        type="button"
        onclick="showAllProducts()">
        View All
      </button>

    </div>


    <div
      id="productsGrid"
      class="products-grid">

      <div class="loading">
        ⏳ Real products loading...
      </div>

    </div>

  </section>

</main>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

  <button
    class="bottom-item"
    type="button"
    onclick="window.location.href='index.html'">

    <span class="bottom-icon">
      🏠
    </span>

    Home

  </button>


  <button
    class="bottom-item active"
    type="button"
    onclick="window.scrollTo({top:0,behavior:'smooth'})">

    <span class="bottom-icon">
      ▦
    </span>

    Categories

  </button>


  <button
    class="bottom-item"
    type="button"
    onclick="window.location.href='market.html'">

    <span class="bottom-icon">
      🏪
    </span>

    Market

  </button>


  <button
    class="bottom-item"
    type="button"
    onclick="openOrders()">

    <span class="bottom-icon">
      📦
    </span>

    Orders

  </button>


  <button
    class="bottom-item"
    type="button"
    onclick="openAccount()">

    <span class="bottom-icon">
      👤
    </span>

    Account

  </button>

</nav>


<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL =
  "https://uryjmibcdfjfxoljrigt.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_uYbJw0ARCCkCpQ9QB6FxaQ_JrIxtOOp";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ================= VARIABLES ================= */

let allProducts = [];

let cart =
  JSON.parse(
    localStorage.getItem("br_cart") || "[]"
  );


/* ================= CATEGORY DATA ================= */

const categories = [

  ["🛒","Grocery"],

  ["📱","Mobiles"],

  ["💻","Electronics"],

  ["👕","Fashion"],

  ["🛋️","Home"],

  ["🧴","Beauty"],

  ["⚽","Sports"],

  ["🏠","Appliances"],

  ["📚","Books"],

  ["🚗","Automotive"],

  ["🧸","Toys & Kids"],

  ["💊","Health & Wellness"]

];


function drawCategories(){

  const box =
    document.getElementById(
      "categoryGrid"
    );

  box.innerHTML = "";

  categories.forEach(
    item => {

      const button =
        document.createElement("button");

      button.type = "button";

      button.className =
        "category-card";

      button.innerHTML = `

        <div class="category-icon">
          ${item[0]}
        </div>

        <div class="category-name">
          ${escapeHTML(item[1])}
        </div>

      `;

      button.onclick =
        function(){

          selectCategory(
            item[1]
          );

        };

      box.appendChild(button);

    }
  );

}


/* ================= LOAD REAL PRODUCTS ================= */

async function loadProducts(){

  const box =
    document.getElementById(
      "productsGrid"
    );

  box.innerHTML = `
    <div class="loading">
      ⏳ Real seller products loading...
    </div>
  `;


  const result =
    await supabaseClient

      .from("products")

      .select(`
        id,
        product_name,
        brand,
        category,
        product_type,
        description,
        price,
        stock,
        image_url,
        seller_name,
        status,
        seller_id
      `)

      .eq(
        "status",
        "approved"
      )

      .order(
        "id",
        {
          ascending:false
        }
      );


  if(result.error){

    console.error(
      result.error
    );

    box.innerHTML = `
      <div class="empty">
        ⚠️ Products load नहीं हो पाए।
        <br><br>
        Please try again.
      </div>
    `;

    return;
  }


  allProducts =
    result.data || [];

  renderProducts(
    allProducts
  );

}


/* ================= RENDER PRODUCTS ================= */

function renderProducts(
  products
){

  const box =
    document.getElementById(
      "productsGrid"
    );


  if(!products.length){

    box.innerHTML = `
      <div class="empty">
        🛍️
        <br><br>
        इस category में अभी कोई
        approved product उपलब्ध नहीं है।
      </div>
    `;

    return;
  }


  box.innerHTML = "";


  products.forEach(
    product => {

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "product-card";


      card.onclick =
        function(event){

          if(
            event.target.closest(
              ".add-btn"
            )
          ){
            return;
          }

          localStorage.setItem(
            "br_selected_product",
            JSON.stringify(product)
          );

          window.location.href =
            "product-details.html?id=" +
            encodeURIComponent(
              product.id
            );

        };


      const image =
        product.image_url || "";


      const stock =
        Number(
          product.stock || 0
        );


      card.innerHTML = `

        <div class="product-image">

          ${
            image
            ?
            `
              <img
                src="${escapeHTML(image)}"
                alt="${escapeHTML(
                  product.product_name ||
                  "Product"
                )}"
                loading="lazy"
                onerror="
                  this.style.display='none';
                ">
            `
            :
            `
              <span
                style="
                color:#999;
                font-size:11px;">
                Image unavailable
              </span>
            `
          }

        </div>


        <div class="product-name">
          ${escapeHTML(
            product.product_name ||
            "Product"
          )}
        </div>


        ${
          product.brand
          ?
          `
          <div class="product-brand">
            ${escapeHTML(product.brand)}
          </div>
          `
          :
          ""
        }


        <div class="product-price">
          ₹${formatPrice(product.price)}
        </div>


        <div
          class="product-stock"
          style="
            color:${
              stock > 0
              ? "#087f45"
              : "#d33"
            };
          ">

          ${
            stock > 0
            ? "In Stock"
            : "Out of Stock"
          }

        </div>


        <button
          class="add-btn"
          type="button">

          🛒 Add to Cart

        </button>

      `;


      card
        .querySelector(".add-btn")
        .onclick =
        function(){

          addToCart(
            product
          );

        };


      box.appendChild(
        card
      );

    }
  );

}


/* ================= CATEGORY FILTER ================= */

function selectCategory(
  category
){

  const filtered =
    allProducts.filter(
      product => {

        const productCategory =
          String(
            product.category || ""
          )
          .trim()
          .toLowerCase();

        return (
          productCategory ===
          category
          .toLowerCase()
        );

      }
    );


  document.getElementById(
    "selectedTitle"
  ).textContent =
    category;


  renderProducts(
    filtered
  );


  document
    .getElementById(
      "productsGrid"
    )
    .scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

}


/* ================= ALL PRODUCTS ================= */

function showAllProducts(){

  document.getElementById(
    "selectedTitle"
  ).textContent =
    "All Products";

  renderProducts(
    allProducts
  );

}


/* ================= SEARCH ================= */

function searchProducts(){

  const value =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  if(!value){

    showAllProducts();

    return;
  }


  const filtered =
    allProducts.filter(
      product => {

        return [

          product.product_name,

          product.brand,

          product.category,

          product.product_type,

          product.description

        ]
        .some(
          field =>
            String(
              field || ""
            )
            .toLowerCase()
            .includes(value)
        );

      }
    );


  document.getElementById(
    "selectedTitle"
  ).textContent =
    "Search Results";


  renderProducts(
    filtered
  );

}


/* ================= CART ================= */

function updateCartCount(){

  const count =
    cart.reduce(
      (
        total,
        item
      ) =>
        total +
        Number(
          item.quantity || 1
        ),
      0
    );


  document.getElementById(
    "cartCount"
  ).textContent =
    count;

}


function addToCart(
  product
){

  if(
    Number(product.stock || 0)
    <= 0
  ){

    alert(
      "यह product अभी Out of Stock है।"
    );

    return;
  }


  const existing =
    cart.find(
      item =>
        String(item.id)
        ===
        String(product.id)
    );


  if(existing){

    existing.quantity =
      Number(
        existing.quantity || 1
      ) + 1;

  }else{

    cart.push({

      id:product.id,

      product_name:
        product.product_name,

      price:
        product.price,

      image_url:
        product.image_url,

      stock:
        product.stock,

      seller_id:
        product.seller_id,

      quantity:1

    });

  }


  localStorage.setItem(
    "br_cart",
    JSON.stringify(cart)
  );


  updateCartCount();

  alert(
    "Product cart में add हो गया 🛒"
  );

}


function openCart(){

  window.location.href =
    "cart.html";

}


/* ================= VOICE SEARCH ================= */

function voiceSearch(){

  const Recognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!Recognition){

    alert(
      "Voice search आपके browser में available नहीं है।"
    );

    return;
  }


  const recognition =
    new Recognition();


  recognition.lang =
    "hi-IN";


  recognition.onresult =
    function(event){

      const text =
        event.results[0][0]
        .transcript;


      document.getElementById(
        "searchInput"
      ).value =
        text;


      searchProducts();

    };


  recognition.start();

}


/* ================= NAVIGATION ================= */

function openOrders(){

/* ================= SIDE MENU ================= */

function openDrawer(){

  const overlay =
    document.getElementById(
      "menuOverlay"
    );

  if(overlay){

    overlay.classList.add(
      "show"
    );

    document.body.style.overflow =
      "hidden";

  }

}


function closeDrawer(event){

  if(
    event &&
    event.target &&
    event.target.id !==
    "menuOverlay"
  ){

    return;

  }


  const overlay =
    document.getElementById(
      "menuOverlay"
    );

  if(overlay){

    overlay.classList.remove(
      "show"
    );

    document.body.style.overflow =
      "";

  }

}


/* ================= HELPERS ================= */

function formatPrice(
  price
){

  const number =
    Number(price);


  if(
    !Number.isFinite(number)
  ){

    return "0";

  }


  return number.toLocaleString(
    "en-IN",
    {
      maximumFractionDigits:2
    }
  );

}


function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}
