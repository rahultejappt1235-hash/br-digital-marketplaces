<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Dashboard - BR Digital Marketplace</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #17202a;
    }

    header {
      background: white;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 21px;
      font-weight: bold;
    }

    .logo-box {
      background: #ff7a00;
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 650px;
      margin: 30px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    h1 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #ff7a00;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
    }

    #message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .preview {
      margin-top: 15px;
      text-align: center;
    }

    .preview img {
      max-width: 220px;
      max-height: 220px;
      border-radius: 12px;
      display: none;
      margin: auto;
    }

    .back {
      display: block;
      margin-top: 20px;
      text-align: center;
      color: #ff7a00;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<header>
  <div class="logo">
    <div class="logo-box">BR</div>
    BR Digital Marketplace
  </div>
</header>

<div class="container">

  <div class="card">

    <h1>🛍️ Seller Dashboard</h1>
    <p id="sellerStatus">Seller account verify ho raha hai...</p>
    <button type="button" id="logoutBtn" style="background:#18202a;margin-top:10px" onclick="sellerLogout()">Logout</button>

    <label>Product Name</label>
    <input
      type="text"
      id="productName"
      placeholder="Example: Men's Premium T-Shirt"
    >

    <label>Brand</label>
    <input type="text" id="brand" placeholder="Example: Samsung / boAt / Local Brand">

    <label>Description</label>
    <input type="text" id="description" placeholder="Product description">

    <label>Price (₹)</label>
    <input
      type="number"
      id="price"
      placeholder="Example: 499"
    >

    <label>Stock</label>
    <input
      type="number"
      id="stock"
      placeholder="Example: 20"
    >

    <label>Category</label>
    <select id="category">
      <option value="fashion">Fashion</option>
      <option value="electronics">Electronics</option>
      <option value="accessories">Accessories</option>
      <option value="beauty">Beauty</option>
      <option value="home">Home</option>
      <option value="sports">Sports</option>
      <option value="other">Other</option>
    </select>

    <label>Product Image</label>
    <input
      type="file"
      id="productImage"
      accept="image/*"
    >
<button
  type="button"
  id="aiImageBtn"
  onclick="generateAIImage()"
>
  🤖 AI से Product Image बनाएं
</button>
    <div class="preview">
      <img id="previewImage" alt="Product Preview">
    </div>

    <button id="addProductBtn" onclick="addProduct()">
      ➕ Add Product
    </button>

    <div id="message"></div>

    <a href="index.html" class="back">
      ← Marketplace par wapas
    </a>

  </div>

</div>

<script>

const SUPABASE_URL = "https://uryjmibcdfjfxolrijgt.supabase.co";

const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_uYbJw0ARCCkQ9QB6FxaQ_JrIxtOOp";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


// IMAGE PREVIEW
document
  .getElementById("productImage")
  .addEventListener("change", function(e) {

    const file = e.target.files[0];

    if (!file) return;

    const preview =
      document.getElementById("previewImage");

    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
  });
// AI PRODUCT IMAGE
async function generateAIImage() {

  const productName =
    document.getElementById("productName").value.trim();

  if (!productName) {
    showMessage("❌ पहले Product Name डालें", false);
    return;
  }

  const button =
    document.getElementById("aiImageBtn");

  button.disabled = true;
  button.innerText = "🤖 AI Image बना रहा है...";

  try {

    const response = await fetch(
      "/api/generate-image",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          productName: productName
        })
      }
    );

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "AI image generate नहीं हुई"
      );
    }

    const byteCharacters = atob(data.image);
    const byteNumbers =
      new Array(byteCharacters.length);

    for (let i = 0; i < byteCharacters.length; i++) {
      byteNumbers[i] =
        byteCharacters.charCodeAt(i);
    }

    const byteArray =
      new Uint8Array(byteNumbers);

    const blob =
      new Blob([byteArray], {
        type: "image/png"
      });

    const file =
      new File(
        [blob],
        "ai-product-image.png",
        {
          type: "image/png"
        }
      );

    const dataTransfer =
      new DataTransfer();

    dataTransfer.items.add(file);

    document.getElementById(
      "productImage"
    ).files = dataTransfer.files;

    const preview =
      document.getElementById(
        "previewImage"
      );

    preview.src =
      URL.createObjectURL(blob);

    preview.style.display = "block";

    showMessage(
      "✅ AI Product Image ready hai!"
    );

  } catch (error) {

    console.error(error);

    showMessage(
      "❌ AI image नहीं बनी: " +
      error.message,
      false
    );

  } finally {

    button.disabled = false;
    button.innerText =
      "🤖 AI से Product Image बनाएं";
  }
}

// MESSAGE
function showMessage(text, success = true) {

  const message =
    document.getElementById("message");

  message.innerText = text;
  message.style.display = "block";

  message.style.background =
    success ? "#d4edda" : "#f8d7da";

  message.style.color =
    success ? "#155724" : "#721c24";
}


// ADD PRODUCT
async function requireSeller() {
  const { data: { user }, error } = await supabaseClient.auth.getUser();
  if (error || !user) {
    location.href = "seller-login.html";
    return null;
  }
  const { data: seller, error: se } = await supabaseClient.from("sellers")
    .select("id,business_name,owner_name,status,is_active")
    .eq("id", user.id).maybeSingle();
  if (se || !seller || String(seller.status || "").toLowerCase() !== "approved" || seller.is_active !== true) {
    await supabaseClient.auth.signOut();
    location.href = "seller-login.html";
    return null;
  }
  document.getElementById("sellerStatus").textContent =
    "🏪 " + (seller.business_name || seller.owner_name || user.email) + " • Approved";
  return { user, seller };
}

async function addProduct() {
  const session = await requireSeller();
  if (!session) return;

  const productName = document.getElementById("productName").value.trim();
  const brand = document.getElementById("brand").value.trim();
  const description = document.getElementById("description").value.trim();
  const price = Number(document.getElementById("price").value);
  const stock = Number(document.getElementById("stock").value);
  const category = document.getElementById("category").value;
  const imageFile = document.getElementById("productImage").files[0];
  const button = document.getElementById("addProductBtn");

  if (!productName) return showMessage("❌ Product name डालें", false);
  if (!price || price <= 0) return showMessage("❌ सही price डालें", false);
  if (stock < 0) return showMessage("❌ सही stock डालें", false);
  if (!imageFile) return showMessage("❌ Product image चुनें", false);

  button.disabled = true;
  button.innerText = "⏳ Product add ho raha hai...";

  try {
    const safeName = imageFile.name.replace(/[^a-zA-Z0-9._-]/g, "-");
    const fileName = session.user.id + "/" + Date.now() + "-" + safeName;

    const { error: uploadError } = await supabaseClient.storage
      .from("product-images").upload(fileName, imageFile, { upsert: false });
    if (uploadError) throw uploadError;

    const { data: imageData } = supabaseClient.storage
      .from("product-images").getPublicUrl(fileName);

    const payload = {
      product_name: productName,
      price, stock, category,
      image_url: imageData.publicUrl,
      seller_id: session.user.id
    };
    if (brand) payload.brand = brand;
    if (description) payload.description = description;

    const { error: productError } = await supabaseClient.from("products").insert([payload]);
    if (productError) throw productError;

    showMessage("✅ Product successfully add ho gaya!", true);
    ["productName","brand","description","price","stock","productImage"].forEach(id => {
      const el=document.getElementById(id); if(el) el.value="";
    });
    document.getElementById("previewImage").style.display="none";
  } catch (error) {
    console.error(error);
    showMessage("❌ Product add nahi hua: " + error.message, false);
  } finally {
    button.disabled = false;
    button.innerText = "➕ Add Product";
  }
}

async function sellerLogout() {
  await supabaseClient.auth.signOut();
  location.href = "seller-login.html";
}

requireSeller();
</script>

</body>
</html>
