<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Panel - BR Digital Marketplace</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #18202a;
    }

    header {
      background: #ffffff;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 10px #ddd;
    }

    .brand {
      font-size: 20px;
      font-weight: bold;
    }

    .logo {
      background: #ff7900;
      color: white;
      padding: 10px;
      border-radius: 10px;
      margin-right: 8px;
    }

    .container {
      max-width: 700px;
      margin: 25px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 3px 15px #ddd;
    }

    h1 {
      margin-top: 0;
      color: #ff7900;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, textarea, select {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: 0;
      border-radius: 8px;
      background: #ff7900;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .success {
      display: none;
      margin-top: 15px;
      padding: 12px;
      background: #d9f7df;
      color: #176b2c;
      border-radius: 8px;
    }

    .back {
      display: inline-block;
      margin-top: 18px;
      color: #ff7900;
      text-decoration: none;
      font-weight: bold;
    }
    .scan-box {
  margin: 20px 0;
  padding: 15px;
  background: #fff7ed;
  border: 1px solid #fed7aa;
  border-radius: 12px;
}

.scan-box h3 {
  margin-top: 0;
}

.scan-box button {
  background: #ff7a00;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

#scannerBox {
  margin-top: 15px;
}

#scannerVideo {
  width: 100%;
  max-height: 300px;
  border-radius: 12px;
  background: #000;
}

#scanStatus {
  font-weight: bold;
}

#barcodeResult {
  color: green;
  font-weight: bold;
}
  </style>
</head>

<body>

<header>
  <div class="brand">
    <span class="logo">BR</span>
    Digital Marketplace
  </div>
</header>

<div class="container">

  <div class="card">

    <h1>Seller Panel 👨‍💼</h1>
    <p>Apna product BR Digital Marketplace par add karein.</p>

    <form id="productForm">

      <label>Product Name</label>
      <input
        type="text"
        id="name"
        placeholder="Jaise: Stylish T-Shirt"
        required
      >
      <div class="scan-box">
  <h3>📷 Scan Product Barcode</h3>

  <button type="button" onclick="alert('Barcode button working')"
    📷 Barcode Scan Karein
  </button>

  <div id="scannerBox" style="display:none;">
    <video id="scannerVideo" autoplay playsinline></video>
    <p id="scanStatus">Barcode scan ho raha hai...</p>

    <button type="button" onclick="stopScanner()">
      ❌ Scanner Band Karein
    </button>
  </div>

  <p id="barcodeResult"></p>
      </div>

      <label>Product Description</label>
      <textarea
        id="description"
        placeholder="Product ke baare mein likhein"
        required
      ></textarea>

      <label>Price ₹</label>
      <input
        type="number"
        id="price"
        placeholder="499"
        min="1"
        required
      >

      <label>Product Image URL</label>
      <input
        type="url"
        id="image_url"
        placeholder="https://example.com/product.jpg"
        required
      >

      <label>Category</label>
      <select id="category" required>
        <option value="">Category select karein</option>
        <option value="fashion">Fashion</option>
        <option value="electronics">Electronics</option>
        <option value="home">Home</option>
        <option value="grocery">Grocery</option>
      </select>

      <button type="submit">
        ➕ Product Add Karein
      </button>

    </form>

    <div class="success" id="success">
      ✅ Product add request successfully bhej di gayi!
    </div>

    <a class="back" href="index.html">
      ← Marketplace par wapas
    </a>

  </div>

</div>

<script>
  document.getElementById("productForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const product = {
      name: document.getElementById("name").value,
      description: document.getElementById("description").value,
      price: Number(document.getElementById("price").value),
      image_url: document.getElementById("image_url").value,
      category: document.getElementById("category").value
    };

    try {

      const response = await fetch("/api/products", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(product)
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Product add nahi hua");
      }

      document.getElementById("success").style.display = "block";
      document.getElementById("productForm").reset();

    } catch (error) {

      alert("Error: " + error.message);

    }
// ===============================
// BARCODE / QR SCANNER
// ===============================

let scannerStream = null;
let scannerRunning = false;

async function startScanner() {
    const scannerBox = document.getElementById("scannerBox");
    const video = document.getElementById("scannerVideo");
    const status = document.getElementById("scanStatus");

    try {
        scannerBox.style.display = "block";
        status.textContent = "📷 Camera permission maang raha hai...";

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            alert("❌ Is browser mein camera support nahi hai.");
            return;
        }

        scannerStream = await navigator.mediaDevices.getUserMedia({
            video: {
                facingMode: "environment"
            },
            audio: false
        });

        video.srcObject = scannerStream;
        video.setAttribute("playsinline", "");
        video.setAttribute("autoplay", "");

        await video.play();

        scannerRunning = true;

        status.textContent =
            "📷 Camera ON hai — Barcode camera ke saamne rakhein.";

        if (!("BarcodeDetector" in window)) {
            status.textContent =
                "⚠️ Camera ON hai, lekin barcode scanner browser mein supported nahi hai.";
            return;
        }

        const detector = new BarcodeDetector({
            formats: [
                "qr_code",
                "ean_13",
                "ean_8",
                "code_128",
                "code_39",
                "upc_a",
                "upc_e"
            ]
        });

        scanLoop(detector, video, status);

    } catch (error) {
        console.error("Camera Error:", error);

        alert(
            "❌ Camera open nahi hua.\n\n" +
            "Error: " + error.name + "\n" +
            error.message
        );
    }
}


async function scanLoop(detector, video, status) {

  if (!scannerRunning) return;

  try {

    const barcodes = await detector.detect(video);

    if (barcodes.length > 0) {

      const code = barcodes[0].rawValue;
      const format = barcodes[0].format;

if (format !== "qr_code") {
    getProductByBarcode(code);
    stopScanner();
    return;
}

      document.getElementById("barcodeResult").innerText =
        "✅ Code: " + code;

      // QR Code ke andar JSON product data ho to
      try {

        const productData = JSON.parse(code);

        if (productData.name) {
          document.getElementById("name").value =
            productData.name;
        }

        if (productData.description) {
          document.getElementById("description").value =
            productData.description;
        }

        if (productData.price) {
          document.getElementById("price").value =
            productData.price;
        }

        if (productData.image_url) {
          document.getElementById("image_url").value =
            productData.image_url;
        }

        if (productData.category) {
          document.getElementById("category").value =
            productData.category;
        }

        status.innerText =
          "✅ Product details automatically fill ho gayi!";

      } catch (e) {

        // Agar normal barcode number hai
        status.innerText =
          "✅ Barcode scan ho gaya: " + code;

      }

      stopScanner();
      return;
    }

  } catch (error) {
    console.log(error);
  }

  requestAnimationFrame(() =>
    scanLoop(detector, video, status)
  );
}


function stopScanner() {

  scannerRunning = false;

  const video = document.getElementById("scannerVideo");

  if (scannerStream) {

    scannerStream.getTracks().forEach(track => {
      track.stop();
    });

    scannerStream = null;
  }

  video.srcObject = null;

  document.getElementById("scannerBox").style.display =
    "none";
  async function getProductByBarcode(barcode) {
    const status = document.getElementById("scanStatus");

    status.textContent = "🔎 Product details खोज रहे हैं...";

    try {
        const response = await fetch(
            "https://world.openfoodfacts.org/api/v2/product/" + barcode + ".json"
        );

        const data = await response.json();

        if (!data.product) {
            status.textContent =
                "❌ Product नहीं मिला। Details manually भरें।";
            return;
        }

        const product = data.product;

        document.getElementById("name").value =
            product.product_name ||
            product.product_name_en ||
            "";

        document.getElementById("description").value =
            product.generic_name ||
            product.ingredients_text ||
            "Product description उपलब्ध नहीं है।";

        if (product.image_front_url) {
            document.getElementById("image_url").value =
                product.image_front_url;
        }

        status.textContent =
            "✅ Product details automatically भर दिए गए हैं।";

    } catch (error) {
        console.error(error);

        status.textContent =
            "⚠️ Product details नहीं मिल सके।";
    }
  }
</script>

</body>
  </html>
