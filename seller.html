<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Dashboard - BR Digital Marketplace</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#17202a}header{background:#fff;padding:14px 18px;display:flex;align-items:center;box-shadow:0 2px 10px #0001;position:sticky;top:0;z-index:5}.logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700}.logo-box{background:#ff7a00;color:#fff;width:45px;height:45px;border-radius:13px;display:flex;align-items:center;justify-content:center}.container{max-width:850px;margin:22px auto;padding:16px}.card{background:#fff;padding:22px;border-radius:18px;box-shadow:0 5px 20px #0001;margin-bottom:18px}h1,h2{margin-top:0}label{display:block;margin-top:15px;margin-bottom:7px;font-weight:700}input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px;background:#fff}button{border:0;border-radius:10px;padding:13px 16px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:#ff7a00;color:#fff;width:100%;margin-top:20px}.secondary{background:#4b22b5;color:#fff;width:100%;margin-top:12px}.gray{background:#eef0f3;color:#17202a;width:100%;margin-top:10px}.test{background:#e9eef5;color:#17202a;width:100%;margin-top:10px}button:disabled{opacity:.55}#message{margin-top:16px;padding:12px;border-radius:10px;display:none}.preview{text-align:center;margin-top:15px}.preview img{width:220px;height:220px;object-fit:contain;border-radius:14px;border:1px solid #eee;display:none;margin:auto}.product-list{display:grid;gap:12px}.product{display:flex;gap:12px;align-items:center;border:1px solid #eee;border-radius:14px;padding:10px}.product img{width:78px;height:78px;object-fit:cover;border-radius:10px;background:#f3f3f3}.product-info{flex:1;min-width:0}.product-name{font-weight:700;margin-bottom:5px}.muted{color:#666;font-size:14px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.actions button{padding:8px 11px;font-size:13px}.edit{background:#4b22b5;color:#fff}.delete{background:#dc3545;color:#fff}.back{display:block;text-align:center;margin-top:14px;color:#ff7a00;text-decoration:none;font-weight:700}.mode{background:#f2ebff;border:1px solid #d9c8ff;padding:10px;border-radius:10px;margin-bottom:12px;display:none}@media(max-width:600px){.container{padding:10px}.card{padding:16px}.product{align-items:flex-start}.product img{width:65px;height:65px}}</style></head><body><header><div class="logo"><div class="logo-box">BR</div>BR Digital Marketplace</div></header><div class="container"><div class="card"><h1>🛍️ Seller Dashboard</h1><p>Product add karein ya apne product ko edit karein.</p><div id="editMode" class="mode">✏️ <b>Edit Mode:</b> Aap is product ki details update kar rahe hain.</div><label>Product Name</label><input id="productName" type="text" placeholder="Example: APEX Magnetic Chess"><label>Price (₹)</label><input id="price" type="number" min="0" placeholder="Example: 499"><label>Stock</label><input id="stock" type="number" min="0" placeholder="Example: 20"><label>Category</label><select id="category"><option value="mobiles">Mobiles</option><option value="electronics">Electronics</option><option value="fashion">Fashion</option><option value="home">Home</option><option value="beauty">Beauty</option><option value="toys-games">Toys & Games</option><option value="accessories">Accessories</option><option value="sports">Sports</option><option value="other">Other</option></select><label>Product Photo</label><input id="productImage" type="file" accept="image/*"><button id="aiImageBtn" class="secondary" type="button">🤖 AI से Professional Product Image बनाएं</button><div class="preview"><img id="previewImage" alt="Product Preview"></div><button id="saveBtn" class="primary">➕ Product Add करें</button><button id="cancelEditBtn" class="gray" style="display:none">Cancel Edit</button><button id="testBtn" class="test" type="button">🔌 Supabase Connection Test</button><div id="message"></div></div><div class="card"><h2>📦 मेरे Products</h2><p class="muted">यहाँ से Product को Edit या Delete कर सकते हैं।</p><div id="productList"><p class="muted">Products load हो रहे हैं...</p></div></div><a href="index.html" class="back">← Marketplace पर वापस</a></div><script>
const SUPABASE_URL="https://urymibcdfjfxolrijgt.supabase.co";
const SUPABASE_KEY="sb_publishable_uYbJw0ARCCkCpQ9QB6FxaQ_JrI";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const productName=document.getElementById('productName'),price=document.getElementById('price'),stock=document.getElementById('stock'),category=document.getElementById('category'),imageInput=document.getElementById('productImage'),preview=document.getElementById('previewImage'),message=document.getElementById('message'),saveBtn=document.getElementById('saveBtn'),cancelBtn=document.getElementById('cancelEditBtn'),editMode=document.getElementById('editMode');
let editId=new URLSearchParams(location.search).get('edit');let currentImageUrl='';
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function showMessage(t,ok=true){message.textContent=t;message.style.display='block';message.style.background=ok?'#d4edda':'#f8d7da';message.style.color=ok?'#155724':'#721c24'}
imageInput.addEventListener('change',()=>{const f=imageInput.files[0];if(f){preview.src=URL.createObjectURL(f);preview.style.display='block'}});
async function loadProducts(){const list=document.getElementById('productList');list.innerHTML='<p class="muted">Products load हो रहे हैं...</p>';try{const r=await supabaseClient.from('products').select('id,product_name,price,stock,category,image_url').order('id',{ascending:false});if(r.error)throw r.error;const data=r.data||[];if(!data.length){list.innerHTML='<p class="muted">अभी कोई product नहीं है।</p>';return}list.innerHTML=data.map(p=>`<div class="product"><img src="${esc(p.image_url)}" alt="${esc(p.product_name)}" onerror="this.style.display='none'"><div class="product-info"><div class="product-name">${esc(p.product_name)}</div><div>₹${Number(p.price||0)} · Stock: ${Number(p.stock||0)}</div><div class="muted">Category: ${esc(p.category||'-')}</div><div class="actions"><button class="edit" onclick="startEdit('${esc(p.id)}')">✏️ Edit</button><button class="delete" onclick="deleteProduct('${esc(p.id)}')">🗑️ Delete</button></div></div></div>`).join('')}catch(e){console.error(e);list.innerHTML='<p class="muted">❌ Products load नहीं हुए: '+esc(e.message||e)+'<br><br>अगर यह Failed to fetch है, नीचे Supabase Connection Test दबाएँ।</p>'}}
async function testConnection(){showMessage('🔌 Supabase connection test हो रहा है...',true);try{const r=await fetch(SUPABASE_URL+'/rest/v1/products?select=id&limit=1',{headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY}});const text=await r.text();if(!r.ok)throw Error('HTTP '+r.status+' — '+text.slice(0,180));showMessage('✅ Supabase connection ठीक है। Products table accessible है।',true);await loadProducts()}catch(e){console.error(e);showMessage('❌ Supabase connection failed: '+(e.message||e),false)}}
async function startEdit(id){try{const r=await supabaseClient.from('products').select('id,product_name,price,stock,category,image_url').eq('id',id).single();if(r.error)throw r.error;editId=String(r.data.id);currentImageUrl=r.data.image_url||'';productName.value=r.data.product_name||'';price.value=r.data.price??'';stock.value=r.data.stock??'';category.value=r.data.category||'other';editMode.style.display='block';cancelBtn.style.display='block';saveBtn.textContent='💾 Product Update करें';if(currentImageUrl){preview.src=currentImageUrl;preview.style.display='block'}history.replaceState({},'', 'seller.html?edit='+encodeURIComponent(editId));scrollTo({top:0,behavior:'smooth'})}catch(e){showMessage('❌ Product नहीं मिला: '+(e.message||e),false)}}
function clearForm(){productName.value='';price.value='';stock.value='';category.value='mobiles';imageInput.value='';preview.src='';preview.style.display='none'}
function cancelEdit(){editId=null;currentImageUrl='';history.replaceState({},'','seller.html');clearForm();editMode.style.display='none';cancelBtn.style.display='none';saveBtn.textContent='➕ Product Add करें'}
async function deleteProduct(id){if(!confirm('क्या आप यह Product delete करना चाहते हैं?'))return;try{const r=await supabaseClient.from('products').delete().eq('id',id);if(r.error)throw r.error;showMessage('✅ Product delete हो गया!');if(String(editId)===String(id))cancelEdit();await loadProducts()}catch(e){showMessage('❌ Delete failed: '+(e.message||e),false)}}
async function makeProfessionalImage(){
  const file=imageInput.files[0];
  if(!file){
    showMessage("❌ पहले Product Photo चुनें।",false);
    return;
  }
  const b=document.getElementById("aiImageBtn");
  b.disabled=true;
  b.textContent="✨ Professional image तैयार हो रही है...";
  try{
    const bitmap=await createImageBitmap(file);
    const size=1200, pad=90;
    const canvas=document.createElement("canvas");
    canvas.width=size; canvas.height=size;
    const ctx=canvas.getContext("2d");

    // Clean studio background
    ctx.fillStyle="#ffffff";
    ctx.fillRect(0,0,size,size);

    // Soft marketplace shadow
    ctx.save();
    ctx.filter="blur(28px)";
    ctx.fillStyle="rgba(0,0,0,.18)";
    ctx.beginPath();
    ctx.ellipse(size/2, size*0.80, size*0.30, size*0.055, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();

    const maxW=size-pad*2, maxH=size-pad*2;
    const scale=Math.min(maxW/bitmap.width,maxH/bitmap.height);
    const w=bitmap.width*scale, h=bitmap.height*scale;
    const x=(size-w)/2, y=(size-h)/2-25;

    // Rounded white product card
    ctx.save();
    ctx.shadowColor="rgba(0,0,0,.14)";
    ctx.shadowBlur=22;
    ctx.shadowOffsetY=8;
    ctx.fillStyle="#fff";
    ctx.fillRect(x-18,y-18,w+36,h+36);
    ctx.restore();

    ctx.drawImage(bitmap,x,y,w,h);

    const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/jpeg",0.92));
    if(!blob) throw Error("Image processing failed");

    preview.src=URL.createObjectURL(blob);
    preview.style.display="block";

    const dt=new DataTransfer();
    dt.items.add(new File([blob],"professional-product-image.jpg",{type:"image/jpeg"}));
    imageInput.files=dt.files;

    showMessage("✅ Professional Product Image ready है।");
  }catch(e){
    showMessage("❌ Image तैयार नहीं हुई: "+e.message,false);
  }finally{
    b.disabled=false;
    b.textContent="✨ Professional Product Image बनाएं";
  }
}
async function saveProduct(){const name=productName.value.trim(),p=Number(price.value),s=Number(stock.value),c=category.value,f=imageInput.files[0];if(!name)return showMessage('❌ Product Name डालें।',false);if(!Number.isFinite(p)||p<=0)return showMessage('❌ सही Price डालें।',false);if(!Number.isInteger(s)||s<0)return showMessage('❌ सही Stock डालें।',false);saveBtn.disabled=true;saveBtn.textContent=editId?'⏳ Product update हो रहा है...':'⏳ Product add हो रहा है...';try{let url=currentImageUrl;if(f){const fn=Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'-');const u=await supabaseClient.storage.from('product-images').upload(fn,f,{upsert:false});if(u.error)throw u.error;const g=supabaseClient.storage.from('product-images').getPublicUrl(fn);url=g.data.publicUrl}if(!url)throw Error('Product Photo चुनें।');const payload={product_name:name,price:p,stock:s,category:c,image_url:url};const r=editId?await supabaseClient.from('products').update(payload).eq('id',editId):await supabaseClient.from('products').insert([payload]);if(r.error)throw r.error;showMessage(editId?'✅ Product successfully update हो गया!':'✅ Product successfully add हो गया!');cancelEdit();await loadProducts()}catch(e){console.error(e);showMessage('❌ काम नहीं हुआ: '+(e.message||e),false)}finally{saveBtn.disabled=false;if(!editId)saveBtn.textContent='➕ Product Add करें'}}
document.getElementById('aiImageBtn').onclick=makeProfessionalImage;document.getElementById('saveBtn').onclick=saveProduct;cancelBtn.onclick=cancelEdit;document.getElementById('testBtn').onclick=testConnection;loadProducts();if(editId)startEdit(editId);
</script></body></html>
