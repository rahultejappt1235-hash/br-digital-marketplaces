<!doctype html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seller Dashboard - BR Digital Marketplace</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#17202a}header{background:#fff;padding:14px 18px;display:flex;align-items:center;box-shadow:0 2px 10px #0001;position:sticky;top:0;z-index:5}.logo{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700}.logo-box{background:#ff7a00;color:#fff;width:45px;height:45px;border-radius:13px;display:flex;align-items:center;justify-content:center}.container{max-width:850px;margin:22px auto;padding:16px}.card{background:#fff;padding:22px;border-radius:18px;box-shadow:0 5px 20px #0001;margin-bottom:18px}h1,h2{margin-top:0}label{display:block;margin-top:15px;margin-bottom:7px;font-weight:700}input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px;background:#fff}button{border:0;border-radius:10px;padding:13px 16px;font-size:16px;font-weight:700;cursor:pointer}.primary{background:#ff7a00;color:#fff;width:100%;margin-top:20px}.secondary{background:#4b22b5;color:#fff;width:100%;margin-top:12px}.gray{background:#eef0f3;color:#17202a;width:100%;margin-top:10px}button:disabled{opacity:.55}#message{margin-top:16px;padding:12px;border-radius:10px;display:none}.preview{text-align:center;margin-top:15px}.preview img{width:220px;height:220px;object-fit:contain;border-radius:14px;border:1px solid #eee;display:none;margin:auto}.product-list{display:grid;gap:12px}.product{display:flex;gap:12px;align-items:center;border:1px solid #eee;border-radius:14px;padding:10px}.product img{width:78px;height:78px;object-fit:cover;border-radius:10px;background:#f3f3f3}.product-info{flex:1;min-width:0}.product-name{font-weight:700;margin-bottom:5px}.muted{color:#666;font-size:14px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.actions button{padding:8px 11px;font-size:13px}.edit{background:#4b22b5;color:#fff}.delete{background:#dc3545;color:#fff}.back{display:block;text-align:center;margin-top:14px;color:#ff7a00;text-decoration:none;font-weight:700}.mode{background:#f2ebff;border:1px solid #d9c8ff;padding:10px;border-radius:10px;margin-bottom:12px;display:none}@media(max-width:600px){.container{padding:10px}.card{padding:16px}.product{align-items:flex-start}.product img{width:65px;height:65px}}</style></head><body><header><div class="logo"><div class="logo-box">BR</div>BR Digital Marketplace</div></header><div class="container"><div class="card"><h1>🛍️ Seller Dashboard</h1><p>Product add karein ya apne product ko edit karein.</p><div id="editMode" class="mode">✏️ <b>Edit Mode:</b> Aap is product ki details update kar rahe hain.</div><label>Product Name</label><input id="productName" type="text" placeholder="Example: APEX Magnetic Chess"><label>Price (₹)</label><input id="price" type="number" min="0" placeholder="Example: 499"><label>Stock</label><input id="stock" type="number" min="0" placeholder="Example: 20"><label>Category</label><select id="category"><option value="mobiles">Mobiles</option><option value="electronics">Electronics</option><option value="fashion">Fashion</option><option value="home">Home</option><option value="beauty">Beauty</option><option value="toys-games">Toys & Games</option><option value="accessories">Accessories</option><option value="sports">Sports</option><option value="other">Other</option></select><label>Product Photo</label><input id="productImage" type="file" accept="image/*"><button id="aiImageBtn" class="secondary" type="button" onclick="generateAIImage()">🤖 AI से Professional Product Image बनाएं</button><div class="preview"><img id="previewImage" alt="Product Preview"></div><button id="saveBtn" class="primary" onclick="saveProduct()">➕ Product Add करें</button><button id="cancelEditBtn" class="gray" style="display:none" onclick="cancelEdit()">Cancel Edit</button><div id="message"></div></div><div class="card"><h2>📦 मेरे Products</h2><p class="muted">यहाँ से Product को Edit या Delete कर सकते हैं।</p><div id="productList" class="product-list"><p class="muted">Products load हो रहे हैं...</p></div></div><a href="index.html" class="back">← Marketplace पर वापस</a></div><script>const SUPABASE_URL="https://urymibcdfjfxolrijgt.supabase.co",SUPABASE_PUBLISHABLE_KEY="sb_publishable_uYbJw0ARCCkCpQ9QB6FxaQ_JrI",supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);let editId=new URLSearchParams(location.search).get("edit"),currentImageUrl="";const imageInput=document.getElementById("productImage"),preview=document.getElementById("previewImage");imageInput.addEventListener("change",e=>{const f=e.target.files[0];if(f){preview.src=URL.createObjectURL(f);preview.style.display="block"}});function showMessage(t,ok=true){const b=document.getElementById("message");b.textContent=t;b.style.display="block";b.style.background=ok?"#d4edda":"#f8d7da";b.style.color=ok?"#155724":"#721c24"}function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]))}async function loadProducts(){const l=document.getElementById("productList"),r=await supabaseClient.from("products").select("id,product_name,price,stock,category,image_url").order("id",{ascending:false});if(r.error){l.innerHTML="<p class=muted>❌ Products load नहीं हुए: "+esc(r.error.message)+"</p>";return}if(!r.data?.length){l.innerHTML="<p class=muted>अभी कोई product नहीं है।</p>";return}l.innerHTML=r.data.map(p=>`<div class="product"><img src="${esc(p.image_url)}" alt="${esc(p.product_name)}" onerror="this.src='https://via.placeholder.com/200x200?text=Product'"><div class="product-info"><div class="product-name">${esc(p.product_name)}</div><div>₹${Number(p.price||0)} · Stock: ${Number(p.stock||0)}</div><div class="muted">Category: ${esc(p.category||"-")}</div><div class="actions"><button class="edit" onclick="startEdit('${esc(p.id)}')">✏️ Edit</button><button class="delete" onclick="deleteProduct('${esc(p.id)}')">🗑️ Delete</button></div></div></div>`).join("")}async function startEdit(id){const r=await supabaseClient.from("products").select("id,product_name,price,stock,category,image_url").eq("id",id).single();if(r.error){showMessage("❌ Product नहीं मिला: "+r.error.message,false);return}editId=String(r.data.id);currentImageUrl=r.data.image_url||"";productName.value=r.data.product_name||"";price.value=r.data.price??"";stock.value=r.data.stock??"";category.value=r.data.category||"other";editMode.style.display="block";cancelEditBtn.style.display="block";saveBtn.textContent="💾 Product Update करें";if(currentImageUrl){preview.src=currentImageUrl;preview.style.display="block"}history.replaceState({},"","seller.html?edit="+encodeURIComponent(editId));scrollTo({top:0,behavior:"smooth"})}function cancelEdit(){editId=null;currentImageUrl="";history.replaceState({},"","seller.html");clearForm();editMode.style.display="none";cancelEditBtn.style.display="none";saveBtn.textContent="➕ Product Add करें"}async function deleteProduct(id){if(!confirm("क्या आप यह Product delete करना चाहते हैं?"))return;const r=await supabaseClient.from("products").delete().eq("id",id);if(r.error){showMessage("❌ Delete failed: "+r.error.message,false);return}if(String(editId)===String(id))cancelEdit();showMessage("✅ Product delete हो गया!");loadProducts()}async function generateAIImage(){const name=productName.value.trim();if(!name){showMessage("❌ पहले Product Name डालें।",false);return}const b=document.getElementById("aiImageBtn");b.disabled=true;b.textContent="🤖 AI Image बना रहा है...";try{const x=await fetch("/api/generate-image",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({productName:name})}),d=await x.json();if(!x.ok)throw Error(d.error||"AI image generate नहीं हुई");if(!d.image)throw Error("AI response में image नहीं मिली");const bytes=Uint8Array.from(atob(d.image),c=>c.charCodeAt(0)),blob=new Blob([bytes],{type:"image/png"});preview.src=URL.createObjectURL(blob);preview.style.display="block";const dt=new DataTransfer();dt.items.add(new File([blob],"ai-product-image.png",{type:"image/png"}));imageInput.files=dt.files;showMessage("✅ AI Product Image ready है!")}catch(e){showMessage("❌ AI image नहीं बनी: "+e.message,false)}finally{b.disabled=false;b.textContent="🤖 AI से Professional Product Image बनाएं"}}async function saveProduct(){const name=productName.value.trim(),p=Number(price.value),s=Number(stock.value),c=category.value,f=imageInput.files[0],b=document.getElementById("saveBtn");if(!name)return showMessage("❌ Product Name डालें।",false);if(!Number.isFinite(p)||p<=0)return showMessage("❌ सही Price डालें।",false);if(!Number.isInteger(s)||s<0)return showMessage("❌ सही Stock डालें।",false);b.disabled=true;b.textContent=editId?"⏳ Product update हो रहा है...":"⏳ Product add हो रहा है...";try{let url=currentImageUrl;if(f){const fn=Date.now()+"-"+f.name.replace(/[^a-zA-Z0-9._-]/g,"-");const u=await supabaseClient.storage.from("product-images").upload(fn,f);if(u.error)throw u.error;url=supabaseClient.storage.from("product-images").getPublicUrl(fn).data.publicUrl}if(!url)throw Error("Product Photo चुनें।");const payload={product_name:name,price:p,stock:s,category:c,image_url:url};let r;if(editId)r=await supabaseClient.from("products").update(payload).eq("id",editId);else r=await supabaseClient.from("products").insert([payload]);if(r.error)throw r.error;showMessage(editId?"✅ Product successfully update हो गया!":"✅ Product successfully add हो गया!");editId=null;currentImageUrl="";history.replaceState({},"","seller.html");clearForm();editMode.style.display="none";cancelEditBtn.style.display="none";saveBtn.textContent="➕ Product Add करें";await loadProducts()}catch(e){showMessage("❌ काम नहीं हुआ: "+e.message,false)}finally{b.disabled=false;if(!editId)b.textContent="➕ Product Add करें"}}function clearForm(){productName.value="";price.value="";stock.value="";category.value="mobiles";imageInput.value="";preview.src="";preview.style.display="none"}async function init(){await loadProducts();if(editId)await startEdit(editId)}init();</script></body></html>
