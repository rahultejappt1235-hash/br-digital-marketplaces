<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - BR Digital Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f5f7fb;
  font-family:Arial,sans-serif;
  color:#172033;
}

.card{
  width:calc(100% - 32px);
  max-width:600px;
  background:#fff;
  padding:42px 34px;
  border-radius:28px;
  box-shadow:0 15px 45px rgba(0,0,0,.10);
}

.logo{
  width:118px;
  height:118px;
  margin:0 auto 25px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ff7800;
  color:white;
  border-radius:28px;
  font-size:44px;
  font-weight:800;
}

h1{
  text-align:center;
  font-size:38px;
  margin:0 0 8px;
}

.sub{
  text-align:center;
  color:#697386;
  font-size:20px;
  margin-bottom:35px;
}

label{
  display:block;
  font-size:20px;
  font-weight:700;
  margin:20px 0 9px;
}

input{
  width:100%;
  padding:18px 20px;
  border:1px solid #d5d8dd;
  border-radius:15px;
  font-size:18px;
  outline:none;
}

input:focus{
  border-color:#ff7800;
}

button{
  width:100%;
  margin-top:28px;
  padding:18px;
  border:0;
  border-radius:15px;
  background:#ff7800;
  color:#fff;
  font-size:20px;
  font-weight:700;
}

button:disabled{
  opacity:.6;
}

#message{
  display:none;
  margin-top:20px;
  padding:15px;
  border-radius:12px;
  text-align:center;
  font-size:17px;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.back{
  display:block;
  text-align:center;
  margin-top:28px;
  color:#e87500;
  text-decoration:none;
  font-size:18px;
  font-weight:700;
}

@media(max-width:480px){
  .card{padding:35px 22px}
  h1{font-size:32px}
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">BR</div>

  <h1>Reset Password</h1>
  <div class="sub">BR Digital Marketplace</div>

  <label>New Password</label>
  <input
    id="password"
    type="password"
    placeholder="New Password"
    minlength="6"
  >

  <label>Confirm Password</label>
  <input
    id="confirmPassword"
    type="password"
    placeholder="Confirm Password"
    minlength="6"
  >

  <button id="updateBtn">🔐 Update Password</button>

  <div id="message"></div>

  <a class="back" href="admin-login.html">
    ← वापस Admin Login पर जाएँ
  </a>

</div>

<script>

const SUPABASE_URL =
"https://uryjmibcdfjfxoljrigt.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
"sb_publishable_uYbJw0ARCCkCpQ9QB6FxaQ_JrIxtOOp";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);

const password = document.getElementById("password");
const confirmPassword = document.getElementById("confirmPassword");
const updateBtn = document.getElementById("updateBtn");
const message = document.getElementById("message");

function showMessage(text,type){
  message.textContent = text;
  message.className = type;
  message.style.display = "block";
}

updateBtn.onclick = async () => {

  const p = password.value.trim();
  const cp = confirmPassword.value.trim();

  message.style.display = "none";

  if(p.length < 6){
    showMessage(
      "Password कम से कम 6 characters का होना चाहिए।",
      "error"
    );
    return;
  }

  if(p !== cp){
    showMessage(
      "दोनों passwords match नहीं कर रहे हैं।",
      "error"
    );
    return;
  }

  updateBtn.disabled = true;
  updateBtn.textContent = "Updating...";

  try{

    const { data: sessionData } =
      await db.auth.getSession();

    if(!sessionData.session){
      showMessage(
        "Reset link expire हो गया है। कृपया Gmail से नया Reset Password link लें।",
        "error"
      );

      updateBtn.disabled = false;
      updateBtn.textContent = "🔐 Update Password";
      return;
    }

    const { error } =
      await db.auth.updateUser({
        password: p
      });

    if(error) throw error;

    showMessage(
      "✅ Password successfully बदल गया! अब Admin Login करें।",
      "success"
    );

    setTimeout(() => {
      window.location.href = "admin-login.html";
    }, 1800);

  }catch(error){

    console.error(error);

    showMessage(
      error.message || "Password update नहीं हो पाया।",
      "error"
    );

    updateBtn.disabled = false;
    updateBtn.textContent = "🔐 Update Password";
  }
};

</script>

</body>
</html>
