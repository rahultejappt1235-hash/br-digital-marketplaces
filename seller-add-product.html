<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Add Product | BR Digital Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6fa;
  color:#222;
}

.header{
  height:60px;
  background:#111827;
  color:white;
  display:flex;
  align-items:center;
  padding:0 20px;
  gap:15px;
}

.header h2{
  margin:0;
  font-size:20px;
}

.back-btn{
  background:#2563eb;
  color:white;
  border:none;
  padding:9px 14px;
  border-radius:7px;
  cursor:pointer;
}

.container{
  max-width:850px;
  margin:25px auto;
  padding:0 15px;
}

.card{
  background:white;
  border-radius:12px;
  padding:25px;
  box-shadow:0 3px 15px rgba(0,0,0,.08);
}

.card h2{
  margin-top:0;
  margin-bottom:20px;
}

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:600;
  margin-bottom:7px;
}

.required{
  color:red;
}

input,
select,
textarea{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:7px;
  font-size:15px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#2563eb;
}

textarea{
  min-height:120px;
  resize:vertical;
}

/* PRICE BOX */

.price-info{
  background:#f0fdf4;
  border:1px solid #bbf7d0;
  padding:14px;
  border-radius:9px;
  margin-top:8px;
  color:#166534;
  font-size:13px;
  line-height:1.5;
}

.price-preview{
  display:none;
  margin-top:10px;
  padding:10px;
  background:#fff7ed;
  border:1px solid #fed7aa;
  border-radius:8px;
  color:#9a3412;
  font-weight:bold;
}

.price-preview strong{
  font-size:18px;
}

.file-box{
  border:2px dashed #cbd5e1;
  padding:18px;
  border-radius:8px;
  text-align:center;
  background:#f8fafc;
}

.preview{
  margin-top:12px;
}

.preview img{
  max-width:180px;
  max-height:180px;
  border-radius:8px;
  object-fit:cover;
  border:1px solid #ddd;
}

.file-name{
  margin-top:8px;
  font-size:14px;
  color:#555;
}

.submit-btn{
  width:100%;
  border:none;
  background:#16a34a;
  color:white;
  padding:14px;
  font-size:17px;
  font-weight:bold;
  border-radius:8px;
  cursor:pointer;
}

.submit-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-bottom:18px;
  padding:12px;
  border-radius:7px;
  font-size:14px;
}

.info{
  background:#eff6ff;
  color:#1d4ed8;
}

.success{
  background:#ecfdf5;
  color:#047857;
}

.error{
  background:#fef2f2;
  color:#b91c1c;
}

.note{
  font-size:13px;
  color:#666;
  margin-top:6px;
}

@media(max-width:600px){

  .header{
    padding:0 12px;
  }

  .header h2{
    font-size:17px;
  }

  .container{
    margin:15px auto;
  }

  .card{
    padding:18px;
  }

}

</style>
</head>

<body>

<div class="header">

  <button
    class="back-btn"
    onclick="goDashboard()">

    ← Back

  </button>

  <h2>
    BR Digital Marketplace | Add Product
  </h2>

</div>


<div class="container">

  <div class="card">

    <h2>
      ➕ Add New Product
    </h2>

    <div
      id="message"
      class="message">
    </div>


    <!-- PRODUCT NAME -->

    <div class="form-group">

      <label>
        Product Name
        <span class="required">*</span>
      </label>

      <input
        type="text"
        id="productName"
        placeholder="Enter product name"
        required>

    </div>


    <!-- BRAND -->

    <div class="form-group">

      <label>
        Brand
        <span class="required">*</span>
      </label>

      <input
        type="text"
        id="brand"
        placeholder="Enter brand name"
        required>

    </div>


    <!-- CATEGORY -->

    <div class="form-group">

      <label>
        Category
        <span class="required">*</span>
      </label>

      <select
        id="category"
        required>

        <option value="">
          Select Category
        </option>

        <option value="Electronics">
          Electronics
        </option>

        <option value="Mobile">
          Mobile
        </option>

        <option value="Fashion">
          Fashion
        </option>

        <option value="Home">
          Home
        </option>

        <option value="Beauty">
          Beauty
        </option>

        <option value="Grocery">
          Grocery
        </option>

        <option value="Other">
          Other
        </option>

      </select>

    </div>


    <!-- PRODUCT TYPE -->

    <div class="form-group">

      <label>
        Product Type
        <span class="required">*</span>
      </label>

      <input
        type="text"
        id="productType"
        placeholder="Example: New / Used / Refurbished"
        required>

    </div>


    <!-- REAL MRP -->

    <div class="form-group">

      <label>
        Real MRP (₹)
        <span class="required">*</span>
      </label>

      <input
        type="number"
        id="mrp"
        placeholder="Enter actual printed MRP"
        min="0"
        step="0.01"
        required
        oninput="calculateDiscountPreview()">

      <div class="price-info">

        🏷️ यहाँ product/package पर printed
        <strong>actual MRP</strong> डालें।

        <br>

        MRP app खुद से नहीं बनाएगा।

      </div>

    </div>


    <!-- SELLING PRICE -->

    <div class="form-group">

      <label>
        Selling Price (₹)
        <span class="required">*</span>
      </label>

      <input
        type="number"
        id="price"
        placeholder="Enter selling price"
        min="0"
        step="0.01"
        required
        oninput="calculateDiscountPreview()">

      <div
        id="pricePreview"
        class="price-preview">
      </div>

    </div>


    <!-- STOCK -->

    <div class="form-group">

      <label>
        Stock
        <span class="required">*</span>
      </label>

      <input
        type="number"
        id="stock"
        placeholder="Enter available stock"
        min="0"
        required>

    </div>


    <!-- DESCRIPTION -->

    <div class="form-group">

      <label>
        Product Description
        <span class="required">*</span>
      </label>

      <textarea
        id="description"
        placeholder="Enter complete product description"
        required></textarea>

    </div>


    <!-- PRODUCT IMAGE -->

    <div class="form-group">

      <label>
        Product Image
        <span class="required">*</span>
      </label>

      <div class="file-box">

        <input
          type="file"
          id="productImage"
          accept=".jpg,.jpeg,.png"
          onchange="showProductImage()"
          required>

        <div class="note">

          JPG / JPEG / PNG —
          Maximum 5 MB

        </div>

        <div
          id="productPreview"
          class="preview">
        </div>

      </div>

    </div>


    <!-- SERIAL / IMEI -->

    <div class="form-group">

      <label>

        Serial Number / IMEI

        <span
          style="color:#777;font-size:13px;">

          (यदि लागू हो)

        </span>

      </label>

      <input
        type="text"
        id="serialNumber"
        placeholder="Enter Serial Number / IMEI">

      <div class="note">

        Mobile, electronics आदि में
        उपलब्ध हो तो दर्ज करें।

      </div>

    </div>


    <!-- INVOICE -->

    <div class="form-group">

      <label>

        Purchase Invoice / Bill

        <span
          style="color:#777;font-size:13px;">

          (यदि उपलब्ध हो)

        </span>

      </label>

      <div class="file-box">

        <input
          type="file"
          id="invoice"
          accept=".jpg,.jpeg,.png,.pdf"
          onchange="showInvoice()">

        <div class="note">

          Invoice उपलब्ध है तो
          JPG, PNG या PDF में upload करें.
          Maximum 5 MB.

        </div>

        <div
          id="invoicePreview"
          class="preview">
        </div>

      </div>

    </div>


    <!-- SUBMIT -->

    <button
      id="submitButton"
      class="submit-btn"
      onclick="submitProduct()">

      Submit Product for Verification

    </button>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://uryjmibcdfjfxoljrigt.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_uYbJw0ARCCkCpQ9QB6FxaQ_JrIxtOOp";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

  const box =
    document.getElementById("message");

  box.innerText = text;

  box.className =
    "message " + type;

  box.style.display =
    "block";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =========================
   DASHBOARD
========================= */

function goDashboard(){

  window.location.href =
    "seller-dashboard.html";

}


/* =========================
   AUTOMATIC DISCOUNT PREVIEW
========================= */

function calculateDiscountPreview(){

  const mrp =
    Number(
      document.getElementById("mrp").value
    );

  const price =
    Number(
      document.getElementById("price").value
    );

  const preview =
    document.getElementById("pricePreview");


  if(
    !mrp ||
    !price ||
    mrp <= 0 ||
    price <= 0
  ){

    preview.style.display =
      "none";

    preview.innerHTML =
      "";

    return;

  }


  if(price > mrp){

    preview.style.display =
      "block";

    preview.style.color =
      "#b91c1c";

    preview.style.background =
      "#fef2f2";

    preview.style.borderColor =
      "#fecaca";

    preview.innerHTML =
      "⚠️ Selling Price MRP से ज्यादा नहीं हो सकती।";

    return;

  }


  const discount =
    Math.round(
      ((mrp - price) / mrp) * 100
    );


  if(discount > 0){

    preview.style.display =
      "block";

    preview.style.color =
      "#9a3412";

    preview.style.background =
      "#fff7ed";

    preview.style.borderColor =
      "#fed7aa";

    preview.innerHTML =

      "Preview: " +

      "<strong>" +

      discount +

      "% OFF</strong>";

  }else{

    preview.style.display =
      "block";

    preview.style.color =
      "#166534";

    preview.style.background =
      "#f0fdf4";

    preview.style.borderColor =
      "#bbf7d0";

    preview.innerHTML =
      "No discount — MRP और Selling Price समान हैं।";

  }

}


/* =========================
   PRODUCT IMAGE PREVIEW
========================= */

function showProductImage(){

  const input =
    document.getElementById(
      "productImage"
    );

  const preview =
    document.getElementById(
      "productPreview"
    );

  preview.innerHTML =
    "";

  const file =
    input.files[0];

  if(!file)
    return;

  try{

    validateProductImage(file);

    const img =
      document.createElement("img");

    img.src =
      URL.createObjectURL(file);

    preview.appendChild(img);


    const name =
      document.createElement("div");

    name.className =
      "file-name";

    name.innerText =
      file.name;

    preview.appendChild(name);

  }catch(error){

    input.value =
      "";

    showMessage(
      error.message,
      "error"
    );

  }

}


/* =========================
   INVOICE PREVIEW
========================= */

function showInvoice(){

  const input =
    document.getElementById(
      "invoice"
    );

  const preview =
    document.getElementById(
      "invoicePreview"
    );

  preview.innerHTML =
    "";

  const file =
    input.files[0];

  if(!file)
    return;

  try{

    validateInvoice(file);


    const name =
      document.createElement("div");

    name.className =
      "file-name";

    name.innerText =
      "📄 " + file.name;

    preview.appendChild(name);


    if(
      file.type.startsWith("image/")
    ){

      const img =
        document.createElement("img");

      img.src =
        URL.createObjectURL(file);

      preview.appendChild(img);

    }else{

      const pdf =
        document.createElement("div");

      pdf.style.marginTop =
        "10px";

      pdf.innerText =
        "📕 PDF Invoice Selected";

      preview.appendChild(pdf);

    }

  }catch(error){

    input.value =
      "";

    showMessage(
      error.message,
      "error"
    );

  }

}


/* =========================
   VALIDATE PRODUCT IMAGE
========================= */

function validateProductImage(file){

  if(!file){

    throw new Error(
      "Product image select करें।"
    );

  }


  if(
    file.size >
    5 * 1024 * 1024
  ){

    throw new Error(
      "Product image maximum 5 MB होना चाहिए।"
    );

  }


  const allowed = [
    "image/jpeg",
    "image/png"
  ];


  if(
    !allowed.includes(
      file.type
    )
  ){

    throw new Error(
      "Product image केवल JPG, JPEG या PNG होना चाहिए।"
    );

  }

}


/* =========================
   VALIDATE INVOICE
========================= */

function validateInvoice(file){

  if(!file)
    return;


  if(
    file.size >
    5 * 1024 * 1024
  ){

    throw new Error(
      "Invoice maximum 5 MB होना चाहिए।"
    );

  }


  const allowed = [
    "image/jpeg",
    "image/png",
    "application/pdf"
  ];


  if(
    !allowed.includes(
      file.type
    )
  ){

    throw new Error(
      "Invoice केवल JPG, PNG या PDF होना चाहिए।"
    );

  }

}


/* =========================
   UPLOAD ORIGINAL PRODUCT IMAGE
   PRIVATE BUCKET
========================= */

async function uploadProductImage(
  file,
  userId
){

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const fileName =
    userId +
    "/" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2) +
    "." +
    extension;


  const {
    error
  } =
    await db
      .storage
      .from(
        "seller-product-originals"
      )
      .upload(
        fileName,
        file,
        {
          upsert:false
        }
      );


  if(error){

    throw new Error(
      "Product image upload failed: " +
      error.message
    );

  }


  /*
    IMPORTANT:

    Original seller image is PRIVATE.

    No public URL is generated.

    Only storage path is returned.
  */

  return fileName;

}


/* =========================
   UPLOAD INVOICE
========================= */

async function uploadInvoice(
  file,
  userId
){

  const extension =
    file.name
      .split(".")
      .pop()
      .toLowerCase();


  const fileName =
    userId +
    "/invoice_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .substring(2) +
    "." +
    extension;


  const {
    error
  } =
    await db
      .storage
      .from("seller-kyc")
      .upload(
        fileName,
        file,
        {
          upsert:false
        }
      );


  if(error){

    throw new Error(
      "Invoice upload failed: " +
      error.message
    );

  }


  return fileName;

}


/* =========================
   SUBMIT PRODUCT
========================= */

async function submitProduct(){

  const button =
    document.getElementById(
      "submitButton"
    );


  try{

    button.disabled =
      true;


    showMessage(
      "⏳ Product information check हो रही है...",
      "info"
    );


    /* AUTH */

    const {
      data:authData,
      error:authError
    } =
      await db.auth.getUser();


    if(authError){

      throw new Error(
        authError.message
      );

    }


    const user =
      authData.user;


    if(!user){

      throw new Error(
        "Seller login नहीं है। पहले login करें।"
      );

    }


    /* FORM DATA */

    const productName =
      document
        .getElementById(
          "productName"
        )
        .value
        .trim();


    const brand =
      document
        .getElementById(
          "brand"
        )
        .value
        .trim();


    const category =
      document
        .getElementById(
          "category"
        )
        .value
        .trim();


    const productType =
      document
        .getElementById(
          "productType"
        )
        .value
        .trim();


    const mrp =
      document
        .getElementById(
          "mrp"
        )
        .value;


    const price =
      document
        .getElementById(
          "price"
        )
        .value;


    const stock =
      document
        .getElementById(
          "stock"
        )
        .value;


    const description =
      document
        .getElementById(
          "description"
        )
        .value
        .trim();


    const serialNumber =
      document
        .getElementById(
          "serialNumber"
        )
        .value
        .trim();


    const productImage =
      document
        .getElementById(
          "productImage"
        )
        .files[0];


    const invoiceFile =
      document
        .getElementById(
          "invoice"
        )
        .files[0];


    /* REQUIRED CHECK */

    if(!productName){

      throw new Error(
        "Product Name डालें।"
      );

    }


    if(!brand){

      throw new Error(
        "Brand डालें।"
      );

    }


    if(!category){

      throw new Error(
        "Category select करें।"
      );

    }


    if(!productType){

      throw new Error(
        "Product Type डालें।"
      );

    }


    if(
      !mrp ||
      Number(mrp) <= 0
    ){

      throw new Error(
        "Real MRP डालें।"
      );

    }


    if(
      !price ||
      Number(price) < 0
    ){

      throw new Error(
        "Valid selling price डालें।"
      );

    }


    if(
      Number(price) >
      Number(mrp)
    ){

      throw new Error(
        "Selling Price MRP से ज्यादा नहीं हो सकती।"
      );

    }


    if(
      stock === "" ||
      Number(stock) < 0
    ){

      throw new Error(
        "Valid stock डालें।"
      );

    }


    if(!description){

      throw new Error(
        "Product description डालें।"
      );

    }


    if(!productImage){

      throw new Error(
        "Product image select करें।"
      );

    }


    validateProductImage(
      productImage
    );


    if(invoiceFile){

      validateInvoice(
        invoiceFile
      );

    }


    /* SELLER CHECK */

    showMessage(
      "⏳ Seller account verify हो रहा है...",
      "info"
    );


    const {
      data:seller,
      error:sellerError
    } =
      await db
        .from("sellers")
        .select(`
          id,
          user_id,
          status,
          is_active,
          business_name,
          owner_name
        `)
        .eq(
          "user_id",
          user.id
        )
        .maybeSingle();


    if(sellerError){

      throw new Error(
        sellerError.message
      );

    }


    if(!seller){

      throw new Error(
        "Seller profile नहीं मिला।"
      );

    }


    if(
      seller.status !== "approved" ||
      seller.is_active !== true
    ){

      throw new Error(
        "आपका Seller account अभी approved/active नहीं है।"
      );

    }


    /* PRODUCT IMAGE */

    button.innerText =
      "⏳ Uploading Original Image...";


    showMessage(
      "⏳ Original product image private storage में upload हो रही है...",
      "info"
    );


    const originalImagePath =
      await uploadProductImage(
        productImage,
        user.id
      );


    /* INVOICE */

    let invoicePath =
      null;


    if(invoiceFile){

      button.innerText =
        "⏳ Uploading Invoice...";


      showMessage(
        "⏳ Original invoice securely upload हो रहा है...",
        "info"
      );


      invoicePath =
        await uploadInvoice(
          invoiceFile,
          user.id
        );

    }


    /* INSERT */

    button.innerText =
      "⏳ Product Submit हो रहा है...";


    showMessage(
      "⏳ Product Admin Verification में भेजा जा रहा है...",
      "info"
    );


    const {
      data:productData,
      error:productError
    } =
      await db
        .from("products")
        .insert({

          seller_id:
            seller.id,

          product_name:
            productName,

          brand:
            brand,

          category:
            category,

          product_type:
            productType,

          description:
            description,

          /*
            REAL MRP
          */

          mrp:
            Number(mrp),

          /*
            SELLING PRICE
          */

          price:
            Number(price),

          stock:
            Number(stock),

          /*
            New original image is
            private.

            image_url stays null
            until Admin AI image
            is generated.
          */

          image_url:
            null,

          original_image_path:
            originalImagePath,

          /*
            AI image initially null
          */

          ai_image_url:
            null,

          seller_name:
            seller.business_name ||
            seller.owner_name ||
            "",

          status:
            "pending",

          invoice_document_url:
            invoicePath,

          serial_number:
            serialNumber ||
            null

        })
        .select()
        .single();


    if(productError){

      throw new Error(
        productError.message
      );

    }


    /* SUCCESS */

    showMessage(
      "✅ Product successfully Admin Verification में भेज दिया गया है।",
      "success"
    );


    button.innerText =
      "✅ Product Submitted";


    /* CLEAR FORM */

    document
      .getElementById(
        "productName"
      )
      .value = "";


    document
      .getElementById(
        "brand"
      )
      .value = "";


    document
      .getElementById(
        "category"
      )
      .value = "";


    document
