<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout | BR Digital Marketplace</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,sans-serif;
      background:#f5f6f7;
      color:#202124;
      padding-bottom:30px;
    }

    .header{
      position:sticky;
      top:0;
      z-index:1000;
      background:#fff;
      padding:14px 15px;
      box-shadow:0 2px 10px rgba(0,0,0,.08);
    }

    .top{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .back{
      width:42px;
      height:42px;
      border:0;
      border-radius:12px;
      background:#f1f3f4;
      font-size:22px;
    }

    .brand{
      flex:1;
    }

    .brand h1{
      font-size:18px;
      color:#087f45;
      font-weight:900;
    }

    .brand p{
      font-size:11px;
      color:#777;
      margin-top:3px;
    }

    .container{
      max-width:750px;
      margin:auto;
      padding:15px;
    }

    .section{
      background:#fff;
      border-radius:17px;
      padding:17px;
      margin-bottom:13px;
      box-shadow:0 2px 9px rgba(0,0,0,.06);
    }

    .section h2{
      font-size:18px;
      margin-bottom:14px;
    }

    /* ADDRESS */

    .address-card{
      border:2px solid #087f45;
      border-radius:13px;
      padding:14px;
      background:#f8fffb;
    }

    .address-name{
      font-weight:900;
      font-size:15px;
    }

    .address-phone{
      font-size:12px;
      color:#555;
      margin-top:4px;
    }

    .address-text{
      font-size:13px;
      line-height:1.5;
      margin-top:8px;
    }

    .change-btn{
      border:0;
      background:transparent;
      color:#087f45;
      font-weight:900;
      margin-top:9px;
      cursor:pointer;
    }

    .no-address{
      text-align:center;
      padding:15px;
      background:#fff7e8;
      border-radius:12px;
      color:#666;
      font-size:13px;
    }

    .address-form{
      display:none;
      margin-top:14px;
    }

    .field{
      margin-bottom:11px;
    }

    .field label{
      display:block;
      font-size:12px;
      font-weight:800;
      margin-bottom:5px;
    }

    .field input,
    .field textarea{
      width:100%;
      border:1px solid #ddd;
      border-radius:10px;
      padding:11px;
      outline:none;
      font-size:14px;
    }

    .field textarea{
      min-height:75px;
    }

    .location-btn{
      width:100%;
      height:43px;
      border:0;
      border-radius:10px;
      background:#1769aa;
      color:#fff;
      font-weight:900;
      margin-bottom:12px;
    }

    .save-address-btn{
  width:100%;
  height:50px;
  border:0;
  border-radius:13px;
  background:#087f45;
  color:#fff;
  font-size:16px;
  font-weight:900;
  cursor:pointer;
  margin-top:4px;
  box-shadow:0 4px 12px rgba(8,127,69,.18);
}

.save-address-btn:active{
  transform:scale(.98);
}

    /* PRODUCTS */

    .item{
      display:flex;
      gap:12px;
      padding:11px 0;
      border-bottom:1px solid #eee;
    }

    .item:last-child{
      border-bottom:0;
    }

    .item img,
    .item-image{
      width:65px;
      height:65px;
      border-radius:10px;
      object-fit:cover;
      background:#f1f3f4;
      flex-shrink:0;
    }

    .item-info{
      flex:1;
    }

    .item-name{
      font-size:13px;
      font-weight:800;
      line-height:1.35;
    }

    .item-qty{
      font-size:11px;
      color:#777;
      margin-top:5px;
    }

    .item-price{
      font-weight:900;
      font-size:14px;
      margin-top:5px;
    }

    /* PAYMENT */

    .payment-option{
      display:flex;
      align-items:center;
      gap:11px;
      border:2px solid #087f45;
      border-radius:12px;
      padding:13px;
      background:#f8fffb;
    }

    .payment-option input{
      width:18px;
      height:18px;
    }

    .payment-option strong{
      font-size:14px;
    }

    .payment-option span{
      display:block;
      color:#777;
      font-size:11px;
      margin-top:3px;
    }

    /* SUMMARY */

    .summary-row{
      display:flex;
      justify-content:space-between;
      margin:10px 0;
      font-size:13px;
    }

    .summary-row.total{
      border-top:1px solid #eee;
      padding-top:13px;
      font-size:18px;
      font-weight:900;
    }

    .place-order{
      width:100%;
      height:50px;
      border:0;
      border-radius:13px;
      background:#087f45;
      color:#fff;
      font-size:16px;
      font-weight:900;
      cursor:pointer;
    }

    .place-order:disabled{
      background:#999;
    }

    .loading{
      text-align:center;
      padding:35px;
      color:#777;
    }

    .error{
      background:#fff0f0;
      color:#d93025;
      padding:13px;
      border-radius:10px;
      font-size:13px;
      margin-bottom:12px;
      display:none;
    }

    .success{
      text-align:center;
      padding:35px 15px;
      background:#fff;
      border-radius:17px;
    }

    .success-icon{
      font-size:55px;
    }

    .success h2{
      margin:12px 0 7px;
      color:#087f45;
    }

    .success p{
      color:#666;
      font-size:13px;
      line-height:1.5;
    }

    .success button{
      margin-top:18px;
      width:100%;
      height:45px;
      border:0;
      border-radius:11px;
      background:#087f45;
      color:#fff;
      font-weight:900;
    }

    @media(max-width:500px){
      .container{
        padding:10px;
      }

      .section{
        padding:14px;
      }
    }
  </style>
</head>

<body>

<header class="header">

  <div class="top">

    <button class="back" onclick="goCart()">←</button>

    <div class="brand">
      <h1>BR Digital Marketplace</h1>
      <p>Secure Checkout</p>
    </div>

  </div>

</header>


<main class="container" id="checkoutContainer">

  <div id="errorBox" class="error"></div>


  <!-- ADDRESS -->

  <section class="section">

    <h2>📍 Delivery Address</h2>

    <div id="addressArea">

      <div class="loading">
        ⏳ Address loading...
      </div>

    </div>

  </section>


  <!-- ORDER ITEMS -->

  <section class="section">

    <h2>🛒 Your Order</h2>

    <div id="cartItems">
      <div class="loading">
        ⏳ Cart loading...
      </div>
    </div>

  </section>


  <!-- PAYMENT -->

  <section class="section">

    <h2>💳 Payment Method</h2>

    <label class="payment-option">

      <input
        type="radio"
        name="payment"
        value="cod"
        checked>

      <div>
        <strong>💵 Cash on Delivery</strong>
        <span>Pay when your order is delivered</span>
      </div>

    </label>

  </section>


  <!-- SUMMARY -->

  <section class="section">

    <h2>🧾 Order Summary</h2>

    <div class="summary-row">
      <span>Subtotal</span>
      <strong id="subtotal">₹0</strong>
    </div>

    <div class="summary-row">
      <span>Delivery Fee</span>
      <strong id="deliveryFee">₹0</strong>
    </div>

    <div class="summary-row total">
      <span>Total</span>
      <strong id="total">₹0</strong>
    </div>

    <br>

    <button
  id="placeOrderBtn"
  class="place-order"
  onclick="placeOrder()"
  disabled>

  📍 पहले Delivery Address जोड़ें

    </button>

  </section>

</main>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://uryjmibcdfjfxoljrigt.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_uYbJw0ARCCkCpQ9QB6FxaQ_JrIxtOOp";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let currentUser = null;
  let cart = [];
  let selectedAddress = null;


  /* =========================
     START
  ========================= */

  async function startCheckout(){

    const {
      data:{user}
    } = await supabaseClient.auth.getUser();


    if(!user){

      showError(
        "कृपया पहले Customer Login करें।"
      );

      return;
    }


    currentUser = user;


    loadCart();

    await loadAddress();

  }


  /* =========================
     CART
  ========================= */

  function loadCart(){

    try{

      cart =
        JSON.parse(
          localStorage.getItem(
            "br_cart"
          ) || "[]"
        );

    }catch(e){

      cart=[];

    }


    cart =
      Array.isArray(cart)
      ? cart
      : [];


    renderCart();

  }


  function renderCart(){

    const box =
      document.getElementById(
        "cartItems"
      );


    if(!cart.length){

      box.innerHTML = `
        <div class="no-address">
          🛒 आपका Cart खाली है।
        </div>
      `;

      document.getElementById(
        "placeOrderBtn"
      ).disabled = true;

      return;
    }


    let subtotal = 0;


    box.innerHTML =
      cart.map(item => {

        const quantity =
          Number(item.quantity || 1);

        const price =
          Number(item.price || 0);

        const lineTotal =
          price * quantity;

        subtotal += lineTotal;


        return `

          <div class="item">

            ${
              item.image_url
              ?
              `<img
                src="${escapeHtml(item.image_url)}"
                class="item-image"
                alt="Product">`
              :
              `<div class="item-image"></div>`
            }

            <div class="item-info">

              <div class="item-name">
                ${escapeHtml(item.product_name || "Product")}
              </div>

              <div class="item-qty">
                Quantity: ${quantity}
              </div>

              <div class="item-price">
                ₹${formatPrice(lineTotal)}
              </div>

            </div>

          </div>

        `;

      }).join("");


    document.getElementById(
      "subtotal"
    ).innerText =
      "₹" + formatPrice(subtotal);


    /*
      अभी delivery fee ₹0 रखी गई है।
      बाद में Bihar/local delivery rules
      के अनुसार dynamic fee जोड़ सकते हैं।
    */

    const deliveryFee = 0;

    document.getElementById(
      "deliveryFee"
    ).innerText =
      "₹" + formatPrice(deliveryFee);


    document.getElementById(
      "total"
    ).innerText =
      "₹" + formatPrice(
        subtotal + deliveryFee
      );

  }


  /* =========================
     ADDRESS
  ========================= */

  async function loadAddress(){

    const box =
      document.getElementById(
        "addressArea"
      );


    const {data,error} =
      await supabaseClient
      .from("customer_addresses")
      .select(`
        id,
        full_name,
        phone,
        address,
        city,
        state,
        pincode,
        latitude,
        longitude,
        is_default
      `)
      .eq(
        "customer_id",
        currentUser.id
      )
      .order(
        "is_default",
        {ascending:false}
      )
      .order(
        "created_at",
        {ascending:false}
      );


    if(error){

      console.error(error);

      box.innerHTML = `
        <div class="no-address">
          ❌ Address load नहीं हो पाया।
        </div>
      `;

      return;
    }


    if(!data || !data.length){

      box.innerHTML = `

        <div class="no-address">

          📍 अभी कोई delivery address saved नहीं है।

          <br><br>

          <button
            class="change-btn"
            onclick="showAddressForm()">

            + Add Delivery Address

          </button>

        </div>

        <div id="addressForm"
             class="address-form">

          ${addressFormHtml()}

        </div>

      `;

      return;
    }


    selectedAddress =
  data[0];

renderSelectedAddress();

const placeBtn =
  document.getElementById("placeOrderBtn");

placeBtn.disabled = false;
placeBtn.innerText = "🛍️ Place Order";

  }


  function renderSelectedAddress(){

    const box =
      document.getElementById(
        "addressArea"
      );


    box.innerHTML = `

      <div class="address-card">

        <div class="address-name">
          ${escapeHtml(selectedAddress.full_name)}
        </div>

        <div class="address-phone">
          📱 ${escapeHtml(selectedAddress.phone)}
        </div>

        <div class="address-text">

          ${escapeHtml(selectedAddress.address)}<br>

          ${escapeHtml(selectedAddress.city)},
          ${escapeHtml(selectedAddress.state)}
          - ${escapeHtml(selectedAddress.pincode)}

        </div>

        ${
          selectedAddress.latitude &&
          selectedAddress.longitude
          ?
          `<div style="font-size:10px;color:#777;margin-top:7px;">
            📍 GPS Location saved
          </div>`
          :
          ""
        }

        <button
          class="change-btn"
          onclick="showAddressForm()">

          Change / Add Address

        </button>

      </div>

      <div id="addressForm"
           class="address-form">

        ${addressFormHtml()}

      </div>

    `;

  }


  function addressFormHtml(){

    return `

      <button
        type="button"
        class="location-btn"
        onclick="getCurrentLocation()">

        📍 Use Current Location

      </button>

      <div class="field">
        <label>Full Name *</label>
        <input
          id="addressName"
          value="${escapeHtml(
            selectedAddress?.full_name || ""
          )}"
          placeholder="Customer name">
      </div>

      <div class="field">
        <label>Mobile Number *</label>
        <input
          id="addressPhone"
          type="tel"
          value="${escapeHtml(
            selectedAddress?.phone || ""
          )}"
          placeholder="Mobile number">
      </div>

      <div class="field">
        <label>House / Street / Village *</label>
        <textarea
          id="addressText"
          placeholder="Complete delivery address">${escapeHtml(
            selectedAddress?.address || ""
          )}</textarea>
      </div>

      <div class="field">
        <label>City *</label>
        <input
          id="addressCity"
          value="${escapeHtml(
            selectedAddress?.city || ""
          )}">
      </div>

      <div class="field">
        <label>State *</label>
        <input
          id="addressState"
          value="${escapeHtml(
            selectedAddress?.state || ""
          )}">
      </div>

      <div class="field">
        <label>PIN Code *</label>
        <input
          id="addressPincode"
          type="number"
          value="${escapeHtml(
            selectedAddress?.pincode || ""
          )}">
      </div>

      <input
        type="hidden"
        id="latitude"
        value="${selectedAddress?.latitude || ""}">

      <input
        type="hidden"
        id="longitude"
        value="${selectedAddress?.longitude || ""}">

      <button
  type="button"
  class="save-address-btn"
  onclick="saveAddress()">

  💾 Save Delivery Address

</button>

    `;

  }


  function showAddressForm(){

    const form =
      document.getElementById(
        "addressForm"
      );

    if(form){

      form.style.display = "block";

      form.scrollIntoView({
        behavior:"smooth",
        block:"center"
      });

    }

  }


  /* =========================
     GPS
  ========================= */

  function getCurrentLocation(){

    if(!navigator.geolocation){

      alert(
        "इस device में GPS उपलब्ध नहीं है।"
      );

      return;
    }


    navigator.geolocation.getCurrentPosition(

      async position => {

        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;


        document.getElementById(
          "latitude"
        ).value = lat;

        document.getElementById(
          "longitude"
        ).value = lng;


        try{

          const response =
            await fetch(
              `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`
            );

          const data =
            await response.json();


          const city =
            data.city ||
            data.locality ||
            "";

          const state =
            data.principalSubdivision ||
            "";

          const pincode =
            data.postcode ||
            "";


          if(city)
            document.getElementById(
              "addressCity"
            ).value = city;


          if(state)
            document.getElementById(
              "addressState"
            ).value = state;


          if(pincode)
            document.getElementById(
              "addressPincode"
            ).value = pincode;


          alert(
            "✅ Current location प्राप्त हो गई।"
          );


        }catch(error){

          console.error(error);

          alert(
            "GPS मिल गया है। Address fields manually भरें।"
          );

        }

      },

      error => {

        console.error(error);

        alert(
          "📍 Location permission Allow करें और फिर दोबारा कोशिश करें।"
        );

      },

      {
        enableHighAccuracy:true,
        timeout:15000,
        maximumAge:0
      }

    );

  }


  /* =========================
     SAVE ADDRESS
  ========================= */

  async function saveAddress(){

    if(!currentUser){
      alert("Customer login required.");
      return;
    }


    const full_name =
      document.getElementById(
        "addressName"
      ).value.trim();

    const phone =
      document.getElementById(
        "addressPhone"
      ).value.trim();

    const address =
      document.getElementById(
        "addressText"
      ).value.trim();

    const city =
      document.getElementById(
        "addressCity"
      ).value.trim();

    const state =
      document.getElementById(
        "addressState"
      ).value.trim();

    const pincode =
      document.getElementById(
        "addressPincode"
      ).value.trim();

    const latitude =
      document.getElementById(
        "latitude"
      ).value || null;

    const longitude =
      document.getElementById(
        "longitude"
      ).value || null;


    if(
      !full_name ||
      !phone ||
      !address ||
      !city ||
      !state ||
      !pincode
    ){

      alert(
        "कृपया सभी required address details भरें।"
      );

      return;
    }


    const {data,error} =
      await supabaseClient
      .from("customer_addresses")
      .insert({

        customer_id:
          currentUser.id,

        full_name,

        phone,

        address,

        city,

        state,

        pincode,

        latitude:
          latitude
          ? Number(latitude)
          : null,

        longitude:
          longitude
          ? Number(longitude)
          : null,

        is_default:true

      })
      .select()
      .single();


    if(error){

      console.error(error);

      alert(
        "❌ Address save नहीं हो पाया।"
      );

      return;
    }


    selectedAddress = data;

    alert(
      "✅ Delivery Address saved."
    );

    await loadAddress();

  }


  /* =========================
     PLACE ORDER
  ========================= */

  async function placeOrder(){

    if(!currentUser){

      alert(
        "कृपया Customer Login करें।"
      );

      return;
    }


    if(!cart.length){

      alert(
        "Cart खाली है।"
      );

      return;
    }


    if(!selectedAddress){

  alert(
    "📍 Order करने से पहले Delivery Address जोड़ना जरूरी है।"
  );

  showAddressForm();

  return;
    }


    const button =
      document.getElementById(
        "placeOrderBtn"
      );

    button.disabled = true;

    button.innerText =
      "⏳ Order Processing...";


    try{

      /*
        Cart को seller के अनुसार अलग किया जा रहा है।
        क्योंकि orders table में seller_id है।
      */

      const sellerGroups = {};


      for(const item of cart){

        const sellerId =
          item.seller_id;


       for(const item of cart){

  let sellerId = item.seller_id;


  /*
    अगर पुराने Cart item में seller_id नहीं है,
    तो Products table से real seller_id लिया जाएगा।
  */

  if(!sellerId){

    const {
      data:product,
      error:productError
    } =
    await supabaseClient
      .from("products")
      .select(`
        id,
        seller_id,
        status,
        stock
      `)
      .eq("id",item.id)
      .eq("status","approved")
      .maybeSingle();


    if(productError){

      console.error(productError);

      throw new Error(
        "Product seller information load नहीं हो पाई।"
      );

    }


    if(!product || !product.seller_id){

      throw new Error(
        "इस product का Seller नहीं मिला।"
      );

    }


    sellerId =
      product.seller_id;


    /*
      Cart में भी seller_id रख दें
      ताकि अगली बार दोबारा query न करनी पड़े।
    */

    item.seller_id =
      sellerId;

  }


  if(!sellerGroups[sellerId]){
    sellerGroups[sellerId] = [];
  }


  sellerGroups[sellerId].push(item);

       } 


      const createdOrders = [];


      for(
        const sellerId of Object.keys(
          sellerGroups
        )
      ){

        const sellerItems =
          sellerGroups[sellerId];


        let subtotal = 0;


        sellerItems.forEach(item => {

          subtotal +=
            Number(item.price || 0) *
            Number(item.quantity || 1);

        });


        const deliveryFee = 0;

        const total =
          subtotal + deliveryFee;


        /*
          Seller का actual business_id
          उपलब्ध नहीं होने पर null रखा गया है।
        */

        const {data:order,error:orderError} =
          await supabaseClient
          .from("orders")
          .insert({

            customer_id:
              currentUser.id,

            seller_id:
              sellerId,

            business_id:null,

            status:"pending",

            payment_method:"cod",

            payment_status:"pending",

            subtotal,

            delivery_fee:
              deliveryFee,

            discount:0,

            total_amount:
              total,

            shipping_name:
              selectedAddress.full_name,

            shipping_phone:
              selectedAddress.phone,

            shipping_address:
              selectedAddress.address,

            shipping_city:
              selectedAddress.city,

            shipping_state:
              selectedAddress.state,

            shipping_pincode:
              selectedAddress.pincode

          })
          .select()
          .single();


        if(orderError){

          throw orderError;

        }


        for(const item of sellerItems){

          const {error:itemError} =
            await supabaseClient
            .from("order_items")
            .insert({

              order_id:
                order.id,

              product_id:
                item.id,

              seller_id:
                sellerId,

              product_name:
                item.product_name,

              product_image_url:
                item.image_url || null,

              quantity:
                Number(item.quantity || 1),

              price:
                Number(item.price || 0)

            });


          if(itemError){

            throw itemError;

          }

        }


        createdOrders.push(order);

      }


      /*
        Order सफल होने के बाद Cart खाली।
      */

      localStorage.removeItem(
        "br_cart"
      );


      showSuccess(
        createdOrders
      );


    }catch(error){

      console.error(error);

      button.disabled = false;

      button.innerText =
        "🛍️ Place Order";


      showError(
        "❌ Order place नहीं हुआ: " +
        (error.message || "Unknown error")
      );

    }

  }


  /* =========================
     SUCCESS
  ========================= */

  function showSuccess(orders){

    document.getElementById(
      "checkoutContainer"
    ).innerHTML = `

      <div class="success">

        <div class="success-icon">
          ✅
        </div>

        <h2>
          Order Placed Successfully!
        </h2>

        <p>
          आपका order successfully place हो गया है।
        </p>

        <p style="margin-top:8px;">
          Order:
          ${orders.length}
          seller${orders.length > 1 ? "s" : ""}
        </p>

        <button onclick="openOrders()">
          📦 My Orders देखें
        </button>

      </div>

    `;

  }


  /* =========================
     HELPERS
  ========================= */

  function formatPrice(value){

    return Number(
      value || 0
    ).toLocaleString(
      "en-IN",
      {
        maximumFractionDigits:2
      }
    );

  }


  function escapeHtml(value){

    return String(
      value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

  }


  function showError(message){

    const box =
      document.getElementById(
        "errorBox"
      );

    box.innerText =
      message;

    box.style.display =
      "block";

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }


  function goCart(){

    window.location.href =
      "cart.html";

  }


  function openOrders(){

    window.location.href =
      "orders.html";

  }


  startCheckout();

</script>

</body>
</html>
