<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>My Cart | BR Digital Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f5f6f7;
  color:#202124;
  padding-bottom:30px;
}

button,
input,
select{
  font-family:inherit;
}

.header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#fff;
  padding:14px 15px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.top{
  display:flex;
  align-items:center;
  gap:12px;
}

.back{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:#f1f3f4;
  font-size:22px;
  cursor:pointer;
}

.brand{
  flex:1;
}

.brand h1{
  font-size:18px;
  color:#087f45;
  font-weight:900;
}

.brand p{
  font-size:11px;
  color:#777;
  margin-top:3px;
}

.container{
  max-width:800px;
  margin:auto;
  padding:15px;
}

.title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:14px;
}

.title h2{
  font-size:21px;
}

.title span{
  font-size:12px;
  color:#777;
}


/* =====================================================
   CART ITEM
===================================================== */

.cart-item{
  background:#fff;
  border-radius:16px;
  padding:13px;
  margin-bottom:10px;
  display:flex;
  gap:12px;
  box-shadow:0 2px 9px rgba(0,0,0,.06);
}

.product-image{
  width:90px;
  height:90px;
  border-radius:12px;
  object-fit:cover;
  background:#f1f3f4;
  flex-shrink:0;
  display:block;
}

.image-placeholder{
  width:90px;
  height:90px;
  border-radius:12px;
  background:#f1f3f4;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#777;
  font-size:11px;
  flex-shrink:0;
}

.item-info{
  flex:1;
  min-width:0;
}

.product-name{
  font-size:15px;
  font-weight:900;
  line-height:1.35;
}

.seller{
  color:#777;
  font-size:11px;
  margin-top:5px;
}


/* =====================================================
   PRICE
===================================================== */

.price-row{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
  margin-top:7px;
}

.price{
  font-size:17px;
  font-weight:900;
}

.discount-badge{
  display:inline-block;
  background:#ffe5e5;
  color:#d93025;
  padding:5px 8px;
  border-radius:7px;
  font-size:11px;
  font-weight:900;
}

.mrp{
  color:#777;
  font-size:11px;
  margin-top:3px;
}

.stock-info{
  color:#087f45;
  font-size:11px;
  margin-top:4px;
  font-weight:700;
}

.actions{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-top:10px;
}

.quantity{
  display:flex;
  align-items:center;
  border:1px solid #ddd;
  border-radius:9px;
  overflow:hidden;
}

.quantity button{
  width:32px;
  height:32px;
  border:0;
  background:#f1f3f4;
  font-size:18px;
  cursor:pointer;
}

.quantity span{
  width:35px;
  text-align:center;
  font-size:13px;
  font-weight:900;
}

.remove{
  border:0;
  background:#fff0f0;
  color:#d93025;
  border-radius:8px;
  padding:8px 10px;
  font-size:11px;
  font-weight:800;
  cursor:pointer;
}


/* =====================================================
   SUMMARY
===================================================== */

.summary{
  background:#fff;
  border-radius:17px;
  padding:17px;
  margin-top:15px;
  box-shadow:0 2px 9px rgba(0,0,0,.06);
}

.summary h2{
  font-size:18px;
  margin-bottom:13px;
}

.row{
  display:flex;
  justify-content:space-between;
  margin:10px 0;
  font-size:13px;
}

.discount-row strong{
  color:#087f45;
}

.total{
  border-top:1px solid #eee;
  padding-top:13px;
  font-size:19px;
  font-weight:900;
}

.checkout{
  width:100%;
  height:50px;
  border:0;
  border-radius:13px;
  background:#087f45;
  color:#fff;
  font-size:16px;
  font-weight:900;
  margin-top:12px;
  cursor:pointer;
}

.checkout:active{
  transform:scale(.99);
}


/* =====================================================
   EMPTY
===================================================== */

.empty{
  background:#fff;
  border-radius:18px;
  text-align:center;
  padding:55px 20px;
  box-shadow:0 2px 9px rgba(0,0,0,.06);
}

.empty-icon{
  font-size:55px;
  margin-bottom:12px;
}

.empty h2{
  font-size:20px;
  margin-bottom:7px;
}

.empty p{
  color:#777;
  font-size:13px;
}

.shop-btn{
  border:0;
  background:#087f45;
  color:#fff;
  height:44px;
  padding:0 25px;
  border-radius:11px;
  font-weight:900;
  margin-top:17px;
  cursor:pointer;
}


/* =====================================================
   LOADING
===================================================== */

.loading{
  background:#fff;
  border-radius:18px;
  text-align:center;
  padding:45px 20px;
  box-shadow:0 2px 9px rgba(0,0,0,.06);
}

.loading-icon{
  font-size:42px;
  margin-bottom:10px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:500px){

  .container{
    padding:11px 10px;
  }

  .cart-item{
    padding:10px;
  }

  .product-image,
  .image-placeholder{
    width:78px;
    height:78px;
  }

  .product-name{
    font-size:13px;
  }

  .price{
    font-size:15px;
  }

  .actions{
    align-items:flex-end;
  }

  .remove{
    padding:7px 8px;
  }

}

</style>

</head>


<body>


<!-- =====================================================
     HEADER
===================================================== -->

<header class="header">

  <div class="top">

    <button
      class="back"
      type="button"
      onclick="goBack()">

      ←

    </button>

    <div class="brand">

      <h1>
        BR Digital Marketplace
      </h1>

      <p>
        🛒 My Shopping Cart
      </p>

    </div>

  </div>

</header>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="container">

  <div class="title">

    <h2>
      🛒 My Cart
    </h2>

    <span id="itemCount">
      0 Items
    </span>

  </div>


  <div id="cartArea">

    <div class="loading">

      <div class="loading-icon">
        ⏳
      </div>

      <p>
        Cart load हो रहा है...
      </p>

    </div>

  </div>

</main>



<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://uryjmibcdfjfxoljrigt.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_uYbJw0ARCCkCpQ9QB6FxaQ_JrIxtOOp";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


/* =====================================================
   GLOBAL CART
===================================================== */

let cart = [];


/* =====================================================
   LOAD CART
===================================================== */

async function loadCart(){

  try{

    cart =
      JSON.parse(
        localStorage.getItem("br_cart") || "[]"
      );

  }catch(error){

    console.error(
      "Cart parse error:",
      error
    );

    cart = [];

  }


  if(!Array.isArray(cart)){

    cart = [];

  }


  await refreshCartProducts();

  renderCart();

}


/* =====================================================
   REFRESH PRODUCTS FROM SUPABASE
===================================================== */

async function refreshCartProducts(){

  if(!cart.length){

    return;

  }


  const productIds =
    cart
      .map(item => item.id)
      .filter(Boolean);


  if(!productIds.length){

    return;

  }


  const {
    data,
    error
  } =
  await supabaseClient
    .from("products")
    .select(`
      id,
      product_name,
      brand,
      category,
      product_type,
      price,
      mrp,
      stock,
      ai_image_url,
      seller_name,
      seller_id,
      status
    `)
    .in("id",productIds)
    .eq("status","approved");


  if(error){

    console.error(
      "Product refresh error:",
      error
    );

    return;

  }


  const productsMap =
    new Map(
      (data || []).map(
        product =>
          [String(product.id),product]
      )
    );


  /*
    केवल approved + AI image वाले
    products public Cart में रखेंगे.
  */

  cart =
    cart
      .map(item => {

        const product =
          productsMap.get(
            String(item.id)
          );


        if(!product){

          return null;

        }


        /*
          AI image mandatory.
        */

        if(!product.ai_image_url){

          return null;

        }


        const oldQuantity =
          Number(
            item.quantity || 1
          );


        let quantity =
          oldQuantity;


        const stock =
          Number(
            product.stock || 0
          );


        if(stock <= 0){

          return null;

        }


        if(quantity > stock){

          quantity = stock;

        }


        return {

          id:
            product.id,

          product_name:
            product.product_name,

          brand:
            product.brand,

          category:
            product.category,

          product_type:
            product.product_type,

          /*
            SELLING PRICE
          */

          price:
            Number(product.price || 0),

          /*
            REAL MRP
          */

          mrp:
            Number(product.mrp || 0),

          stock:
            stock,

          /*
            PUBLIC CART ONLY AI IMAGE
          */

          ai_image_url:
            product.ai_image_url,

          seller_name:
            product.seller_name || "",

          seller_id:
            product.seller_id || "",

          quantity:
            quantity

        };

      })
      .filter(Boolean);


  saveCart();

}


/* =====================================================
   RENDER CART
===================================================== */

function renderCart(){

  const area =
    document.getElementById(
      "cartArea"
    );


  const count =
    cart.reduce(
      (total,item) =>
        total +
        Number(
          item.quantity || 1
        ),
      0
    );


  document.getElementById(
    "itemCount"
  ).innerText =
    count +
    (
      count === 1
      ? " Item"
      : " Items"
    );


  if(!cart.length){

    area.innerHTML = `

      <div class="empty">

        <div class="empty-icon">
          🛒
        </div>

        <h2>
          Your Cart is Empty
        </h2>

        <p>
          अभी आपके cart में कोई product नहीं है।
        </p>

        <button
          class="shop-btn"
          type="button"
          onclick="openMarket()">

          🏪 Continue Shopping

        </button>

      </div>

    `;

    return;

  }


  let subtotal = 0;

  let mrpTotal = 0;


  const itemsHTML =
    cart.map(
      (item,index) => {

        const quantity =
          Number(
            item.quantity || 1
          );


        const price =
          Number(
            item.price || 0
          );


        const mrp =
          Number(
            item.mrp || 0
          );


        const lineTotal =
          quantity * price;


        subtotal +=
          lineTotal;


        /*
          MRP total only when real MRP
          is greater than selling price.
        */

        if(mrp > price){

          mrpTotal +=
            quantity * mrp;

        }else{

          mrpTotal +=
            lineTotal;

        }


        let discountPercent = 0;


        /*
          Automatic discount calculation
        */

        if(
          mrp > 0 &&
          mrp > price
        ){

          discountPercent =
            Math.round(
              ((mrp - price) / mrp) * 100
            );

        }


        const stock =
          Number(
            item.stock || 0
          );


        return `

          <div class="cart-item">


            <!-- AI IMAGE ONLY -->

            ${
              item.ai_image_url

              ?

              `

                <img
                  class="product-image"
                  src="${escapeHtml(item.ai_image_url)}"
                  alt="${escapeHtml(item.product_name || 'Product')}"
                  onerror="this.style.display='none'"
                >

              `

              :

              `

                <div class="image-placeholder">

                  AI Image
                  <br>
                  unavailable

                </div>

              `

            }


            <div class="item-info">


              <div class="product-name">

                ${escapeHtml(
                  item.product_name ||
                  "Product"
                )}

              </div>


              ${
                item.seller_name

                ?

                `

                  <div class="seller">

                    🏪 Seller:
                    ${escapeHtml(
                      item.seller_name
                    )}

                  </div>

                `

                :

                ""

              }


              <!-- PRICE + DISCOUNT -->

              <div class="price-row">

                <div class="price">

                  ₹${formatPrice(price)}

                </div>


                ${
                  discountPercent > 0

                  ?

                  `

                    <span class="discount-badge">

                      ${discountPercent}% OFF

                    </span>

                  `

                  :

                  ""

                }

              </div>


              ${
                mrp > price

                ?

                `

                  <div class="mrp">

                    MRP:
                    <s>₹${formatPrice(mrp)}</s>

                  </div>

                `

                :

                ""

              }


              <div class="stock-info">

                ${
                  stock > 0
                  ?
                  `📦 Stock: ${stock}`
                  :
                  `❌ Out of stock`
                }

              </div>


              <div class="actions">


                <!-- QUANTITY -->

                <div class="quantity">

                  <button
                    type="button"
                    onclick="changeQuantity(${index},-1)">

                    −

                  </button>


                  <span>

                    ${quantity}

                  </span>


                  <button
                    type="button"
                    onclick="changeQuantity(${index},1)">

                    +

                  </button>

                </div>


                <!-- REMOVE -->

                <button
                  class="remove"
                  type="button"
                  onclick="removeItem(${index})">

                  🗑 Remove

                </button>


              </div>


            </div>


          </div>

        `;

      }
    )
    .join("");


  const deliveryFee = 0;


  const total =
    subtotal +
    deliveryFee;


  const totalSavings =
    Math.max(
      0,
      mrpTotal - subtotal
    );


  area.innerHTML = `

    ${itemsHTML}


    <!-- =================================================
         PRICE SUMMARY
    ================================================== -->

    <section class="summary">


      <h2>
        🧾 Price Details
      </h2>


      <div class="row">

        <span>
          MRP Total
        </span>

        <strong>

          ₹${formatPrice(mrpTotal)}

        </strong>

      </div>


      ${
        totalSavings > 0

        ?

        `

          <div class="row discount-row">

            <span>
              You Save
            </span>

            <strong>

              ₹${formatPrice(totalSavings)}

            </strong>

          </div>

        `

        :

        ""

      }


      <div class="row">

        <span>
          Selling Price
        </span>

        <strong>
          ₹${formatPrice(subtotal)}
        </strong>

      </div>


      <div class="row">

        <span>
          Delivery Fee
        </span>

        <strong>
          ₹${formatPrice(deliveryFee)}
        </strong>

      </div>


      <div class="row total">

        <span>
          Total Amount
        </span>

        <strong>
          ₹${formatPrice(total)}
        </strong>

      </div>


      <button
        class="checkout"
        type="button"
        onclick="goCheckout()">

        Proceed to Checkout →

      </button>


    </section>

  `;

}


/* =====================================================
   QUANTITY
===================================================== */

function changeQuantity(
  index,
  change
){

  const item =
    cart[index];


  if(!item)
    return;


  let quantity =
    Number(
      item.quantity || 1
    );


  const stock =
    Number(
      item.stock || 0
    );


  quantity +=
    change;


  if(quantity <= 0){

    removeItem(index);

    return;

  }


  if(
    stock > 0 &&
    quantity > stock
  ){

    alert(
      `इस product का केवल ${stock} stock available है।`
    );

    return;

  }


  cart[index].quantity =
    quantity;


  saveCart();

  renderCart();

}


/* =====================================================
   REMOVE
===================================================== */

function removeItem(index){

  if(!cart[index])
    return;


  const productName =
    cart[index].product_name ||
    "Product";


  const confirmRemove =
    confirm(
      `"${productName}" को Cart से हटाना चाहते हैं?`
    );


  if(!confirmRemove)
    return;


  cart.splice(
    index,
    1
  );


  saveCart();

  renderCart();

}


/* =====================================================
   SAVE CART
===================================================== */

function saveCart(){

  localStorage.setItem(
    "br_cart",
    JSON.stringify(cart)
  );

}


/* =====================================================
   CHECKOUT
===================================================== */

function goCheckout(){

  if(!cart.length){

    alert(
      "🛒 आपका Cart खाली है।"
    );

    return;

  }


  const invalid =
    cart.some(
      item =>
        !item.ai_image_url
    );


  if(invalid){

    alert(
      "⚠️ Cart में कुछ product की AI image उपलब्ध नहीं है। कृपया Market से product दोबारा चुनें।"
    );

    return;

  }


  window.location.href =
    "checkout.html";

}


/* =====================================================
   MARKET
===================================================== */

function openMarket(){

  window.location.href =
    "market.html";

}


/* =====================================================
   BACK
===================================================== */

function goBack(){

  if(
    document.referrer &&
    document.referrer.includes(
      window.location.hostname
    )
  ){

    history.back();

  }else{

    window.location.href =
      "market.html";

  }

}


/* =====================================================
   FORMAT PRICE
===================================================== */

function formatPrice(value){

  return Number(
    value || 0
  ).toLocaleString(
    "en-IN",
    {
      maximumFractionDigits:2
    }
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


/* =====================================================
   START
===================================================== */

loadCart();

</script>


</body>
</html>
