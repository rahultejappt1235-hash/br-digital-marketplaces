<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Dashboard - BR Digital Marketplace</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#17202a}.top{background:#fff;box-shadow:0 2px 10px #0001;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:800}.logo{background:#ff7a00;color:#fff;border-radius:12px;padding:10px}.actions{display:flex;gap:8px}.actions button,.tab{border:0;border-radius:9px;padding:10px 13px;font-weight:700;cursor:pointer}.logout{background:#17202a;color:#fff}.main{max-width:1200px;margin:25px auto;padding:0 18px}.welcome{margin-bottom:20px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.stat,.panel{background:#fff;border-radius:16px;box-shadow:0 3px 15px #0000000d}.stat{padding:20px}.stat b{font-size:28px}.muted{color:#667085}.tabs{display:flex;gap:8px;margin:20px 0;overflow:auto}.tab{background:#fff;border:1px solid #ddd;white-space:nowrap}.tab.active{background:#ff7a00;color:#fff;border-color:#ff7a00}.panel{padding:18px;overflow:auto}.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;margin-bottom:15px}.table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:11px;border-bottom:1px solid #eee;text-align:left}.thumb{width:55px;height:45px;object-fit:cover;border-radius:8px}.danger{background:#fee2e2;color:#991b1b;border:0;border-radius:7px;padding:7px 9px;font-weight:700}.small{background:#eef2ff;color:#3730a3;border:0;border-radius:7px;padding:7px 9px;font-weight:700}.notice{padding:12px;border-radius:10px;margin-bottom:15px;background:#fff7ed;border:1px solid #fed7aa}.hidden{display:none!important}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.stats{grid-template-columns:1fr 1fr}.top{align-items:flex-start}.actions{flex-direction:column}.stat b{font-size:22px}}
</style></head><body>
<header class="top"><div class="brand"><span class="logo">BR</span><span>Admin Dashboard</span></div><div class="actions"><button onclick="location.href='index.html'">🛍️ Shop</button><button class="logout" onclick="logout()">Logout</button></div></header>
<main class="main"><div class="welcome"><h1>👋 Main Admin</h1><p id="adminName" class="muted">Checking access...</p></div><div id="notice" class="notice hidden"></div>
<section class="stats"><div class="stat"><div class="muted">Products</div><b id="productCount">0</b></div><div class="stat"><div class="muted">Sellers</div><b id="sellerCount">0</b></div><div class="stat"><div class="muted">Active Users</div><b id="userCount">0</b></div><div class="stat"><div class="muted">Low Stock</div><b id="lowStock">0</b></div></section>
<div class="tabs"><button class="tab active" onclick="showTab('products',this)">📦 Products</button><button class="tab" onclick="showTab('sellers',this)">👨‍💼 Sellers</button><button class="tab" onclick="showTab('users',this)">👥 Users</button><button class="tab" onclick="showTab('info',this)">📦 Orders</button></div>
<section id="products" class="panel"><h2>Product Management</h2><input class="search" id="productSearch" oninput="renderProducts()" placeholder="🔎 Product search..."><div id="productTable"></div></section>
<section id="sellers" class="panel hidden"><h2>Seller Management</h2><div id="sellerTable"></div></section>
<section id="users" class="panel hidden"><h2>User Management</h2><div id="userTable"></div></section>
<section id="info" class="panel hidden">
<h2>📦 Order Management</h2>
<div id="orderNotice" class="notice hidden"></div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
<button class="small" onclick="loadOrders()">🔄 Refresh Orders</button>
<select id="orderStatusFilter" onchange="renderOrders()" style="padding:10px;border:1px solid #ddd;border-radius:9px">
<option value="">All Status</option><option value="pending">Pending</option><option value="confirmed">Confirmed</option><option value="shipped">Shipped</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option>
</select>
</div>
<input class="search" id="orderSearch" oninput="renderOrders()" placeholder="🔎 Order ID / customer / seller search...">
<div id="orderTable"><p class="muted">Orders load karne ke liye Orders tab open karein.</p></div>
</section>
</main>
<script>
const SUPABASE_URL="https://uryjmibcdfjfxolrijgt.supabase.co";const SUPABASE_PUBLISHABLE_KEY="sb_publishable_uYbJw0ARCCkCpQ9QB6FxaQ_JrIxtOOp";const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);let products=[],profiles=[],orders=[];
function showTab(id,btn){document.querySelectorAll('.panel').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function notice(t){const n=document.getElementById('notice');n.textContent=t;n.classList.remove('hidden')}
async function guard(){const {data:{user},error}=await supabaseClient.auth.getUser();if(error||!user){location.href='admin-login.html';return null}const {data:profile,error:pe}=await supabaseClient.from('profiles').select('id,full_name,role,is_active').eq('id',user.id).maybeSingle();if(pe||!profile||profile.role!=='main_admin'||profile.is_active!==true){await supabaseClient.auth.signOut();location.href='admin-login.html';return null}document.getElementById('adminName').textContent=(profile.full_name||user.email)+' • main_admin';return user}
async function load(){const user=await guard();if(!user)return;const [pr,pu]=await Promise.all([supabaseClient.from('products').select('*').order('id',{ascending:false}),supabaseClient.from('profiles').select('id,full_name,phone,role,is_active,created_at').order('created_at',{ascending:false})]);if(pr.error){notice('⚠️ Products load nahi hue: '+pr.error.message)}else products=pr.data||[];if(pu.error){notice('⚠️ Profiles load nahi hue. Supabase RLS policy check karein: '+pu.error.message)}else profiles=pu.data||[];updateStats();renderProducts();renderProfiles();await loadSellers();await loadOrders()}
function updateStats(){document.getElementById('productCount').textContent=products.length;document.getElementById('sellerCount').textContent=profiles.filter(x=>x.role==='seller').length;document.getElementById('userCount').textContent=profiles.filter(x=>x.is_active===true).length;document.getElementById('lowStock').textContent=products.filter(x=>Number(x.stock||0)<=5).length}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function renderProducts(){const q=(document.getElementById('productSearch')?.value||'').toLowerCase();const list=products.filter(p=>String(p.product_name||'').toLowerCase().includes(q));if(!list.length){document.getElementById('productTable').innerHTML='<p class="muted">No products found.</p>';return}document.getElementById('productTable').innerHTML='<table class="table"><thead><tr><th>Image</th><th>Product</th><th>Price</th><th>Stock</th><th>Category</th><th>Action</th></tr></thead><tbody>'+list.map(p=>`<tr><td><img class="thumb" src="${esc(p.image_url)}" onerror="this.style.display='none'"></td><td>${esc(p.product_name)}</td><td>₹${Number(p.price||0)}</td><td>${Number(p.stock||0)}</td><td>${esc(p.category)}</td><td><button class="danger" onclick="deleteProduct('${esc(p.id)}')">Delete</button></td></tr>`).join('')+'</tbody></table>'}
async function loadSellers(){
const {data,error}=await supabaseClient.from('sellers').select('*').order('created_at',{ascending:false});
if(error){notice('⚠️ Sellers load nahi hue: '+error.message);return}
window.sellersData=data||[];renderSellerManagement()
}
function renderSellerManagement(){
const list=window.sellersData||[], el=document.getElementById('sellerTable');
if(!list.length){el.innerHTML='<p class="muted">No sellers found.</p>';return}
el.innerHTML='<input class="search" id="sellerSearch" oninput="filterSellerRows()" placeholder="🔎 Seller / business search..."><div id="sellerRows">'+sellerRows(list)+'</div>'
}
function sellerRows(list){
return '<table class="table"><thead><tr><th>Business</th><th>Owner</th><th>Status</th><th>Active</th><th>Created</th><th>Action</th></tr></thead><tbody>'+
list.map(x=>`<tr><td>${esc(x.business_name||'-')}</td><td>${esc(x.owner_name||'-')}</td><td>${esc(x.status||'Pending')}</td><td>${x.is_active?'🟢 Active':'🔴 Inactive'}</td><td>${x.created_at?new Date(x.created_at).toLocaleDateString('en-IN'):'-'}</td><td>${String(x.status||'').toLowerCase()!=='approved'?`<button class="small" onclick="setSellerStatus('${esc(x.id)}','approved')">✅ Approve</button>`:''} ${String(x.status||'').toLowerCase()!=='rejected'?`<button class="danger" onclick="setSellerStatus('${esc(x.id)}','rejected')">❌ Reject</button>`:''}</td></tr>`).join('')+
'</tbody></table>'
}
function filterSellerRows(){
const q=(document.getElementById('sellerSearch')?.value||'').toLowerCase();
document.getElementById('sellerRows').innerHTML=sellerRows((window.sellersData||[]).filter(x=>String(x.business_name||'').toLowerCase().includes(q)||String(x.owner_name||'').toLowerCase().includes(q)))
}
async function setSellerStatus(id,status){
if(!confirm(status==='approved'?'Seller approve karein?':'Seller reject karein?'))return;
const {error}=await supabaseClient.from('sellers').update({status}).eq('id',id);
if(error){alert('❌ Status update failed: '+error.message);return}
const x=(window.sellersData||[]).find(v=>String(v.id)===String(id));if(x)x.status=status;renderSellerManagement()
}
function renderProfiles(){document.getElementById('userTable').innerHTML=makeProfileTable(profiles,'user')}
function makeProfileTable(list){if(!list.length)return '<p class="muted">No records found.</p>';return '<table class="table"><thead><tr><th>Name</th><th>Phone</th><th>Role</th><th>Active</th><th>Created</th></tr></thead><tbody>'+list.map(x=>`<tr><td>${esc(x.full_name||'-')}</td><td>${esc(x.phone||'-')}</td><td>${esc(x.role||'-')}</td><td>${x.is_active?'✅':'❌'}</td><td>${x.created_at?new Date(x.created_at).toLocaleDateString('en-IN'):'-'}</td></tr>`).join('')+'</tbody></table>'}

function orderNotice(t){
  const n=document.getElementById('orderNotice');
  if(!n)return;
  n.textContent=t;
  n.classList.remove('hidden');
}
function orderEsc(v){return esc(v)}
function orderDate(v){
  if(!v)return '-';
  const d=new Date(v);
  return isNaN(d.getTime())?'-':d.toLocaleString('en-IN');
}
function statusOptions(current){
  const statuses=['pending','confirmed','shipped','delivered','cancelled'];
  return '<select onchange="setOrderStatus(this.dataset.id,this.value)" data-id="'+orderEsc(current.id)+'" style="padding:7px;border:1px solid #ddd;border-radius:7px">'+
    statuses.map(s=>'<option value="'+s+'" '+(String(current.status||'pending').toLowerCase()===s?'selected':'')+'>'+s.charAt(0).toUpperCase()+s.slice(1)+'</option>').join('')+
    '</select>';
}
function renderOrders(){
  const q=(document.getElementById('orderSearch')?.value||'').toLowerCase();
  const sf=(document.getElementById('orderStatusFilter')?.value||'').toLowerCase();
  const list=(orders||[]).filter(o=>{
    const text=[o.id,o.customer_id,o.seller_id,o.business_id,o.shipping_name,o.shipping_phone,o.shipping_city,o.shipping_state,o.status,o.payment_method,o.payment_status].join(' ').toLowerCase();
    return (!q||text.includes(q)) && (!sf||String(o.status||'pending').toLowerCase()===sf);
  });
  if(!list.length){
    document.getElementById('orderTable').innerHTML='<p class="muted">No orders found.</p>';
    return;
  }
  document.getElementById('orderTable').innerHTML=
    '<table class="table"><thead><tr>'+
    '<th>Order ID</th><th>Customer</th><th>Phone</th><th>Total</th><th>Payment</th><th>Address</th><th>Created</th><th>Status</th>'+
    '</tr></thead><tbody>'+
    list.map(o=>{
      const address=[o.shipping_address,o.shipping_city,o.shipping_state,o.shipping_pincode].filter(Boolean).join(', ');
      return '<tr>'+
        '<td>'+orderEsc(o.id)+'</td>'+
        '<td>'+orderEsc(o.shipping_name||o.customer_id||'-')+'</td>'+
        '<td>'+orderEsc(o.shipping_phone||'-')+'</td>'+
        '<td>₹'+Number(o.total_amount||0).toFixed(2)+'</td>'+
        '<td>'+orderEsc(o.payment_method||'-')+' / '+orderEsc(o.payment_status||'-')+'</td>'+
        '<td>'+orderEsc(address||'-')+'</td>'+
        '<td>'+orderEsc(orderDate(o.created_at))+'</td>'+
        '<td>'+statusOptions(o)+'</td>'+
      '</tr>';
    }).join('')+
    '</tbody></table>';
}
async function loadOrders(){
  const el=document.getElementById('orderTable');
  if(!el)return;
  el.innerHTML='<p class="muted">Orders load ho rahe hain...</p>';
  const {data,error}=await supabaseClient.from('orders').select('*').order('created_at',{ascending:false});
  if(error){
    orderNotice('⚠️ Orders load nahi hue: '+error.message+' — Supabase RLS policy check karein.');
    el.innerHTML='<p class="muted">Orders load nahi ho paaye.</p>';
    return;
  }
  orders=data||[];
  renderOrders();
}
async function setOrderStatus(id,status){
  const {error}=await supabaseClient.from('orders').update({status}).eq('id',id);
  if(error){
    alert('❌ Order status update failed: '+error.message);
    return;
  }
  const x=(orders||[]).find(v=>String(v.id)===String(id));
  if(x)x.status=status;
  renderOrders();
}

async function deleteProduct(id){if(!confirm('Product delete karein?'))return;const {error}=await supabaseClient.from('products').delete().eq('id',id);if(error){alert('❌ Delete failed: '+error.message);return}products=products.filter(p=>String(p.id)!==String(id));updateStats();renderProducts()}
async function logout(){await supabaseClient.auth.signOut();sessionStorage.removeItem('br_admin_ok');location.href='admin-login.html'}
load();
</script></body></html>
