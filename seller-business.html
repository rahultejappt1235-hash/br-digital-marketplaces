<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shop / Business Details - BR Digital Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f5f7fa;
  font-family:Arial,sans-serif;
  color:#17212b;
}

.header{
  background:#fff;
  padding:20px 15px;
  text-align:center;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
  font-size:27px;
  font-weight:800;
}

.logo span{
  color:#ff7900;
}

.container{
  max-width:620px;
  margin:32px auto;
  padding:0 15px;
}

.card{
  background:#fff;
  border-radius:24px;
  padding:28px 22px;
  box-shadow:0 8px 30px rgba(0,0,0,.10);
}

.step{
  display:inline-block;
  background:#1677ed;
  color:#fff;
  padding:8px 15px;
  border-radius:20px;
  font-weight:bold;
  margin-bottom:15px;
}

h1{
  margin:4px 0 10px;
  color:#f47700;
  font-size:30px;
}

.subtitle{
  color:#666;
  font-size:16px;
  line-height:1.5;
  margin-bottom:25px;
}

label{
  display:block;
  font-size:16px;
  font-weight:700;
  margin:18px 0 8px;
}

.required{
  color:red;
}

input,
select,
textarea{
  width:100%;
  padding:16px;
  border:1px solid #d5d5d5;
  border-radius:13px;
  font-size:16px;
  outline:none;
  background:#fff;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#1677ed;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.hint{
  color:#777;
  font-size:13px;
  margin-top:6px;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:17px;
  font-size:18px;
  font-weight:800;
  cursor:pointer;
}

.continue{
  margin-top:25px;
  background:#1677ed;
  color:#fff;
}

.back{
  display:block;
  text-align:center;
  margin-top:20px;
  color:#f47700;
  font-weight:bold;
  text-decoration:none;
}

.message{
  display:none;
  margin-top:18px;
  padding:15px;
  border-radius:12px;
  text-align:center;
  line-height:1.5;
}

.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.info{
  display:block;
  background:#dbeafe;
  color:#1e40af;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">
    🏪 BR <span>Digital Marketplace</span>
  </div>
</div>

<div class="container">

<div class="card">

  <div class="step">2️⃣ Step 2</div>

  <h1>Shop / Business Details 🏪</h1>

  <div class="subtitle">
    Tell us about your business
  </div>

  <!-- BUSINESS NAME -->

  <label>
    Business / Shop Name <span class="required">*</span>
  </label>

  <input
    id="businessName"
    type="text"
    placeholder="Example: Rahul Mobile Shop"
  >

  <!-- BUSINESS TYPE -->

  <label>
    Business Type <span class="required">*</span>
  </label>

  <select id="businessType">

    <option value="">
      Select Business Type
    </option>

    <option value="Electronics">
      Electronics
    </option>

    <option value="Fashion">
      Fashion
    </option>

    <option value="Home & Living">
      Home & Living
    </option>

    <option value="Groceries">
      Groceries
    </option>

    <option value="Beauty">
      Beauty
    </option>

    <option value="Mobiles & Accessories">
      Mobiles & Accessories
    </option>

    <option value="Food & Restaurant">
      Food & Restaurant
    </option>

    <option value="Books & Stationery">
      Books & Stationery
    </option>

    <option value="Other">
      Other
    </option>

  </select>

  <!-- SHOP REGISTRATION -->

  <label>
    Shop Registration
    <span style="font-weight:400;color:#777">
      (Optional)
    </span>
  </label>

  <input
    id="shopRegistration"
    type="text"
    placeholder="Shop Act / Udyam / Other"
  >

  <div class="hint">
    अगर आपके पास business registration है तो उसकी जानकारी दें।
  </div>

  <!-- DESCRIPTION -->

  <label>
    Business Description <span class="required">*</span>
  </label>

  <textarea
    id="businessDescription"
    placeholder="अपने business और products के बारे में बताएं..."
  ></textarea>

  <button
    class="continue"
    onclick="saveBusinessDetails()"
  >
    Continue →
  </button>

  <div id="message" class="message"></div>

  <a
    href="seller-login.html"
    class="back"
  >
    ← Back
  </a>

</div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://uryjmibcdfjfxoljrigt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_uYbJw0ARCCkCpQ9QB6FxaQ_JrIxtOOp";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   MESSAGE
========================= */

function showMessage(text,type){

  const box =
    document.getElementById("message");

  box.className =
    "message " + type;

  box.innerHTML = text;
}


/* =========================
   SAVE BUSINESS DETAILS
========================= */

async function saveBusinessDetails(){

  const businessName =
    document
    .getElementById("businessName")
    .value
    .trim();

  const businessType =
    document
    .getElementById("businessType")
    .value;

  const shopRegistration =
    document
    .getElementById("shopRegistration")
    .value
    .trim();

  const businessDescription =
    document
    .getElementById("businessDescription")
    .value
    .trim();


  /* VALIDATION */

  if(!businessName){

    showMessage(
      "❌ Business / Shop Name भरें।",
      "error"
    );

    return;
  }


  if(!businessType){

    showMessage(
      "❌ Business Type select करें।",
      "error"
    );

    return;
  }


  if(!businessDescription){

    showMessage(
      "❌ Business Description भरें।",
      "error"
    );

    return;
  }


  showMessage(
    "⏳ Business details save हो रही हैं...",
    "info"
  );


  try{

    /* CHECK LOGIN */

    const {
      data:{
        user
      },
      error:userError
    } =
      await db.auth.getUser();


    if(userError || !user){

      showMessage(
        "❌ पहले Seller Account में login करें।",
        "error"
      );

      return;
    }


    /* UPDATE SELLER */

    const {
      error
    } =
      await db
      .from("sellers")
      .update({

        business_name:
          businessName,

        business_type:
          businessType,

        shop_registration:
          shopRegistration || null,

        business_description:
          businessDescription,

        updated_at:
          new Date().toISOString()

      })
      .eq("user_id", user.id);


    if(error){

      console.error(error);

      showMessage(
        "❌ Database Error: " +
        error.message,
        "error"
      );

      return;
    }


    showMessage(
      "✅ Shop / Business Details save हो गईं!<br><br>" +
      "⏭️ अब Step 3: Address Details खुलेगा...",
      "success"
    );


    setTimeout(function(){

      window.location.href =
        "seller-address.html";

    },1200);


  }catch(error){

    console.error(error);

    showMessage(
      "❌ Error: " +
      error.message,
      "error"
    );

  }

}

</script>

</body>
</html>
