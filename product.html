<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Product | BR Digital Marketplace</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#18212f;
  padding-bottom:90px;
}

.header{
  height:70px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 15px;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  background:#fff;
  z-index:20;
}

.back{
  border:0;
  background:#f5f5f5;
  width:44px;
  height:44px;
  border-radius:12px;
  font-size:25px;
}

.logo{
  width:45px;
  height:45px;
  border:3px solid #087f45;
  border-radius:50%;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:19px;
  font-weight:900;
}

.brand{
  font-size:18px;
  font-weight:900;
}

.brand span{
  color:#f36b21;
}

.cart{
  margin-left:auto;
  border:0;
  background:#f5f5f5;
  width:44px;
  height:44px;
  border-radius:50%;
  font-size:22px;
}

/* IMAGE */

.product-gallery{
  background:#f7f8f9;
  padding:20px 15px;
}

.main-image{
  width:100%;
  height:390px;
  background:#fff;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.main-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

/* INFO */

.info{
  padding:20px 18px;
}

.stock{
  display:inline-block;
  background:#e7f7ed;
  color:#087f45;
  padding:7px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:900;
}

.title{
  margin-top:13px;
  font-size:23px;
  line-height:1.2;
}

.brand-text{
  color:#68717b;
  margin-top:7px;
  font-size:14px;
}

.rating{
  margin-top:15px;
  color:#087f45;
  font-size:16px;
  font-weight:900;
}

.price{
  margin-top:16px;
  font-size:29px;
  color:#e3311b;
  font-weight:900;
}

.description{
  margin-top:18px;
  color:#606973;
  line-height:1.5;
  font-size:14px;
}

.seller{
  margin-top:20px;
  padding:15px;
  border-radius:14px;
  background:#f5faf7;
  border:1px solid #dcefe3;
}

.seller-title{
  color:#087f45;
  font-weight:900;
}

.seller-name{
  margin-top:5px;
  font-size:14px;
}

/* BUTTONS */

.bottom-actions{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  border-top:1px solid #ddd;
  padding:10px;
  display:flex;
  gap:10px;
  z-index:50;
}

.add{
  flex:1;
  height:52px;
  border:2px solid #087f45;
  background:#fff;
  color:#087f45;
  border-radius:13px;
  font-size:16px;
  font-weight:900;
}

.buy{
  flex:1;
  height:52px;
  border:0;
  background:#f36b21;
  color:#fff;
  border-radius:13px;
  font-size:16px;
  font-weight:900;
}

.loading{
  padding:60px 20px;
  text-align:center;
  color:#777;
}

.error{
  padding:50px 20px;
  text-align:center;
  color:#d33;
}

@media(min-width:700px){

  .product-gallery,
  .info{
    max-width:700px;
    margin:auto;
  }

  .main-image{
    height:500px;
  }

}

</style>

</head>

<body>

<header class="header">

<button
class="back"
onclick="history.back()">
←
</button>

<div class="logo">
BR
</div>

<div class="brand">
<span>BR</span> Digital Marketplace
</div>

<button
class="cart"
onclick="openCart()">
🛒
</button>

</header>


<div id="productArea">

<div class="loading">
⏳ Product loading...
</div>

</div>


<div
class="bottom-actions"
id="actions"
style="display:none">

<button
class="add"
onclick="addProductToCart()">
🛒 Add to Cart
</button>

<button
class="buy"
onclick="buyNow()">
Buy Now →
</button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://uryjmibcdfjfxoljrigt.supabase.co";

const SUPABASE_KEY =
"sb_publishable_uYbJw0ARCCkCpQ9QB6FxaQ_JrIxtOOp";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let product = null;


/* GET PRODUCT ID */

const params =
new URLSearchParams(
  window.location.search
);

const productId =
params.get("id");


/* LOAD REAL APPROVED PRODUCT */

async function loadProduct(){

  const area =
  document.getElementById(
    "productArea"
  );

  if(!productId){

    area.innerHTML = `
      <div class="error">
        Product ID नहीं मिला।
      </div>
    `;

    return;
  }


  const {data,error} =
  await supabaseClient

  .from("products")

  .select(`
    id,
    product_name,
    brand,
    category,
    product_type,
    description,
    price,
    stock,
    image_url,
    seller_name,
    status,
    seller_id
  `)

  .eq(
    "id",
    productId
  )

  .eq(
    "status",
    "approved"
  )

  .maybeSingle();


  if(error){

    console.error(error);

    area.innerHTML = `
      <div class="error">
        Product load नहीं हो पाया।
      </div>
    `;

    return;
  }


  if(!data){

    area.innerHTML = `
      <div class="error">
        यह product अभी उपलब्ध नहीं है।
      </div>
    `;

    return;
  }


  product = data;


  const stock =
  Number(
    product.stock || 0
  );


  area.innerHTML = `

    <div class="product-gallery">

      <div class="main-image">

        ${
          product.image_url
          ?
          `
          <img
          src="${escapeHTML(
            product.image_url
          )}"
          alt="${escapeHTML(
            product.product_name
          )}">
          `
          :
          `
          <span>
          Product Image Available नहीं है
          </span>
          `
        }

      </div>

    </div>


    <div class="info">

      <span class="stock"
      style="
      ${
        stock > 0
        ? ""
        : "background:#ffe8e8;color:#d33;"
      }">

        ${
          stock > 0
          ? "✓ In Stock"
          : "Out of Stock"
        }

      </span>


      <h1 class="title">
        ${escapeHTML(
          product.product_name
        )}
      </h1>


      ${
        product.brand
        ?
        `
        <div class="brand-text">
          Brand: ${escapeHTML(
            product.brand
          )}
        </div>
        `
        :
        ""
      }


      <div class="rating">
        ⭐ Product from Verified Seller
      </div>


      <div class="price">
        ₹${formatPrice(
          product.price
        )}
      </div>


      ${
        product.description
        ?
        `
        <div class="description">

          ${escapeHTML(
            product.description
          )}

        </div>
        `
        :
        ""
      }


      <div class="seller">

        <div class="seller-title">
          🏪 Seller
        </div>

        <div class="seller-name">
          ${
            product.seller_name
            ?
            escapeHTML(
              product.seller_name
            )
            :
            "BR Digital Marketplace Seller"
          }
        </div>

      </div>

    </div>

  `;


  if(stock > 0){

    document.getElementById(
      "actions"
    ).style.display =
      "flex";

  }

}


/* CART */

function addProductToCart(){

  if(!product)
    return;


  let cart =
  JSON.parse(
    localStorage.getItem(
      "br_cart"
    ) || "[]"
  );


  const existing =
  cart.find(
    item =>
      String(item.id)
      ===
      String(product.id)
  );


  if(existing){

    existing.quantity =
      Number(
        existing.quantity || 1
      ) + 1;

  }else{

    cart.push({

      id:product.id,

      product_name:
        product.product_name,

      price:
        product.price,

      image_url:
        product.image_url,

      stock:
        product.stock,

      seller_id:
        product.seller_id,

      quantity:1

    });

  }


  localStorage.setItem(
    "br_cart",
    JSON.stringify(cart)
  );


  alert(
    "Product Cart में Add हो गया 🛒"
  );

}


function buyNow(){

  addProductToCart();

  setTimeout(
    function(){
      window.location.href =
        "cart.html";
    },
    200
  );

}


function openCart(){

  window.location.href =
    "cart.html";

}


function formatPrice(
  value
){

  const n =
    Number(value);

  if(
    !Number.isFinite(n)
  )
    return "0";

  return n.toLocaleString(
    "en-IN",
    {
      maximumFractionDigits:2
    }
  );

}


function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}


loadProduct();

</script>

</body>
</html>
