<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Product Details - BR Digital Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f8fa;
  color:#18212f;
  padding-bottom:95px;
}

button{
  font-family:inherit;
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

/* ================= HEADER ================= */

.header{
  height:68px;
  background:#fff;
  border-bottom:1px solid #e5e5e5;
  display:flex;
  align-items:center;
  padding:8px 14px;
  gap:10px;
  position:sticky;
  top:0;
  z-index:1000;
}

.back-btn{
  width:42px;
  height:42px;
  border:0;
  border-radius:12px;
  background:#f3f5f6;
  font-size:25px;
}

.logo{
  width:44px;
  height:44px;
  border:3px solid #087f45;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:900;
  background:#fff;
}

.brand{
  flex:1;
  min-width:0;
}

.brand-name{
  font-size:17px;
  font-weight:900;
  white-space:nowrap;
}

.orange{
  color:#f36b21;
}

.green{
  color:#087f45;
}

.tagline{
  font-size:8px;
  color:#777;
  margin-top:3px;
  white-space:nowrap;
}

.cart-btn{
  width:43px;
  height:43px;
  border:0;
  border-radius:50%;
  background:#f3f5f6;
  font-size:22px;
  position:relative;
}

.cart-count{
  position:absolute;
  top:-3px;
  right:-2px;
  min-width:19px;
  height:19px;
  border-radius:20px;
  background:#e62d2d;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  font-weight:900;
}

/* ================= PRODUCT ================= */

.product-page{
  padding:12px 15px 25px;
}

.product-image-box{
  width:100%;
  height:340px;
  background:#fff;
  border-radius:18px;
  border:1px solid #e2e5e7;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
}

.product-image-box img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.no-image{
  color:#888;
  text-align:center;
  font-size:13px;
}

.product-info{
  background:#fff;
  margin-top:12px;
  padding:17px;
  border-radius:18px;
  border:1px solid #e2e5e7;
}

.category-label{
  display:inline-block;
  color:#087f45;
  background:#edf8f1;
  padding:6px 9px;
  border-radius:8px;
  font-size:11px;
  font-weight:900;
}

.product-name{
  font-size:24px;
  line-height:1.2;
  font-weight:900;
  margin-top:12px;
}

.product-brand{
  color:#777;
  font-size:13px;
  margin-top:7px;
}

.product-price{
  color:#e3311b;
  font-size:28px;
  font-weight:900;
  margin-top:14px;
}

.stock{
  margin-top:7px;
  font-size:13px;
  font-weight:900;
}

.in-stock{
  color:#087f45;
}

.out-stock{
  color:#d33;
}

/* ================= DESCRIPTION ================= */

.description-box{
  margin-top:12px;
  background:#fff;
  border:1px solid #e2e5e7;
  border-radius:18px;
  padding:17px;
}

.description-title{
  font-size:18px;
  font-weight:900;
}

.description{
  color:#606870;
  font-size:14px;
  line-height:1.55;
  margin-top:9px;
  white-space:pre-line;
}

/* ================= SELLER ================= */

.seller-box{
  margin-top:12px;
  background:#fff;
  border:1px solid #e2e5e7;
  border-radius:18px;
  padding:17px;
}

.seller-title{
  font-size:18px;
  font-weight:900;
}

.seller-name{
  color:#087f45;
  font-size:14px;
  font-weight:800;
  margin-top:8px;
}

/* ================= QUANTITY ================= */

.quantity-box{
  margin-top:14px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.quantity-title{
  font-size:14px;
  font-weight:900;
}

.quantity-control{
  display:flex;
  align-items:center;
  border:1px solid #d8dce0;
  border-radius:10px;
  overflow:hidden;
}

.quantity-control button{
  width:38px;
  height:38px;
  border:0;
  background:#f4f6f7;
  font-size:20px;
  font-weight:900;
}

.quantity-value{
  width:40px;
  text-align:center;
  font-size:15px;
  font-weight:900;
}

/* ================= ACTIONS ================= */

.action-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  min-height:82px;
  background:#fff;
  border-top:1px solid #ddd;
  display:flex;
  gap:9px;
  padding:10px 13px;
  z-index:3000;
  box-shadow:0 -3px 15px rgba(0,0,0,.08);
}

.add-cart-btn{
  flex:1;
  border:2px solid #087f45;
  background:#fff;
  color:#087f45;
  border-radius:13px;
  font-size:14px;
  font-weight:900;
}

.buy-btn{
  flex:1;
  border:0;
  background:#f36b21;
  color:#fff;
  border-radius:13px;
  font-size:14px;
  font-weight:900;
}

.disabled-btn{
  background:#aaa !important;
  border-color:#aaa !important;
  color:#fff !important;
}

/* ================= LOADING ================= */

.loading,
.error-box{
  text-align:center;
  padding:50px 20px;
  color:#777;
}

/* ================= MOBILE ================= */

@media(max-width:420px){

  .product-image-box{
    height:300px;
  }

  .product-name{
    font-size:21px;
  }

  .product-price{
    font-size:25px;
  }

}

/* ================= DESKTOP ================= */

@media(min-width:768px){

  body{
    max-width:900px;
    margin:auto;
  }

  .header{
    border-radius:0;
  }

  .product-page{
    padding:20px;
  }

  .product-image-box{
    height:470px;
  }

  .action-bar{
    max-width:900px;
    left:50%;
    transform:translateX(-50%);
  }

}

</style>
</head>

<body>


<!-- ================= HEADER ================= -->

<header class="header">

  <button
    class="back-btn"
    type="button"
    onclick="goBack()">
    ←
  </button>

  <div class="logo">
    BR
  </div>

  <div class="brand">

    <div class="brand-name">
      <span class="orange">BR</span>
      <span class="green">
        Digital Marketplace
      </span>
    </div>

    <div class="tagline">
      Shop Local • Support Bihar • Grow Together ❤️
    </div>

  </div>

  <button
    class="cart-btn"
    type="button"
    onclick="openCart()">

    🛒

    <span
      id="cartCount"
      class="cart-count">
      0
    </span>

  </button>

</header>


<!-- ================= PRODUCT PAGE ================= -->

<main
  id="productPage"
  class="product-page">

  <div class="loading">
    ⏳ Product details loading...
  </div>

</main>


<!-- ================= ACTION BAR ================= -->

<div
  id="actionBar"
  class="action-bar"
  style="display:none;">

  <button
    id="addCartBtn"
    class="add-cart-btn"
    type="button"
    onclick="addCurrentToCart()">

    🛒 Add to Cart

  </button>

  <button
    id="buyBtn"
    class="buy-btn"
    type="button"
    onclick="buyNow()">

    Buy Now →

  </button>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://uryjmibcdfjfxoljrigt.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_uYbJw0ARCCkCpQ9QB6FxaQ_JrIxtOOp";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =====================================================
   VARIABLES
===================================================== */

let currentProduct = null;

let quantity = 1;

let cart =
  JSON.parse(
    localStorage.getItem("br_cart") || "[]"
  );


/* =====================================================
   PRODUCT ID
===================================================== */

function getProductId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return params.get("id");

}


/* =====================================================
   LOAD PRODUCT
===================================================== */

async function loadProduct(){

  const page =
    document.getElementById(
      "productPage"
    );

  const productId =
    getProductId();


  if(!productId){

    page.innerHTML = `
      <div class="error-box">
        ⚠️ Product ID नहीं मिला।
        <br><br>
        <button
          onclick="goBack()"
          style="
          padding:10px 18px;
          border:0;
          border-radius:10px;
          background:#087f45;
          color:#fff;
          font-weight:bold;">
          ← वापस जाएँ
        </button>
      </div>
    `;

    return;
  }


  const result =
    await supabaseClient

      .from("products")

      .select(`
        id,
        product_name,
        brand,
        category,
        product_type,
        description,
        price,
        stock,
        image_url,
        seller_name,
        status,
        seller_id
      `)

      .eq(
        "id",
        productId
      )

      .eq(
        "status",
        "approved"
      )

      .maybeSingle();


  if(result.error){

    console.error(
      result.error
    );

    page.innerHTML = `
      <div class="error-box">
        ⚠️ Product load नहीं हो पाया।
        <br><br>
        Please try again.
      </div>
    `;

    return;
  }


  if(!result.data){

    page.innerHTML = `
      <div class="error-box">
        🛍️ यह product अभी उपलब्ध नहीं है।
      </div>
    `;

    return;
  }


  currentProduct =
    result.data;


  renderProduct(
    currentProduct
  );


  document.getElementById(
    "actionBar"
  ).style.display =
    "flex";

}


/* =====================================================
   RENDER PRODUCT
===================================================== */

function renderProduct(
  product
){

  const page =
    document.getElementById(
      "productPage"
    );


  const image =
    product.image_url || "";


  const stock =
    Number(
      product.stock || 0
    );


  const inStock =
    stock > 0;


  page.innerHTML = `

    <div class="product-image-box">

      ${
        image
        ?
        `
        <img
          src="${escapeHTML(image)}"
          alt="${escapeHTML(
            product.product_name ||
            "Product"
          )}"
          onerror="
            this.style.display='none';
            document.getElementById(
              'imageFallback'
            ).style.display='block';
          ">
        `
        :
        ""
      }

      <div
        id="imageFallback"
        class="no-image"
        style="
        display:${image ? "none" : "block"};">

        📷 Product image unavailable

      </div>

    </div>


    <div class="product-info">

      ${
        product.category
        ?
        `
        <div class="category-label">
          ${escapeHTML(
            product.category
          )}
        </div>
        `
        :
        ""
      }


      <h1 class="product-name">

        ${escapeHTML(
          product.product_name ||
          "Product"
        )}

      </h1>


      ${
        product.brand
        ?
        `
        <div class="product-brand">
          Brand: ${escapeHTML(
            product.brand
          )}
        </div>
        `
        :
        ""
      }


      ${
        product.product_type
        ?
        `
        <div class="product-brand">
          Type: ${escapeHTML(
            product.product_type
          )}
        </div>
        `
        :
        ""
      }


      <div class="product-price">

        ₹${formatPrice(
          product.price
        )}

      </div>


      <div
        class="stock ${
          inStock
          ? "in-stock"
          : "out-stock"
        }">

        ${
          inStock
          ? `✓ In Stock (${stock} available)`
          : "✕ Out of Stock"
        }

      </div>


      ${
        inStock
        ?
        `
        <div class="quantity-box">

          <div class="quantity-title">
            Quantity
          </div>

          <div class="quantity-control">

            <button
              type="button"
              onclick="decreaseQuantity()">
              −
            </button>

            <div
              id="quantityValue"
              class="quantity-value">
              1
            </div>

            <button
              type="button"
              onclick="increaseQuantity()">
              +
            </button>

          </div>

        </div>
        `
        :
        ""
      }

    </div>


    ${
      product.description
      ?
      `
      <div class="description-box">

        <div class="description-title">
          Product Description
        </div>

        <div class="description">
          ${escapeHTML(
            product.description
          )}
        </div>

      </div>
      `
      :
      ""
    }


    ${
      product.seller_name
      ?
      `
      <div class="seller-box">

        <div class="seller-title">
          Seller Information
        </div>

        <div class="seller-name">
          🏪 ${escapeHTML(
            product.seller_name
          )}
        </div>

      </div>
      `
      :
      ""
    }

  `;


  const addBtn =
    document.getElementById(
      "addCartBtn"
    );

  const buyBtn =
    document.getElementById(
      "buyBtn"
    );


  if(!inStock){

    addBtn.disabled = true;
    buyBtn.disabled = true;

    addBtn.classList.add(
      "disabled-btn"
    );

    buyBtn.classList.add(
      "disabled-btn"
    );

    addBtn.innerText =
      "Out of Stock";

    buyBtn.innerText =
      "Out of Stock";

  }

}


/* =====================================================
   QUANTITY
===================================================== */

function increaseQuantity(){

  if(!currentProduct){
    return;
  }


  const stock =
    Number(
      currentProduct.stock || 0
    );


  if(quantity < stock){

    quantity++;

    updateQuantity();

  }

}


function decreaseQuantity(){

  if(quantity > 1){

    quantity--;

    updateQuantity();

  }

}


function updateQuantity(){

  const element =
    document.getElementById(
      "quantityValue"
    );

  if(element){

    element.textContent =
      quantity;

  }

}


/* =====================================================
   ADD TO CART
===================================================== */

function addCurrentToCart(){

  if(!currentProduct){
    return;
  }


  const stock =
    Number(
      currentProduct.stock || 0
    );


  if(stock <= 0){

    alert(
      "यह product अभी Out of Stock है।"
    );

    return;
  }


  const existing =
    cart.find(
      item =>
        String(item.id)
        ===
        String(currentProduct.id)
    );


  if(existing){

    const newQuantity =
      Number(
        existing.quantity || 0
      ) + quantity;


    if(newQuantity > stock){

      alert(
        "इतनी quantity उपलब्ध नहीं है।"
      );

      return;
    }


    existing.quantity =
      newQuantity;

  }else{

    cart.push({

      id:
        currentProduct.id,

      product_name:
        currentProduct.product_name,

      price:
        currentProduct.price,

      image_url:
        currentProduct.image_url,

      stock:
        currentProduct.stock,

      seller_id:
        currentProduct.seller_id,

      quantity:
        quantity

    });

  }


  localStorage.setItem(
    "br_cart",
    JSON.stringify(cart)
  );


  updateCartCount();


  alert(
    "Product cart में add हो गया 🛒"
  );

}


/* =====================================================
   BUY NOW
===================================================== */

function buyNow(){

  if(!currentProduct){
    return;
  }


  const stock =
    Number(
      currentProduct.stock || 0
    );


  if(stock <= 0){

    alert(
      "यह product Out of Stock है।"
    );

    return;
  }


  addCurrentToCart();


  window.location.href =
    "cart.html";

}


/* =====================================================
   CART COUNT
===================================================== */

function updateCartCount(){

  const count =
    cart.reduce(
      (
        total,
        item
      ) =>
        total +
        Number(
          item.quantity || 1
        ),
      0
    );


  const element =
    document.getElementById(
      "cartCount"
    );


  if(element){

    element.textContent =
      count;

  }

}


/* =====================================================
   OPEN CART
===================================================== */

function openCart(){

  window.location.href =
    "cart.html";

}


/* =====================================================
   BACK
===================================================== */

function goBack(){

  if(
    document.referrer &&
    document.referrer.includes(
      window.location.host
    )
  ){

    history.back();

  }else{

    window.location.href =
      "index.html";

  }

}


/* =====================================================
   HELPERS
===================================================== */

function formatPrice(
  price
){

  const number =
    Number(price);


  if(
    !Number.isFinite(number)
  ){

    return "0";

  }


  return number.toLocaleString(
    "en-IN",
    {
      maximumFractionDigits:2
    }
  );

}


function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}


/* =====================================================
   START
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function(){

    updateCartCount();

    loadProduct();

  }
);

</script>

</body>
</html>
