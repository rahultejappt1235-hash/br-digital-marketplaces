<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Account | BR Digital Marketplace</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,sans-serif;
      background:#f5f6f7;
      color:#202124;
      padding-bottom:75px;
    }

    .header{
      background:#fff;
      padding:15px;
      position:sticky;
      top:0;
      z-index:1000;
      box-shadow:0 2px 10px rgba(0,0,0,.08);
    }

    .top{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .back{
      width:42px;
      height:42px;
      border:0;
      border-radius:12px;
      background:#f1f3f4;
      font-size:21px;
    }

    .brand{
      flex:1;
    }

    .brand h1{
      font-size:19px;
      color:#087f45;
      font-weight:900;
    }

    .brand p{
      font-size:11px;
      color:#777;
      margin-top:3px;
    }

    .container{
      max-width:700px;
      margin:auto;
      padding:15px;
    }

    /* PROFILE */
    .profile-card{
      background:#087f45;
      color:#fff;
      border-radius:20px;
      padding:20px;
      display:flex;
      align-items:center;
      gap:15px;
      box-shadow:0 5px 18px rgba(0,0,0,.12);
      margin-bottom:18px;
    }

    .profile-icon{
      width:68px;
      height:68px;
      border-radius:50%;
      background:#fff;
      color:#087f45;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:34px;
      flex-shrink:0;
    }

    .profile-info{
      flex:1;
    }

    .profile-info h2{
      font-size:20px;
      margin-bottom:6px;
    }

    .profile-info p{
      font-size:13px;
      margin:3px 0;
      opacity:.95;
    }

    .customer-label{
      margin-top:6px;
      font-size:12px;
      font-weight:bold;
    }

    /* MENU */
    .menu-list{
      display:flex;
      flex-direction:column;
      gap:9px;
    }

    .menu-card{
      width:100%;
      border:0;
      background:#fff;
      border-radius:15px;
      padding:14px;
      display:flex;
      align-items:center;
      gap:14px;
      text-align:left;
      box-shadow:0 2px 9px rgba(0,0,0,.06);
      cursor:pointer;
    }

    .menu-card:active{
      transform:scale(.99);
    }

    .menu-icon{
      width:48px;
      height:48px;
      border-radius:13px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:23px;
      background:#f1f3f4;
    }

    .menu-content{
      flex:1;
    }

    .menu-content strong{
      display:block;
      font-size:15px;
    }

    .menu-content span{
      display:block;
      font-size:11px;
      color:#777;
      margin-top:4px;
    }

    .arrow{
      font-size:22px;
      color:#888;
    }

    /* PANELS */
    .panel{
      display:none;
      background:#fff;
      border-radius:18px;
      padding:18px;
      margin-top:15px;
      box-shadow:0 2px 10px rgba(0,0,0,.06);
    }

    .panel.show{
      display:block;
    }

    .panel h2{
      font-size:20px;
      margin-bottom:15px;
    }

    .field{
      margin-bottom:13px;
    }

    .field label{
      display:block;
      font-size:12px;
      font-weight:bold;
      margin-bottom:6px;
    }

    .field input,
    .field textarea{
      width:100%;
      border:1px solid #ddd;
      border-radius:11px;
      padding:12px;
      outline:none;
      font-size:14px;
    }

    .field textarea{
      min-height:80px;
      resize:vertical;
    }

    .btn{
      width:100%;
      height:45px;
      border:0;
      border-radius:11px;
      background:#087f45;
      color:#fff;
      font-weight:900;
      cursor:pointer;
    }

    .location-btn{
      background:#1769aa;
      margin-bottom:14px;
    }

    .location-info{
      background:#eef7ff;
      border-radius:12px;
      padding:12px;
      margin-bottom:14px;
      font-size:12px;
      display:none;
    }

    .order{
      border:1px solid #eee;
      border-radius:12px;
      padding:13px;
      margin-bottom:10px;
    }

    .order strong{
      font-size:14px;
    }

    .order p{
      font-size:12px;
      color:#666;
      margin-top:5px;
    }

    .empty{
      text-align:center;
      padding:25px 10px;
      color:#777;
      font-size:13px;
    }

    .logout{
      background:#fff0f0;
    }

    .logout .menu-content strong{
      color:#d93025;
    }

    /* BOTTOM NAV */
    .bottom-nav{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      height:65px;
      background:#fff;
      border-top:1px solid #ddd;
      display:flex;
      justify-content:space-around;
      align-items:center;
      z-index:2000;
      box-shadow:0 -3px 15px rgba(0,0,0,.08);
    }

    .bottom-item{
      border:0;
      background:transparent;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
      font-size:11px;
      color:#777;
      min-width:60px;
    }

    .bottom-item .icon{
      font-size:20px;
    }

    .bottom-item.active{
      color:#087f45;
      font-weight:900;
    }

    @media(max-width:500px){
      .container{
        padding:12px 10px;
      }

      .profile-card{
        padding:16px;
      }

      .profile-icon{
        width:60px;
        height:60px;
        font-size:29px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="top">

    <button class="back" onclick="goHome()">←</button>

    <div class="brand">
      <h1>BR Digital Marketplace</h1>
      <p>My Customer Account ❤️</p>
    </div>

  </div>
</header>


<main class="container">

  <!-- CUSTOMER PROFILE -->
  <section class="profile-card">

    <div class="profile-icon">👤</div>

    <div class="profile-info">
      <h2 id="customerName">Loading...</h2>
      <p id="customerPhone">📱 Loading...</p>
      <p id="customerEmail">✉️ Loading...</p>
      <div class="customer-label">👤 Customer</div>
    </div>

  </section>


  <!-- ACCOUNT MENU -->
  <div class="menu-list">

    <button class="menu-card" onclick="showPanel('profilePanel')">
      <div class="menu-icon">👤</div>
      <div class="menu-content">
        <strong>My Profile</strong>
        <span>View and edit your profile</span>
      </div>
      <div class="arrow">›</div>
    </button>


    <button class="menu-card" onclick="openOrders()">
      <div class="menu-icon">📦</div>
      <div class="menu-content">
        <strong>My Orders</strong>
        <span>Track and view your orders</span>
      </div>
      <div class="arrow">›</div>
    </button>


    <button class="menu-card" onclick="openCart()">
      <div class="menu-icon">🛒</div>
      <div class="menu-content">
        <strong>My Cart</strong>
        <span>View products in your cart</span>
      </div>
      <div class="arrow">›</div>
    </button>


    <button class="menu-card" onclick="showWishlist()">
      <div class="menu-icon">❤️</div>
      <div class="menu-content">
        <strong>My Wishlist</strong>
        <span>Your saved products</span>
      </div>
      <div class="arrow">›</div>
    </button>


    <button class="menu-card" onclick="showPanel('addressPanel')">
      <div class="menu-icon">📍</div>
      <div class="menu-content">
        <strong>My Address</strong>
        <span>Manage delivery address & location</span>
      </div>
      <div class="arrow">›</div>
    </button>


    <button class="menu-card" onclick="showSupport()">
      <div class="menu-icon">🎧</div>
      <div class="menu-content">
        <strong>Help & Support</strong>
        <span>Get help with your account and orders</span>
      </div>
      <div class="arrow">›</div>
    </button>


    <button class="menu-card" onclick="showSettings()">
      <div class="menu-icon">⚙️</div>
      <div class="menu-content">
        <strong>Settings</strong>
        <span>Account settings</span>
      </div>
      <div class="arrow">›</div>
    </button>


    <button class="menu-card logout" onclick="logout()">
      <div class="menu-icon">🔐</div>
      <div class="menu-content">
        <strong>Logout</strong>
        <span>Logout from your customer account</span>
      </div>
      <div class="arrow">›</div>
    </button>

  </div>


  <!-- PROFILE PANEL -->
  <section id="profilePanel" class="panel">

    <h2>👤 My Profile</h2>

    <div class="field">
      <label>Full Name</label>
      <input id="profileName" type="text">
    </div>

    <div class="field">
      <label>Mobile Number</label>
      <input id="profilePhone" type="tel">
    </div>

    <div class="field">
      <label>Email</label>
      <input id="profileEmail" type="email" readonly>
    </div>

    <button class="btn" onclick="saveProfile()">
      💾 Save Profile
    </button>

  </section>


  <!-- ADDRESS PANEL -->
  <section id="addressPanel" class="panel">

    <h2>📍 My Address</h2>

    <button
      class="btn location-btn"
      onclick="getCurrentLocation()">
      📍 Use Current Location
    </button>

    <div id="locationInfo" class="location-info"></div>

    <div class="field">
      <label>House / Shop Address</label>
      <textarea
        id="address"
        placeholder="House No, Road, Village / Area"></textarea>
    </div>

    <div class="field">
      <label>City</label>
      <input id="city" type="text" placeholder="City">
    </div>

    <div class="field">
      <label>State</label>
      <input id="state" type="text" placeholder="State">
    </div>

    <div class="field">
      <label>PIN Code</label>
      <input id="pincode" type="number" placeholder="PIN Code">
    </div>

    <button class="btn" onclick="saveAddress()">
      💾 Save Address
    </button>

  </section>

</main>


<!-- BOTTOM NAV -->
<nav class="bottom-nav">

  <button class="bottom-item" onclick="goHome()">
    <span class="icon">🏠</span>
    Home
  </button>

  <button class="bottom-item" onclick="openCategories()">
    <span class="icon">▦</span>
    Categories
  </button>

  <button class="bottom-item" onclick="openMarket()">
    <span class="icon">🏪</span>
    Market
  </button>

  <button class="bottom-item" onclick="openOrders()">
    <span class="icon">📦</span>
    Orders
  </button>

  <button class="bottom-item active">
    <span class="icon">👤</span>
    Account
  </button>

</nav>


<script>

  /* =========================
     SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://uryjmibcdfjfxoljrigt.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_uYbJw0ARCCkCpQ9QB6FxaQ_JrIxtOOp";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  let currentUser = null;
  let currentProfile = null;


  /* =========================
     AUTH
  ========================= */

  async function loadCustomer(){

    const {
      data:{user},
      error
    } = await supabaseClient.auth.getUser();

    if(error || !user){

      document.getElementById("customerName").innerText =
        "Guest Customer";

      document.getElementById("customerPhone").innerText =
        "📱 Please login";

      document.getElementById("customerEmail").innerText =
        "✉️ Login to view your account";

      return;
    }

    currentUser = user;

    const {data:profile} =
      await supabaseClient
      .from("profiles")
      .select("id,full_name,phone,role,is_active,created_at")
      .eq("id",user.id)
      .maybeSingle();

    currentProfile = profile || null;

    const name =
      profile?.full_name ||
      user.user_metadata?.full_name ||
      "Customer";

    const phone =
      profile?.phone ||
      user.user_metadata?.phone ||
      "Not added";

    document.getElementById("customerName").innerText =
      name;

    document.getElementById("customerPhone").innerText =
      "📱 " + phone;

    document.getElementById("customerEmail").innerText =
      "✉️ " + (user.email || "Not available");

    document.getElementById("profileName").value =
      name === "Customer" ? "" : name;

    document.getElementById("profilePhone").value =
      phone === "Not added" ? "" : phone;

    document.getElementById("profileEmail").value =
      user.email || "";

    loadSavedAddress();
  }


  /* =========================
     PROFILE
  ========================= */

  async function saveProfile(){

    if(!currentUser){
      alert("कृपया पहले Customer Login करें।");
      return;
    }

    const name =
      document.getElementById("profileName").value.trim();

    const phone =
      document.getElementById("profilePhone").value.trim();

    if(!name){
      alert("Full Name डालें।");
      return;
    }

    const {error} =
      await supabaseClient
      .from("profiles")
      .update({
        full_name:name,
        phone:phone
      })
      .eq("id",currentUser.id);

    if(error){

      console.error(error);

      alert("Profile save नहीं हो पाया।");

      return;
    }

    document.getElementById("customerName").innerText =
      name;

    document.getElementById("customerPhone").innerText =
      "📱 " + (phone || "Not added");

    alert("✅ Profile saved successfully.");
  }


  /* =========================
     ADDRESS
  ========================= */

  function loadSavedAddress(){

    try{

      const saved =
        JSON.parse(
          localStorage.getItem(
            "br_customer_address"
          ) || "null"
        );

      if(!saved) return;

      document.getElementById("address").value =
        saved.address || "";

      document.getElementById("city").value =
        saved.city || "";

      document.getElementById("state").value =
        saved.state || "";

      document.getElementById("pincode").value =
        saved.pincode || "";

      if(saved.latitude && saved.longitude){

        showLocationInfo(
          saved.latitude,
          saved.longitude
        );
      }

    }catch(e){
      console.error(e);
    }
  }


  function saveAddress(){

    const data = {

      address:
        document.getElementById("address").value.trim(),

      city:
        document.getElementById("city").value.trim(),

      state:
        document.getElementById("state").value.trim(),

      pincode:
        document.getElementById("pincode").value.trim()

    };


    const old =
      JSON.parse(
        localStorage.getItem(
          "br_customer_address"
        ) || "{}"
      );


    const finalData = {
      ...old,
      ...data
    };


    localStorage.setItem(
      "br_customer_address",
      JSON.stringify(finalData)
    );


    alert("✅ Address saved successfully.");
  }


  /* =========================
     GPS LOCATION
  ========================= */

  function getCurrentLocation(){

    if(!navigator.geolocation){

      alert(
        "इस device/browser में GPS location उपलब्ध नहीं है।"
      );

      return;
    }


    const button =
      document.querySelector(".location-btn");

    button.innerText =
      "⏳ Location प्राप्त हो रही है...";


    navigator.geolocation.getCurrentPosition(

      async position => {

        const latitude =
          position.coords.latitude;

        const longitude =
          position.coords.longitude;


        const old =
          JSON.parse(
            localStorage.getItem(
              "br_customer_address"
            ) || "{}"
          );


        localStorage.setItem(
          "br_customer_address",
          JSON.stringify({
            ...old,
            latitude,
            longitude
          })
        );


        showLocationInfo(
          latitude,
          longitude
        );


        button.innerText =
          "📍 Location Updated";

        await reverseGeocode(
          latitude,
          longitude
        );

      },

      error => {

        console.error(error);

        button.innerText =
          "📍 Use Current Location";

        alert(
          "Location permission allow करें और फिर दोबारा कोशिश करें।"
        );

      },

      {
        enableHighAccuracy:true,
        timeout:15000,
        maximumAge:0
      }

    );

  }


  function showLocationInfo(
    latitude,
    longitude
  ){

    const box =
      document.getElementById("locationInfo");

    box.style.display = "block";

    box.innerHTML = `
      📍 <strong>Current Location</strong><br>
      Latitude: ${Number(latitude).toFixed(6)}<br>
      Longitude: ${Number(longitude).toFixed(6)}
    `;
  }


  /* =========================
     REVERSE GEOCODING
  ========================= */

  async function reverseGeocode(
    latitude,
    longitude
  ){

    try{

      const response =
        await fetch(
          `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=en`
        );

      const data =
        await response.json();


      const city =
        data.city ||
        data.locality ||
        data.principalSubdivision ||
        "";

      const state =
        data.principalSubdivision ||
        "";

      const pincode =
        data.postcode ||
        "";


      if(city)
        document.getElementById("city").value =
          city;

      if(state)
        document.getElementById("state").value =
          state;

      if(pincode)
        document.getElementById("pincode").value =
          pincode;


    }catch(error){

      console.error(
        "Reverse geocoding error:",
        error
      );

    }

  }


  /* =========================
     PANELS
  ========================= */

  function showPanel(id){

    document
      .querySelectorAll(".panel")
      .forEach(panel =>
        panel.classList.remove("show")
      );

    const panel =
      document.getElementById(id);

    if(panel){

      panel.classList.add("show");

      panel.scrollIntoView({
        behavior:"smooth",
        block:"start"
      });

    }
  }


  /* =========================
     NAVIGATION
  ========================= */

  function goHome(){
    window.location.href =
      "index.html";
  }

  function openCategories(){
    window.location.href =
      "categories.html";
  }

  function openMarket(){
    window.location.href =
      "market.html";
  }

  function openOrders(){
    window.location.href =
      "orders.html";
  }

  function openCart(){
    window.location.href =
      "cart.html";
  }


  /* =========================
     WISHLIST
  ========================= */

  function showWishlist(){

    let wishlist = [];

    try{
      wishlist =
        JSON.parse(
          localStorage.getItem(
            "br_wishlist"
          ) || "[]"
        );
    }catch(e){
      wishlist=[];
    }

    if(!wishlist.length){

      alert("❤️ आपकी Wishlist अभी खाली है।");

      return;
    }

    alert(
      "❤️ Wishlist में " +
      wishlist.length +
      " product हैं।"
    );
  }


  /* =========================
     SUPPORT
  ========================= */

  function showSupport(){

    alert(
      "🎧 Help & Support\n\n" +
      "BR Digital Marketplace Customer Support\n\n" +
      "Order या account से जुड़ी सहायता के लिए support से संपर्क करें।"
    );

  }


  /* =========================
     SETTINGS
  ========================= */

  function showSettings(){

    alert(
      "⚙️ Settings\n\n" +
      "Customer account settings यहाँ manage किए जा सकते हैं।"
    );

  }


  /* =========================
     LOGOUT
  ========================= */

  async function logout(){

    if(!currentUser){

      window.location.href =
        "login.html";

      return;
    }


    const confirmLogout =
      confirm(
        "क्या आप Customer Account से Logout करना चाहते हैं?"
      );


    if(!confirmLogout) return;


    await supabaseClient.auth.signOut();

    window.location.href =
      "index.html";
  }


  /* =========================
     START
  ========================= */

  loadCustomer();

</script>

</body>
        </html>
