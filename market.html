<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Market | BR Digital Marketplace</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial, sans-serif;
      background:#f5f6f7;
      color:#202124;
      padding-bottom:75px;
    }

    /* HEADER */
    .header{
      position:sticky;
      top:0;
      z-index:1000;
      background:#fff;
      padding:14px 15px 12px;
      box-shadow:0 2px 10px rgba(0,0,0,.08);
    }

    .top{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .back{
      width:42px;
      height:42px;
      border:0;
      border-radius:12px;
      background:#f1f3f4;
      font-size:21px;
      cursor:pointer;
    }

    .brand{
      flex:1;
    }

    .brand h1{
      font-size:19px;
      color:#087f45;
      font-weight:900;
    }

    .brand p{
      font-size:11px;
      color:#777;
      margin-top:3px;
    }

    .cart-btn{
      width:42px;
      height:42px;
      border:0;
      border-radius:12px;
      background:#087f45;
      color:white;
      font-size:20px;
      cursor:pointer;
      position:relative;
    }

    /* SEARCH */
    .search-box{
      margin-top:12px;
      display:flex;
      align-items:center;
      background:#f1f3f4;
      border-radius:14px;
      padding:0 13px;
      height:48px;
    }

    .search-box span{
      font-size:19px;
    }

    .search-box input{
      flex:1;
      border:0;
      outline:0;
      background:transparent;
      padding:0 10px;
      font-size:14px;
    }

    /* PAGE */
    .container{
      max-width:1100px;
      margin:auto;
      padding:18px 14px;
    }

    .market-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:15px;
    }

    .market-title h2{
      font-size:21px;
      font-weight:900;
    }

    .market-title span{
      font-size:12px;
      color:#777;
    }

    /* PRODUCTS */
    .products{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:14px;
    }

    .product{
      background:#fff;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 2px 10px rgba(0,0,0,.07);
      cursor:pointer;
      transition:.2s;
    }

    .product:active{
      transform:scale(.98);
    }

    .image-box{
      width:100%;
      aspect-ratio:1/1;
      background:#f2f3f4;
      position:relative;
      overflow:hidden;
    }

    .image-box img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .no-image{
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#999;
      font-size:13px;
    }

    .product-info{
      padding:11px;
    }

    .category{
      font-size:10px;
      color:#087f45;
      font-weight:800;
      margin-bottom:5px;
      text-transform:uppercase;
    }

    .product-name{
      font-size:14px;
      font-weight:800;
      line-height:1.3;
      min-height:36px;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .brand{
      font-size:11px;
      color:#777;
      margin-top:5px;
    }

    .price{
      font-size:17px;
      font-weight:900;
      margin-top:9px;
    }

    .stock{
      font-size:11px;
      margin-top:5px;
    }

    .in-stock{
      color:#087f45;
    }

    .out-stock{
      color:#d93025;
    }

    .add-btn{
      width:100%;
      margin-top:9px;
      height:38px;
      border:0;
      border-radius:10px;
      background:#087f45;
      color:#fff;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
    }

    .add-btn:disabled{
      background:#aaa;
      cursor:not-allowed;
    }

    /* LOADING */
    .loading{
      text-align:center;
      padding:50px 15px;
      color:#777;
      font-size:14px;
    }

    .empty{
      text-align:center;
      background:#fff;
      border-radius:16px;
      padding:45px 20px;
      color:#777;
    }

    .empty-icon{
      font-size:42px;
      margin-bottom:12px;
    }

    .empty h3{
      color:#333;
      margin-bottom:7px;
    }

    .error{
      text-align:center;
      padding:35px 15px;
      color:#d93025;
      background:#fff;
      border-radius:16px;
    }

    /* BOTTOM NAV */
    .bottom-nav{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      height:65px;
      background:#fff;
      border-top:1px solid #e5e5e5;
      display:flex;
      justify-content:space-around;
      align-items:center;
      z-index:2000;
      box-shadow:0 -3px 15px rgba(0,0,0,.08);
    }

    .bottom-item{
      border:0;
      background:transparent;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:4px;
      font-size:11px;
      color:#777;
      cursor:pointer;
      min-width:60px;
    }

    .bottom-item .icon{
      font-size:20px;
    }

    .bottom-item.active{
      color:#087f45;
      font-weight:900;
    }

    /* MOBILE */
    @media(max-width:800px){
      .products{
        grid-template-columns:repeat(3,1fr);
      }
    }

    @media(max-width:600px){
      .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
      }

      .container{
        padding:15px 10px;
      }

      .product-info{
        padding:9px;
      }

      .product-name{
        font-size:13px;
      }

      .price{
        font-size:16px;
      }

      .add-btn{
        height:36px;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="header">

    <div class="top">

      <button class="back" onclick="goHome()">←</button>

      <div class="brand">
        <h1>BR Digital Marketplace</h1>
        <p>🏪 Market • Shop Local • Support Bihar ❤️</p>
      </div>

      <button class="cart-btn" onclick="openCart()">🛒</button>

    </div>

    <div class="search-box">
      <span>🔍</span>

      <input
        type="search"
        id="searchInput"
        placeholder="Search products..."
        oninput="searchProducts()">
    </div>

  </header>


  <!-- MAIN -->
  <main class="container">

    <div class="market-title">

      <h2>All Products</h2>

      <span id="productCount">
        Loading...
      </span>

    </div>


    <div id="products" class="products">

      <div class="loading">
        ⏳ Products loading...
      </div>

    </div>

  </main>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <button
      class="bottom-item"
      onclick="goHome()">

      <span class="icon">🏠</span>

      Home

    </button>


    <button
      class="bottom-item"
      onclick="openCategories()">

      <span class="icon">▦</span>

      Categories

    </button>


    <button
      class="bottom-item active">

      <span class="icon">🏪</span>

      Market

    </button>


    <button
      class="bottom-item"
      onclick="openOrders()">

      <span class="icon">📦</span>

      Orders

    </button>


    <button
      class="bottom-item"
      onclick="openAccount()">

      <span class="icon">👤</span>

      Account

    </button>

  </nav>


  <script>

    /* =========================
       SUPABASE
    ========================= */

    const SUPABASE_URL =
      "https://uryjmibcdfjfxoljrigt.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_uYbJw0ARCCkCpQ9QB6FxaQ_JrIxtOOp";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    let allProducts = [];


    /* =========================
       LOAD ONLY APPROVED + AI PRODUCTS
    ========================= */

    async function loadProducts(){

      const container =
        document.getElementById("products");

      try{

        const { data, error } =
          await supabaseClient

          .from("products")

          .select(`
            id,
            product_name,
            brand,
            category,
            product_type,
            description,
            price,
            stock,
            ai_image_url,
            seller_name,
            status,
            seller_id
          `)

          .eq(
            "status",
            "approved"
          )

          .not(
            "ai_image_url",
            "is",
            null
          )

          .order(
            "created_at",
            {
              ascending:false
            }
          );


        if(error){

          throw error;

        }


        allProducts =
          data || [];


        renderProducts(
          allProducts
        );


      }catch(error){

        console.error(
          error
        );


        document.getElementById(
          "productCount"
        ).innerText =
          "Error";


        container.innerHTML = `
          <div class="error">
            ❌ Products load नहीं हो पाए।<br><br>
            कृपया internet connection check करें।
          </div>
        `;

      }

    }


    /* =========================
       RENDER PRODUCTS
    ========================= */

    function renderProducts(
      products
    ){

      const container =
        document.getElementById(
          "products"
        );


      document.getElementById(
        "productCount"
      ).innerText =
        products.length +
        " Products";


      if(!products.length){

        container.innerHTML = `
          <div
            class="empty"
            style="grid-column:1/-1">

            <div class="empty-icon">
              🛍️
            </div>

            <h3>
              No Products Found
            </h3>

            <p>
              अभी कोई approved product उपलब्ध नहीं है।
            </p>

          </div>
        `;

        return;

      }


      container.innerHTML =
        products.map(
          product => {

            const stock =
              Number(
                product.stock || 0
              );


            /* ONLY AI GENERATED IMAGE */

            const image =
              product.ai_image_url
              ?
              `
                <img
                  src="${escapeHtml(
                    product.ai_image_url
                  )}"
                  alt="${escapeHtml(
                    product.product_name ||
                    "Product"
                  )}"
                  loading="lazy"
                  onerror="
                    this.style.display='none';
                    this.parentElement.innerHTML='<div class=no-image>Image unavailable</div>'
                  ">
              `
              :
              `
                <div class="no-image">
                  No Image
                </div>
              `;


            return `

              <article
                class="product"
                onclick="openProduct('${product.id}')">

                <div class="image-box">

                  ${image}

                </div>


                <div class="product-info">

                  ${
                    product.category
                    ?
                    `
                      <div class="category">
                        ${escapeHtml(
                          product.category
                        )}
                      </div>
                    `
                    :
                    ""
                  }


                  <div class="product-name">

                    ${escapeHtml(
                      product.product_name ||
                      "Product"
                    )}

                  </div>


                  ${
                    product.brand
                    ?
                    `
                      <div class="brand">
                        Brand:
                        ${escapeHtml(
                          product.brand
                        )}
                      </div>
                    `
                    :
                    ""
                  }


                  <div class="price">

                    ₹${formatPrice(
                      product.price
                    )}

                  </div>


                  ${
                    stock > 0
                    ?
                    `
                      <div class="stock in-stock">
                        ✓ ${stock} in stock
                      </div>
                    `
                    :
                    `
                      <div class="stock out-stock">
                        Out of stock
                      </div>
                    `
                  }


                  <button
                    class="add-btn"
                    ${stock <= 0 ? "disabled" : ""}
                    onclick="
                      event.stopPropagation();
                      addToCart('${product.id}')
                    ">

                    ${
                      stock > 0
                      ?
                      "🛒 Add to Cart"
                      :
                      "Out of Stock"
                    }

                  </button>

                </div>

              </article>

            `;

          }
        ).join("");

    }


    /* =========================
       SEARCH
    ========================= */

    function searchProducts(){

      const search =
        document
          .getElementById(
            "searchInput"
          )
          .value
          .trim()
          .toLowerCase();


      if(!search){

        renderProducts(
          allProducts
        );

        return;

      }


      const filtered =
        allProducts.filter(
          product => {

            return (

              (product.product_name || "")
                .toLowerCase()
                .includes(search)

              ||

              (product.brand || "")
                .toLowerCase()
                .includes(search)

              ||

              (product.category || "")
                .toLowerCase()
                .includes(search)

              ||

              (product.product_type || "")
                .toLowerCase()
                .includes(search)

            );

          }
        );


      renderProducts(
        filtered
      );

    }


    /* =========================
       PRODUCT DETAILS
    ========================= */

    function openProduct(
      id
    ){

      window.location.href =
        "product-details.html?id=" +
        encodeURIComponent(id);

    }


    /* =========================
       CART
    ========================= */

    function addToCart(
      id
    ){

      const product =
        allProducts.find(
          p =>
            String(p.id) ===
            String(id)
        );


      if(!product){

        return;

      }


      const stock =
        Number(
          product.stock || 0
        );


      if(stock <= 0){

        alert(
          "यह product अभी stock में नहीं है।"
        );

        return;

      }


      let cart = [];


      try{

        cart =
          JSON.parse(
            localStorage.getItem(
              "br_cart"
            ) || "[]"
          );

      }catch(e){

        cart = [];

      }


      const existing =
        cart.find(
          item =>
            String(item.id) ===
            String(product.id)
        );


      if(existing){

        if(
          existing.quantity >=
          stock
        ){

          alert(
            "इतना stock उपलब्ध नहीं है।"
          );

          return;

        }


        existing.quantity += 1;

      }else{

        cart.push({

          id:
            product.id,

          product_name:
            product.product_name,

          price:
            Number(
              product.price || 0
            ),

          /* ONLY AI IMAGE */

          ai_image_url:
            product.ai_image_url || "",

          seller_id:
            product.seller_id || null,

          seller_name:
            product.seller_name || "",

          quantity:1

        });

      }


      localStorage.setItem(
        "br_cart",
        JSON.stringify(cart)
      );


      alert(
        "✅ Product cart में add हो गया।"
      );

    }


    function openCart(){

      window.location.href =
        "cart.html";

    }


    /* =========================
       NAVIGATION
    ========================= */

    function goHome(){

      window.location.href =
        "index.html";

    }


    function openCategories(){

      window.location.href =
        "categories.html";

    }


    function openOrders(){

      window.location.href =
        "orders.html";

    }


    function openAccount(){

      window.location.href =
        "account.html";

    }


    /* =========================
       HELPERS
    ========================= */

    function formatPrice(
      value
    ){

      const number =
        Number(
          value || 0
        );


      return number.toLocaleString(
        "en-IN",
        {
          maximumFractionDigits:2
        }
      );

    }


    function escapeHtml(
      value
    ){

      return String(
        value ?? ""
      )

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

    }


    /* =========================
       START
    ========================= */

    loadProducts();

  </script>

</body>
</html>
